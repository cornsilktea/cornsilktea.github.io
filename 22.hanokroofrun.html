<script>
(() => {
'use strict';

const GRAVITY = 1600;
const JUMP_VY = -640;
const WIRE_RANGE = 540;
const PIVOT_Y = -330;
const PAGODA_H = 640, PAGODA_W = 194;
const ROOF_H = 100;
const CAT_H = 110;
const CAT_IMG_PAD = 5;
const CAT_SINK = 20;
const FLIP_AFTER = 0.45;

const STAGE_PARAMS = [null,
  { speed: 300, len: 8000 },
  { speed: 320, len: 9500 },
  { speed: 340, len: 11000 },
  { speed: 360, len: 12500 },
  { speed: 390, len: 14500 },
  { speed: 410, len: 16000 },
  { speed: 430, len: 17500 },
  { speed: 450, len: 19000 },
  { speed: 470, len: 20500 },
  { speed: 490, len: 22000 },
];
const STAGE_MAX = STAGE_PARAMS.length - 1;
const WALL_TOP = -190;
const EDGE_TOL = 22;
const COYOTE_T = 0.18;
const LAND_TOL = 34;
const LAND_Y = 40;
const LAND_Y_FALL = 12;
const SILVER_PT = 5, GOLD_PT = 20;

let imagesReady = false;
let imagesPending = 0;
function loadImageSet(sources) {
  const images = {};
  Object.keys(sources).forEach(k => {
    const im = new Image();
    imagesPending++;
    im.onload = im.onerror = () => { if (--imagesPending === 0) imagesReady = true; };
    im.src = sources[k];
    images[k] = im;
  });
  return images;
}
const IMG = loadImageSet(IMG_SRC);
const IMG_BLACK = loadImageSet(IMG_SRC_BLACK);
const IMG_CALICO = loadImageSet(IMG_SRC_CALICO);
const SKINS = {
  yellow: { imgs: IMG, runFrames: 7, catH: 100, runRate: 1, fix: { run: 0.76, jump: 0.76, throw: 0.76, swing: 0.83, flip1: 0.79, flip2: 0.79, flip3: 0.79, flip4: 0.79 },
            anchors: { throw: [0.97, 0.28], swing: [0.83, 0.02], flip1: [0.73, 0.02], flip2: [0.97, 0.02], flip3: [0.76, 0.02], flip4: [0.85, 0.02] } },
  black:  { imgs: IMG_BLACK, runFrames: 7, catH: 105, runRate: 1, fix: {},
            anchors: { throw: [0.97, 0.33], swing: [0.74, 0.14], flip1: [0.90, 0.20], flip2: [0.82, 0.20], flip3: [0.72, 0.28], flip4: [0.88, 0.20] } },
  calico: { imgs: IMG_CALICO, runFrames: 7, catH: 100, runRate: 1, fix: {},
            anchors: { throw: [0.993, 0.31], swing: [0.774, 0.118], flip1: [0.976, 0.106], flip2: [0.92, 0.019], flip3: [0.898, 0.211], flip4: [0.968, 0.159] } },
};
let skin = 'yellow';

const SAVE_KEY = 'hanokroofrun_best_v2';
function loadBest() { try { return parseInt(localStorage.getItem(SAVE_KEY)) || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem(SAVE_KEY, String(v)); } catch (e) {} }
let best = loadBest();

const Hall = window.WorldRecord ? WorldRecord('hanokroofrun', { format: v => v + '점' }) : null;
function hallText() {
  if (!Hall) return '';
  if (!Hall.loaded) return Hall.url() ? '세계 신기록을 불러오지 못했습니다' : '';
  const r = Hall.rec;
  const world = r ? '🏆 세계 신기록 <em>' + r.score + '</em>점<small>' + Hall.escapeHtml(Hall.who()) + '</small>'
                  : '🏆 세계 신기록 없음 — 첫 기록에 도전!';
  const C = Hall.cls;
  if (!C) return world;
  const cr = C.rec;
  return world + '<br>' + (cr ? '🏫 우리 반 신기록 <em>' + cr.score + '</em>점<small>' + Hall.escapeHtml(C.who()) + '</small>'
                               : '🏫 우리 반 신기록 없음 — 첫 기록에 도전!');
}

let actx = null;
function beep(freq, dur, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function buildCourse() {
  const rnd = mulberry32(7919 * 6 + 13);
  const R = (a, b) => a + rnd() * (b - a);
  const roofs = [], pagodas = [], coins = [], stageStarts = [];
  let x = -600;
  const addRoof = (w) => { roofs.push({ x0: x, x1: x + w }); x += w; return roofs[roofs.length - 1]; };
  const coin = (cx, cy, gold) => coins.push({ x: cx, y: cy, gold, got: false });
  const silverRow = (x0, x1, y) => {
    const cnt = Math.min(6, Math.floor((x1 - x0 - 100) / 60)); if (cnt < 2) return;
    const start = x0 + ((x1 - x0) - (cnt - 1) * 60) / 2;
    for (let i = 0; i < cnt; i++) coin(start + i * 60, y || -80, false);
  };
  const arc = (x0, w) => { for (let i = 0; i < 3; i++) { const t = (i + 1) / 4; coin(x0 + w * t, -110 - Math.sin(t * Math.PI) * 60, false); } };
  const pagodaGap = (w, cnt, jitter) => {
    const gx = x;
    for (let i = 0; i < cnt; i++) {
      let px = gx + w * (i + 1) / (cnt + 1);
      if (jitter) px += R(-jitter, jitter);
      pagodas.push({ x: px });
    }
    pagodas.slice(-cnt).forEach((p, i) => {
      if (i % 2 === 0) coin(p.x + 230, -170, true); else { coin(p.x + 200, -150, false); coin(p.x + 270, -170, false); }
      coin(p.x - 190, -150, false);
    });
    x += w;
  };
  const smallGap = (w) => { arc(x, w); x += w; };
  const goldOverRoof = (r) => coin((r.x0 + r.x1) / 2, -180, true);
  const threeCell = () => {
    for (let i = 0; i < 3; i++) { const gw = 200; coin(x + gw / 2, -150, true); x += gw; addRoof(170); }
  };
  const threeCellHard = () => {
    for (let i = 0; i < 3; i++) { const gw = 230; coin(x + gw / 2, -150, true); x += gw; addRoof(150); }
  };
  const bait = () => {
    const gx = x, w = 640;
    roofs.push({ x0: gx + 225, x1: gx + 325 }); coin(gx + 275, -95, true);
    pagodas.push({ x: gx + w * 0.63 }); coin(gx + w * 0.63 + 230, -160, false);
    x += w;
  };
  const wallGap = (nPag) => {
    let px = x + R(380, 430);
    for (let i = 0; i < nPag; i++) { pagodas.push({ x: px }); coin(px - 170, -150, false); if (i < nPag - 1) px += R(380, 420); }
    const wx0 = px + R(175, 200), ww = R(130, 160);
    roofs.push({ x0: wx0, x1: wx0 + ww, top: WALL_TOP });
    coin(wx0 + ww / 2, WALL_TOP - 90, true);
    x = wx0 + ww;
    const landR = addRoof(R(280, 360)); silverRow(landR.x0, landR.x1);
  };

  addRoof(1100);
  for (let n = 1; n <= STAGE_MAX; n++) {
  const P = STAGE_PARAMS[n];
  const stageEnd = x + P.len;
  stageStarts.push(x);
  for (let seg = 0; x < stageEnd; seg++) {
    const r = rnd();
    if (n === 1) {
      const roof = addRoof(R(300, 480)); silverRow(roof.x0, roof.x1); if (r < 0.2) goldOverRoof(roof);
      if (rnd() < 0.5) smallGap(R(130, 190)); else pagodaGap(R(400, 470), 1);
    } else if (n === 2) {
      const roof = addRoof(R(280, 440)); silverRow(roof.x0, roof.x1); if (r < 0.15) goldOverRoof(roof);
      const q = rnd();
      if (q < 0.4) smallGap(R(150, 200)); else if (q < 0.7) pagodaGap(R(440, 500), 1); else pagodaGap(R(780, 880), 2);
    } else if (n === 3) {
      const roof = addRoof(R(260, 420)); silverRow(roof.x0, roof.x1);
      const q = rnd();
      if (q < 0.3) smallGap(R(170, 220)); else if (q < 0.5) pagodaGap(R(800, 900), 2); else if (q < 0.75) pagodaGap(R(1050, 1150), 3); else bait();
    } else if (n === 4) {
      const roof = addRoof(R(260, 400)); silverRow(roof.x0, roof.x1);
      const q = rnd();
      if (q < 0.25) smallGap(R(180, 220)); else if (q < 0.45) pagodaGap(R(800, 900), 2); else if (q < 0.7) threeCell(); else pagodaGap(R(1500, 1900), 4 + (rnd() < 0.5 ? 1 : 0));
    } else if (n === 5) {
      const roof = addRoof(R(240, 380)); silverRow(roof.x0, roof.x1);
      const q = rnd();
      if (q < 0.2) smallGap(R(190, 230)); else if (q < 0.35) pagodaGap(R(480, 520), 1); else if (q < 0.5) threeCell(); else if (q < 0.7) pagodaGap(R(1500, 1900), 4 + Math.floor(rnd() * 2), 70); else pagodaGap(R(1900, 2300), 5 + Math.floor(rnd() * 2), 70);
    } else if (n === 6) {
      const roof = addRoof(R(220, 340)); silverRow(roof.x0, roof.x1);
      const q = rnd();
      if (q < 0.15) smallGap(R(200, 240)); else if (q < 0.3) pagodaGap(R(500, 540), 1, 40); else if (q < 0.45) threeCell(); else if (q < 0.6) bait(); else if (q < 0.8) pagodaGap(R(1700, 2100), 5 + Math.floor(rnd() * 2), 80); else pagodaGap(R(2200, 2600), 6 + Math.floor(rnd() * 2), 60);
    } else if (n === 7) {
      const roof = addRoof(R(200, 320)); silverRow(roof.x0, roof.x1);
      const q = rnd();
      if (q < 0.1) smallGap(R(210, 250)); else if (q < 0.25) pagodaGap(R(520, 560), 1, 60); else if (q < 0.4) bait(); else if (q < 0.55) threeCell(); else if (q < 0.8) pagodaGap(R(2000, 2400), 6 + Math.floor(rnd() * 2), 70); else pagodaGap(R(2600, 3000), 7 + Math.floor(rnd() * 2), 60);
    } else if (n === 8) {
      const roof = addRoof(R(150, 230)); silverRow(roof.x0, roof.x1);
      const q = rnd();
      if (q < 0.06) smallGap(R(240, 280)); else if (q < 0.16) pagodaGap(R(560, 600), 1, 70); else if (q < 0.3) { bait(); const mid = addRoof(R(170, 220)); silverRow(mid.x0, mid.x1); bait(); } else if (q < 0.42) threeCellHard(); else if (q < 0.72) pagodaGap(R(3200, 3600), 7 + Math.floor(rnd() * 2), 70); else pagodaGap(R(4000, 4400), 8 + Math.floor(rnd() * 2), 60);
    } else if (n === 9) {
      const roof = addRoof(R(140, 210)); silverRow(roof.x0, roof.x1);
      const q = rnd();
      if (seg % 3 === 1) wallGap(1);
      else if (q < 0.05) smallGap(R(250, 290)); else if (q < 0.15) pagodaGap(R(580, 620), 1, 80); else if (q < 0.28) { bait(); const mid = addRoof(R(160, 200)); silverRow(mid.x0, mid.x1); bait(); } else if (q < 0.4) threeCellHard(); else if (q < 0.7) pagodaGap(R(3600, 4000), 8 + Math.floor(rnd() * 2), 80); else pagodaGap(R(4400, 4800), 9 + Math.floor(rnd() * 2), 50);
    } else {
      const roof = addRoof(R(130, 190)); silverRow(roof.x0, roof.x1);
      const q = rnd();
      if (seg % 2 === 1) { const k = Math.floor(seg / 2) % 3; if (k === 0) wallGap(1); else if (k === 1) wallGap(2); else { wallGap(1); wallGap(1); } }
      else if (q < 0.04) smallGap(R(260, 300)); else if (q < 0.12) pagodaGap(R(600, 640), 1, 80); else if (q < 0.27) { bait(); const mid = addRoof(R(150, 190)); silverRow(mid.x0, mid.x1); bait(); } else if (q < 0.4) threeCellHard(); else if (q < 0.7) pagodaGap(R(4000, 4400), 9 + Math.floor(rnd() * 2), 80); else pagodaGap(R(4600, 5000), 10 + Math.floor(rnd() * 2), 50);

    let i = 0; for (let px = off - fw * 2; px < cw; px += fw, i++) drawFarTile(im, px, groundY + 90 * S - fh, fw, fh, i % 2 === 1); }
  { const im = IMG.moon; const ms = 150 * S; const span = cw + ms * 2;
    const mx = mod(MOON_X * S - camX * 0.04 * S, span) - ms; const my = groundY * 0.10;
    ctx.drawImage(im, mx, my, ms, ms); }
  for (const cl of clouds) {
    const im = IMG[cl.img]; const w = cl.size * S, h = w * im.naturalHeight / im.naturalWidth;
    const span = cw + w * 2; const px = mod(cl.x * S - camX * cl.f * S, span) - w;
    ctx.globalAlpha = cl.alpha; ctx.drawImage(im, px, groundY * cl.yF, w, h); ctx.globalAlpha = 1;
  }
  { const im = IMG.stone; const h = 150 * S, w = h * im.naturalWidth / im.naturalHeight; const x = 18 * S, y = sy(4) - h;
    ctx.drawImage(im, x, y, w, h);
    ctx.font = 'bold ' + Math.round(22 * S) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#f4f6ff';
    ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 6;
    ctx.fillText('최고 기록', x + w / 2, y - 34 * S); ctx.fillText(Math.max(best, score) + '점', x + w / 2, y - 8 * S); ctx.shadowBlur = 0; }
  { const im = IMG.pagoda; const h = PAGODA_H * S, w = PAGODA_W * S;
    for (const p of stage.pagodas) { const x = sx(p.x); if (x < -w || x > cw + w) continue; ctx.drawImage(im, x - w / 2, sy(PIVOT_Y) - 10 * S, w, h); } }
  for (const r of stage.roofs) { if (sx(r.x1) < -50 || sx(r.x0) > cw + 50) continue; drawRoofSeg(r); }
  { const gx = sx(stage.goalX); if (gx > -80 && gx < cw + 80) {
      ctx.strokeStyle = '#f4f6ff'; ctx.lineWidth = 4 * S; ctx.beginPath(); ctx.moveTo(gx, sy(0)); ctx.lineTo(gx, sy(-190)); ctx.stroke();
      ctx.fillStyle = '#f4f6ff'; ctx.beginPath(); ctx.arc(gx, sy(-220), 34 * S, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1b2350'; ctx.font = 'bold ' + Math.round(40 * S) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('G', gx, sy(-218)); ctx.textBaseline = 'alphabetic';
    } }
  { const cs = 44 * S;
    for (const co of stage.coins) { if (co.got) continue; const x = sx(co.x); if (x < -cs || x > cw + cs) continue;
      const fl = Math.sin(timeT * 5 + co.x * 0.02) * 3 * S; ctx.drawImage(IMG[co.gold ? 'gold' : 'silver'], x - cs / 2, sy(co.y) - cs / 2 + fl, cs, cs); } }
  drawRope();
  drawCat();

  if (mode === 'play' && bannerT > 0) {
    const a = Math.min(1, bannerT / 0.5);
    ctx.globalAlpha = a; ctx.fillStyle = '#f4f6ff'; ctx.font = 'bold ' + Math.round(Math.min(48, cw / 12)) + 'px sans-serif'; ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 8;
    ctx.fillText('스테이지 ' + curStage, cw / 2, groundY - 300 * S > 140 ? groundY - 300 * S : ch * 0.4); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  if (mode === 'ready') {
    ctx.fillStyle = 'rgba(244,246,255,0.92)';
    const bw = Math.min(cw * 0.9, 560), bh = 80 * Math.min(S, 1.4), bx = cw / 2 - bw / 2, by = groundY - 330 * S > 120 ? groundY - 330 * S : ch * 0.42;
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 16); ctx.fill();
    ctx.fillStyle = '#1b2350'; ctx.font = 'bold ' + Math.round(Math.min(30, bw / 16)) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('스페이스바 또는 화면 터치로 출발!', cw / 2, by + bh / 2); ctx.textBaseline = 'alphabetic';
  }
  drawMinimap();
}
function drawSkyOnly() {
  const im = IMG.far; const fh = ch * 0.75, fw = fh * im.naturalWidth / im.naturalHeight;
  let i = 0; for (let px = 0; px < cw; px += fw, i++) drawFarTile(im, px, ch * 0.75 - fh, fw, fh, i % 2 === 1);
  ctx.drawImage(IMG.moon, cw * 0.72, ch * 0.06, 150 * S, 150 * S);
}
function drawMinimap() {
  const w = mini.width / dpr, h = mini.height / dpr;
  mctx.clearRect(0, 0, w, h);
  const x0 = 14, x1 = w - 30, wx0 = -600, wx1 = stage.goalX;
  const mx = (wx) => x0 + (wx - wx0) / (wx1 - wx0) * (x1 - x0);
  mctx.lineCap = 'round';
  mctx.strokeStyle = '#c3c9e8'; mctx.lineWidth = Math.max(4, h * 0.22); mctx.beginPath(); mctx.moveTo(x0, h / 2); mctx.lineTo(x1, h / 2); mctx.stroke();
  const cx = mx(Math.max(wx0, Math.min(wx1, cat.x)));
  mctx.strokeStyle = '#1b2350'; mctx.beginPath(); mctx.moveTo(x0, h / 2); mctx.lineTo(cx, h / 2); mctx.stroke();
  mctx.font = 'bold ' + Math.round(h * 0.5) + 'px sans-serif'; mctx.textAlign = 'center'; mctx.textBaseline = 'middle';
  stage.stageStarts.forEach((sxx, i) => {
    const px = mx(sxx);
    mctx.fillStyle = '#f4f6ff'; mctx.beginPath(); mctx.arc(px, h / 2, h * 0.36, 0, Math.PI * 2); mctx.fill();
    mctx.strokeStyle = '#1b2350'; mctx.lineWidth = 2; mctx.stroke();
    mctx.fillStyle = '#1b2350'; mctx.fillText(String(i + 1), px, h / 2 + 1);
  });
  mctx.fillStyle = '#1b2350'; mctx.font = 'bold ' + Math.round(h * 0.7) + 'px sans-serif'; mctx.textAlign = 'center'; mctx.textBaseline = 'middle'; mctx.fillText('G', x1 + 14, h / 2);
  mctx.fillStyle = '#f5a623'; mctx.beginPath(); mctx.arc(cx, h / 2, h * 0.32, 0, Math.PI * 2); mctx.fill();
  mctx.strokeStyle = '#1b2350'; mctx.lineWidth = 2; mctx.stroke();
}

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  const steps = 2; for (let i = 0; i < steps; i++) update(dt / steps);
  draw();
  requestAnimationFrame(frame);
}
if (!ctx.roundRect) ctx.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };
window.__hr = () => ({ cat, stage, mode, score, camX, curStage, press, release, update, draw });
resize();
showMenu();
requestAnimationFrame(frame);
})();
