<!DOCTYPE html>
<html lang="ko">
<head>
<script charset="utf-8" src="firebase-config.js"></script>
<script charset="utf-8" src="access-guard.js" data-game="timeguess"></script>
<script charset="utf-8" src="world-record.js"></script>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- 링크 미리보기(제어판 제목) 시작 — 링크제목맞추기.ps1 이 채웁니다. 손으로 고치지 마세요. -->
<title>5초 타이머 맞히기</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="정보 수업용 링크 모음">
<meta property="og:title" content="5초 타이머 맞히기">
<meta property="og:description" content="시간 감각 워밍업 / 1회 개인전">
<meta property="og:url" content="https://cornsilktea.github.io/21.timeguess.html">
<meta property="og:image" content="https://cornsilktea.github.io/icon-512.png">
<meta name="twitter:card" content="summary">
<!-- 링크 미리보기 끝 -->
<style>
  :root{
    --bg:var(--sg-bg);
    --panel:var(--sg-panel);
    --line:var(--sg-line-strong);
    --text:var(--sg-ink);
    --sub:var(--sg-ink-soft);
    --tone:var(--sg-panel-alt);
    --primary:var(--sg-primary);
    --radius:var(--sg-radius);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:var(--sg-font);font-size:16px;line-height:1.45;overscroll-behavior:none}
  body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px;
    transition:background-color .3s}
  /* 측정 중에는 화면 전체가 옅은 녹색으로 바뀌고 천천히 숨 쉬듯 밝아졌다 어두워집니다. */
  body.running{background:var(--sg-primary-soft);animation:breathe 2s ease-in-out infinite}
  @keyframes breathe{0%,100%{background-color:var(--sg-primary-soft)}50%{background-color:var(--tone)}}

  /* 상단 기록 칸: 개인 최고 기록(이 기기) · 세계 신기록(모든 학생 공통). 5초와의 차이가 가장 작은 시도 */
  .records{width:100%;max-width:560px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .best{padding:10px 12px;text-align:center;word-break:keep-all;
    background:var(--panel);border:2px solid var(--line);border-radius:var(--radius)}
  .best .lab{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px}
  .best .val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
  .best .val span{font-weight:400;color:var(--sub)}
  .best .val span.late,.best .val span.early{font-weight:700}
  .best .who{font-size:12px;color:var(--sub);margin-top:3px;min-height:1.3em}
  .best .new{display:inline-block;margin-left:6px;padding:1px 6px;font-size:11px;font-weight:700;
    color:#fff;background:#D97B4F;border-radius:4px;vertical-align:middle}

  .main{flex:1;width:100%;display:flex;align-items:center;justify-content:center}

  /* 화면은 하나씩만 보입니다. 세 화면(시작·측정 중·결과)이 같은 자리에 번갈아 나옵니다. */
  .screen{display:none;width:100%;max-width:560px;text-align:center}
  .screen.on{display:flex;flex-direction:column;align-items:center;gap:28px}

  /* 모든 버튼은 같은 크기·같은 색입니다. (시작 / 종료 / 다시하기) */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:min(100%,320px);min-height:120px;padding:20px 24px;
    font:inherit;font-size:40px;font-weight:700;word-break:keep-all;
    background:var(--panel);color:var(--text);
    border:2px solid var(--line);border-radius:var(--radius);
    cursor:pointer;user-select:none;touch-action:manipulation;
  }
  .btn:hover{background:var(--tone)}
  .btn:active{background:var(--sg-primary-soft)}
  .btn:focus-visible{outline:3px solid var(--primary);outline-offset:3px}

  .lead{margin:0;font-size:22px;color:var(--sub);word-break:keep-all}

  /* 측정 중: 숫자는 절대 보이지 않고, 점 세 개만 천천히 깜빡입니다. */
  .measuring{margin:0;font-size:28px;font-weight:700;color:var(--text)}
  .measuring .dot{display:inline-block;animation:blink 1.2s infinite}
  .measuring .dot:nth-child(2){animation-delay:.2s}
  .measuring .dot:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

  /* 결과: 측정 시간과 오차를 같은 크기로 크게 보여줍니다. */
  .result{display:flex;flex-direction:column;gap:12px;width:100%}
  .result p{margin:0;font-size:36px;font-weight:700;line-height:1.35;word-break:keep-all;
    font-variant-numeric:tabular-nums}
  /* 부호 붙은 차이: 느리면(+) 빨강, 빠르면(−) 파랑, 정확하면 기본색 */
  .late{color:var(--sg-danger) !important}
  .early{color:#2F5FA8 !important}

  @media (max-width:479px){
    .btn{min-height:100px;font-size:32px}
    .lead{font-size:18px}
    .result p{font-size:28px}
    .best .val{font-size:17px}
  }
</style>
</head>
<body>

<!-- 상단 기록: 개인 최고 기록(이 기기) · 세계 신기록(모든 학생 공통) — 5초에 가장 가까운 시도 -->
<div class="records">
  <div class="best">
    <div class="lab">개인 최고 기록</div>
    <div class="val" id="bestVal"><span>아직 없음</span></div>
    <div class="who"></div>
  </div>
  <div class="best">
    <div class="lab">🏆 세계 신기록</div>
    <div class="val" id="worldVal"><span>불러오는 중…</span></div>
    <div class="who" id="worldWho"></div>
  </div>
</div>

<div class="main">
<!-- 1) 시작 화면 -->
<section class="screen on" id="scrStart">
  <p class="lead">시작을 누르고, 딱 5초가 됐다고 생각될 때 종료를 누르세요.</p>
  <button class="btn" id="btnStart" type="button">시작</button>
</section>

<!-- 2) 측정 중 화면 -->
<section class="screen" id="scrRun">
  <p class="measuring" aria-live="polite">측정 중<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></p>
  <button class="btn" id="btnStop" type="button">종료</button>
</section>

<!-- 3) 결과 화면 -->
<section class="screen" id="scrResult">
  <div class="result" aria-live="polite">
    <p id="txtTime"></p>
    <p id="txtDiff"></p>
    <p id="txtSigned"></p>
  </div>
  <button class="btn" id="btnAgain" type="button">다시하기</button>
</section>
</div>

<script>
(function () {
  "use strict";

  var TARGET = 5;                     /* 목표 시간(초) */
  var startAt = 0;                    /* performance.now() 기준 시작 시각(ms) */

  var scrStart  = document.getElementById("scrStart");
  var scrRun    = document.getElementById("scrRun");
  var scrResult = document.getElementById("scrResult");
  var btnStart  = document.getElementById("btnStart");
  var btnStop   = document.getElementById("btnStop");
  var btnAgain  = document.getElementById("btnAgain");
  var txtTime   = document.getElementById("txtTime");
  var txtDiff   = document.getElementById("txtDiff");
  var txtSigned = document.getElementById("txtSigned");
  var bestVal   = document.getElementById("bestVal");
  var worldVal  = document.getElementById("worldVal");
  var worldWho  = document.getElementById("worldWho");

  /* ---------- 최고 기록 ----------
     5초와의 차이(절댓값)가 가장 작은 시도. 같은 기기에서는 새로고침해도 남습니다. */
  var BEST_KEY = "timeguess_best";
  var best = null;                    /* {sec, diff} */
  try {
    var saved = JSON.parse(localStorage.getItem(BEST_KEY));
    if (saved && typeof saved.sec === "number") best = saved;
  } catch (e) {}

  /* 부호 붙은 차이 문구와 색 클래스: 느리면 "+ 0.1234초"(빨강), 빠르면 "- 0.1234초"(파랑) */
  function signed(diff) {
    if (diff === 0) return { text: "±0.0000초", cls: "" };
    if (diff < 0)   return { text: "- " + Math.abs(diff).toFixed(4) + "초", cls: "early" };
    return               { text: "+ " + diff.toFixed(4) + "초", cls: "late" };
  }

  function renderBest(isNew) {
    bestVal.innerHTML = "";
    var s = document.createElement("span");
    if (!best) {
      s.textContent = "아직 없음";
      bestVal.appendChild(s);
      return;
    }
    s.textContent = best.sec.toFixed(4) + "초 (";
    var d = signed(best.diff);
    var em = document.createElement("span");
    em.textContent = d.text;
    em.className = d.cls;
    bestVal.appendChild(s);
    bestVal.appendChild(em);
    bestVal.appendChild(document.createTextNode(")"));
    if (isNew) {
      var n = document.createElement("span");
      n.className = "new";
      n.textContent = "NEW";
      bestVal.appendChild(n);
    }
  }

  function updateBest(sec, diff) {
    if (best && Math.abs(best.diff) <= Math.abs(diff)) return;
    best = { sec: sec, diff: diff };
    try { localStorage.setItem(BEST_KEY, JSON.stringify(best)); } catch (e) {}
    renderBest(true);
  }

  /* ---------- 세계 신기록 (모든 학생 공통, Firebase) ----------
     5초와의 차이(절댓값)를 0.0001초 단위 정수로 저장. 작을수록 좋은 기록(lower:true) */
  var WR = window.WorldRecord
    ? WorldRecord("timeguess", { lower: true, format: function (v) { return "오차 " + (v / 10000).toFixed(4) + "초"; } })
    : null;

  function renderWorld() {
    if (WR && WR.rec) {
      worldVal.textContent = WR.text();
      worldWho.textContent = WR.who();
      return;
    }
    worldVal.innerHTML = "";
    var s = document.createElement("span");
    s.textContent = (WR && !WR.loaded) ? "불러오는 중…" : "아직 없음";
    worldVal.appendChild(s);
    worldWho.textContent = "";
  }
  if (WR) { WR.onChange(renderWorld); WR.load(); }

  function show(scr) {
    [scrStart, scrRun, scrResult].forEach(function (s) { s.classList.remove("on"); });
    scr.classList.add("on");
    document.body.classList.toggle("running", scr === scrRun);
  }

  function start() {
    startAt = performance.now();      /* 화면 전환보다 먼저 시각을 잡아 오차를 줄임 */
    show(scrRun);
    btnStop.focus({ preventScroll: true });
  }

  function stop() {
    var ms = performance.now() - startAt;
    show(scrResult);

    /* 표시할 소수 넷째 자리 값으로 먼저 반올림한 뒤 차이를 구해야
       "3.8213초" 와 "1.1787초 빨랐어요" 가 서로 어긋나지 않습니다. */
    var sec  = Math.round(ms * 10) / 10000;
    var diff = Math.round((sec - TARGET) * 10000) / 10000;
    updateBest(sec, diff);

    txtTime.textContent = sec.toFixed(4) + "초";
    if (diff === 0) {
      txtDiff.textContent = "정확히 맞혔어요!";
    } else if (diff < 0) {
      txtDiff.textContent = TARGET + "초보다 " + Math.abs(diff).toFixed(4) + "초 빨랐어요";
    } else {
      txtDiff.textContent = TARGET + "초보다 " + diff.toFixed(4) + "초 느렸어요";
    }
    var d = signed(diff);
    txtSigned.textContent = d.text;
    txtSigned.className = d.cls;
    btnAgain.focus({ preventScroll: true });
    if (WR) WR.prompt(Math.round(Math.abs(diff) * 10000));   /* 세계 신기록이면 학년·반·이름 입력 창 */
  }

  function again() {
    show(scrStart);
    btnStart.focus({ preventScroll: true });
  }

  /* 손가락이 닿는 순간(pointerdown) 바로 반응해 손을 떼는 시간까지 측정에 섞이지 않게 합니다.
     click 은 쓰지 않으므로 시작 직후 손을 뗄 때 '종료' 가 눌리는 일도 없습니다. */
  function bind(btn, fn) {
    btn.addEventListener("pointerdown", function (e) {
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      fn();
    });
    btn.addEventListener("keydown", function (e) {
      if (e.repeat) return;           /* 키를 누르고 있어도 한 번만 */
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); }
    });
  }

  bind(btnStart, start);
  bind(btnStop, stop);
  bind(btnAgain, again);
  renderBest(false);
  renderWorld();
})();
</script>
</body>
</html>
