<!DOCTYPE html>
<html lang="ko">
<head>
<script charset="utf-8" src="firebase-config.js"></script>
<script charset="utf-8" src="access-guard.js" data-game="turbolap"></script>
<script charset="utf-8" src="world-record.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- 링크 미리보기(제어판 제목) 시작 — 링크제목맞추기.ps1 이 채웁니다. 손으로 고치지 마세요. -->
<title>터보 랩</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="정보 수업용 링크 모음">
<meta property="og:title" content="터보 랩">
<meta property="og:description" content="3D 카툰 레이싱 / 쉬움·어려움 트랙 3바퀴 완주 시간 개인전 (WASD·방향키)">
<meta property="og:url" content="https://cornsilktea.github.io/24.turbo-lap.html">
<meta property="og:image" content="https://cornsilktea.github.io/icon-512.png">
<meta name="twitter:card" content="summary">
<!-- 링크 미리보기 끝 -->
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #8FD3FF; font-family: var(--sg-font); color: var(--sg-ink); }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ── HUD (위쪽 46px 는 access-guard.js 의 '← 목록으로' 버튼 자리) ── */
  #hud { position: fixed; top: 52px; left: 10px; right: 10px; display: none; align-items: flex-start; justify-content: space-between; gap: 8px; pointer-events: none; z-index: 5; }
  .hud-box { background: rgba(255,255,255,.92); border: 2px solid var(--sg-line-strong); border-radius: 10px; padding: 6px 12px; font-weight: 800; font-variant-numeric: tabular-nums; box-shadow: 0 3px 0 rgba(27,43,32,.25); }
  .hud-box .lab { font-size: 11px; color: var(--sg-ink-soft); font-weight: 700; display: block; }
  #hudLap { font-size: 22px; }
  #hudTime { font-size: 26px; text-align: center; min-width: 140px; }
  #hudTime .off { display: block; font-size: 12px; color: var(--sg-danger); min-height: 15px; }
  #hudBtns { display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
  #hudBtns button { font: inherit; font-weight: 800; font-size: 13px; padding: 7px 12px; border-radius: 8px; border: 2px solid var(--sg-line-strong); background: #fff; color: var(--sg-ink); cursor: pointer; box-shadow: 0 3px 0 rgba(27,43,32,.25); }
  #hudBtns button:active { transform: translateY(2px); box-shadow: none; }
  #speed { position: fixed; left: 12px; bottom: 12px; z-index: 5; display: none; pointer-events: none; }
  #speed b { font-size: 30px; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
  #hudBest { font-size: 18px; }
  #hudBest .lab { white-space: nowrap; }
  .laps { font-size: 13px; color: var(--sg-ink-mid); margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .laps b { color: var(--sg-primary); }
  #minimap { position: fixed; right: 12px; bottom: 12px; width: 150px; height: 150px; background: rgba(255,255,255,.85); border: 2px solid var(--sg-line-strong); border-radius: 10px; z-index: 5; display: none; pointer-events: none; }

  /* ── 바퀴 통과 안내 (화면 위쪽 가운데) ── */
  #lapToast { position: fixed; top: 130px; left: 50%; transform: translateX(-50%); display: none; pointer-events: none; z-index: 6; text-align: center; white-space: nowrap; }
  #lapToast b { display: block; font-size: clamp(30px, 6vw, 48px); font-weight: 800; color: #fff; -webkit-text-stroke: 2px var(--sg-ink); text-shadow: 0 5px 0 rgba(27,43,32,.35); }
  #lapToast span { display: inline-block; margin-top: 4px; padding: 4px 14px; border-radius: 10px; background: #D97B4F; color: #fff; font-size: 18px; font-weight: 800; border: 2px solid var(--sg-ink); }
  #lapToast.show { display: block; animation: toast 1.8s ease-out forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translateX(-50%) scale(1.4); } 12% { opacity: 1; transform: translateX(-50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }

  /* ── 카운트다운 ── */
  #count { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none; z-index: 6; }
  #count span { font-size: clamp(90px, 22vmin, 180px); font-weight: 800; color: #fff; -webkit-text-stroke: 4px var(--sg-ink); text-shadow: 0 8px 0 rgba(27,43,32,.35); animation: pop .5s ease-out; }
  #count span.go { color: #D97B4F; }
  @keyframes pop { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* ── 시작 / 완주 카드 ── */
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 56px 12px 12px; z-index: 7; overflow-y: auto; }
  .card { width: min(480px, 100%); background: var(--sg-panel); border: 3px solid var(--sg-line-strong); border-radius: 14px; padding: 22px 22px 18px; box-shadow: 0 10px 0 rgba(27,43,32,.3), 0 20px 40px rgba(0,0,0,.2); text-align: center; }
  .logo { font-size: clamp(44px, 9vw, 64px); font-weight: 800; line-height: 1.05; color: #D97B4F; -webkit-text-stroke: 2px var(--sg-ink); text-shadow: 4px 5px 0 var(--sg-ink); letter-spacing: -1px; margin-bottom: 4px; }
  .logo small { display: block; font-size: 15px; -webkit-text-stroke: 0; text-shadow: none; color: var(--sg-ink-soft); letter-spacing: 0; margin-top: 8px; font-weight: 700; }
  .rec { display: flex; gap: 10px; margin: 16px 0 12px; }
  .rec > div { flex: 1 1 0; min-width: 0; background: var(--sg-panel-alt); border: 2px solid var(--sg-line-mid); border-radius: 10px; padding: 8px 6px; }
  .rec .lab { font-size: 12px; font-weight: 700; color: var(--sg-ink-soft); }
  .rec .val { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; color: var(--sg-primary); }
  .rec .val.none { font-size: 14px; color: var(--sg-ink-faint); font-weight: 700; }
  .rec .who { font-size: 12px; color: var(--sg-ink-soft); min-height: 15px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 시작 화면: 난이도별 기록 표 */
  .rtab { width: 100%; border-collapse: collapse; margin: 14px 0 12px; font-size: 13px; }
  .rtab th, .rtab td { padding: 7px 6px; border-bottom: 2px solid var(--sg-line); text-align: center; vertical-align: middle; }
  .rtab th { color: var(--sg-ink-soft); font-size: 12px; font-weight: 700; }
  .rtab td:first-child { font-weight: 800; font-size: 15px; width: 64px; }
  .rtab em { font-style: normal; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--sg-primary); font-size: 17px; }
  .rtab em.none { color: var(--sg-ink-faint); font-size: 13px; font-weight: 700; }
  .rtab small { display: block; color: var(--sg-ink-soft); font-size: 11px; min-height: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; margin: 0 auto; }
  .new { display: inline-block; margin-left: 5px; padding: 1px 6px; font-size: 11px; border-radius: 6px; background: #D97B4F; color: #fff; vertical-align: middle; }
  .keys { display: flex; justify-content: center; gap: 22px; margin: 6px 0 16px; }
  .keypad { display: grid; grid-template-columns: repeat(3, 34px); gap: 4px; justify-content: center; }
  .keypad span { height: 34px; line-height: 30px; border: 2px solid var(--sg-line-strong); border-radius: 7px; background: #fff; font-weight: 800; font-size: 15px; box-shadow: 0 3px 0 var(--sg-line-strong); }
  .keypad span.e { visibility: hidden; }
  .keys .lab { font-size: 12px; color: var(--sg-ink-soft); font-weight: 700; margin-top: 8px; }
  .keys p { font-size: 13px; color: var(--sg-ink-mid); line-height: 1.6; text-align: left; align-self: center; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-block; font: inherit; font-weight: 800; font-size: 20px; padding: 13px 30px; border-radius: 12px; border: 3px solid var(--sg-line-strong); background: var(--sg-primary); color: var(--sg-primary-ink); cursor: pointer; box-shadow: 0 5px 0 var(--sg-ink); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sg-ink); }
  .btn small { display: block; font-size: 12px; font-weight: 700; opacity: .85; margin-top: 2px; }
  .btn.hard { background: #D97B4F; }
  .btn.sub { background: #fff; color: var(--sg-ink); font-size: 16px; padding: 10px 20px; }
  .cars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0 12px; }
  .carbtn { font: inherit; font-weight: 800; font-size: 15px; padding: 10px 4px 8px; border-radius: 12px; border: 3px solid var(--sg-line-strong); background: #fff; color: var(--sg-ink); cursor: pointer; box-shadow: 0 4px 0 var(--sg-ink); }
  .carbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sg-ink); }
  .carbtn i { display: block; height: 34px; margin: 0 8px 8px; border-radius: 17px 17px 8px 8px; border: 2px solid var(--sg-ink); }
  .carbtn.on { outline: 3px solid #D97B4F; outline-offset: 2px; }
  @media (max-width: 520px) { .cars { grid-template-columns: repeat(2, 1fr); } }
  .final { font-size: clamp(40px, 9vw, 58px); font-weight: 800; font-variant-numeric: tabular-nums; color: var(--sg-primary); line-height: 1.1; }
  .diffTag { display: inline-block; padding: 2px 12px; border-radius: 8px; background: var(--sg-panel-alt); border: 2px solid var(--sg-line-mid); font-size: 14px; font-weight: 800; margin-bottom: 6px; }
  .msg { font-size: 16px; font-weight: 800; color: #D97B4F; min-height: 20px; margin: 6px 0 2px; }
  .hint { font-size: 12px; color: var(--sg-ink-faint); margin-top: 12px; }
  @media (max-width: 520px) {
    #hudTime { font-size: 20px; min-width: 110px; }
    #hudLap { font-size: 17px; }
    #minimap { width: 110px; height: 110px; }
    #lapToast { top: 150px; }
    .keys { gap: 12px; }
    .btn { font-size: 18px; padding: 11px 22px; }
    .rtab small { max-width: 100px; }
  }
</style>
</head>
<body>
<div id="hud">
  <div class="hud-box"><span class="lab">바퀴</span><span id="hudLap">1 / 3</span></div>
  <div class="hud-box" id="hudTime">0:00.00<span class="off" id="hudOff"></span></div>
  <div class="hud-box"><span class="lab">최고 랩타임</span><span id="hudBest">—</span></div>
  <div id="hudBtns">
    <button type="button" id="btnReset">↻ 처음부터 (R)</button>
    <button type="button" id="btnRecover">🚗 트랙 복귀 (T)</button>
  </div>
</div>
<div class="hud-box" id="speed"><span class="lab">속도</span><b id="speedVal">0</b> km/h</div>
<canvas id="minimap" width="300" height="300"></canvas>
<canvas id="fx"></canvas>
<div id="lapToast"><b id="lapToastMain"></b><span id="lapToastSub"></span></div>
<div id="count"><span id="countNum">3</span></div>

<div id="overlay">
  <div class="card" id="cardStart">
    <div class="logo">TURBO LAP<small>터보 랩 — 3바퀴 최단 시간 도전</small></div>
    <table class="rtab">
      <thead><tr><th>난이도</th><th>나의 최고 기록</th><th>🏆 세계신기록</th></tr></thead>
      <tbody>
        <tr><td>쉬움</td><td><em id="bestEasy">—</em><small id="lapEasy"></small></td><td><em id="wrEasy">—</em><small id="wrWhoEasy"></small></td></tr>
        <tr><td>어려움</td><td><em id="bestHard">—</em><small id="lapHard"></small></td><td><em id="wrHard">—</em><small id="wrWhoHard"></small></td></tr>
      </tbody>
    </table>
    <div class="keys">
      <div>
        <div class="keypad"><span class="e"></span><span>W</span><span class="e"></span><span>A</span><span>S</span><span>D</span></div>
        <div class="lab">또는 방향키 ↑ ← ↓ →</div>
      </div>
      <p><b>W / ↑</b> 가속<br><b>S / ↓</b> 브레이크·후진<br><b>A D / ← →</b> 조향<br><b>R</b> 처음부터 다시</p>
    </div>
    <div class="btns">
      <button type="button" class="btn" id="btnEasy">쉬움<small>넓은 도로 · 언덕 1개</small></button>
      <button type="button" class="btn hard" id="btnHard">어려움<small>좁은 도로 · 헤어핀 · 언덕 2개</small></button>
    </div>
    <div class="hint">트랙을 벗어나면 느려지고, 울타리에 부딪히면 크게 감속합니다.</div>
  </div>

  <div class="card" id="cardCar" style="display:none">
    <div class="logo" style="font-size:36px">차량 선택<small id="carCourse">쉬움 코스</small></div>
    <div class="cars">
      <button type="button" class="carbtn" data-car="black"><i style="background:#2A2E35"></i>검정</button>
      <button type="button" class="carbtn" data-car="yellow"><i style="background:#FFC23D"></i>노랑</button>
      <button type="button" class="carbtn" data-car="blue"><i style="background:#3D8BFF"></i>파랑</button>
      <button type="button" class="carbtn" data-car="green"><i style="background:#4FD66A"></i>초록</button>
    </div>
    <div class="hint">차량을 고르면 바로 출발합니다.</div>
    <div class="btns" style="margin-top:12px"><button type="button" class="btn sub" id="btnCarBack">← 코스 다시 고르기</button></div>
  </div>

  <div class="card" id="cardDone" style="display:none">
    <div class="logo" style="font-size:38px">🏁 완주!</div>
    <div class="diffTag" id="doneDiff">쉬움</div>
    <div class="final" id="finalTime">0:00.00</div>
    <div class="msg" id="finalMsg"></div>
    <div class="laps" id="lapList"></div>
    <div class="rec">
      <div><div class="lab">나의 최고 기록</div><div class="val" id="bestDone">—</div><div class="who" id="bestDoneNew"></div></div>
      <div><div class="lab">🏆 세계신기록</div><div class="val" id="wrDone">—</div><div class="who" id="wrWhoDone"></div></div>
    </div>
    <div class="btns">
      <button type="button" class="btn" id="btnRetry">다시 하기</button>
      <button type="button" class="btn sub" id="btnMenu">처음 화면</button>
    </div>
    <div class="hint">스페이스바: 다시 하기</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
"use strict";

/* ═══════════════════ 밸런스 설정 (여기 숫자만 바꾸면 됨) ═══════════════════ */
const CFG = {
  laps: 3,               // 완주 바퀴 수
  countdown: 3,          // 출발 카운트다운(초)
  maxSpeed: 44,          // 최고 속도 (단위/초)
  accel: 20,             // 가속도
  brake: 42,             // 브레이크 감속도
  reverseMax: 12,        // 후진 최고 속도
  coastDrag: 0.45,       // 가속 안 할 때 관성 감속 (초당 비율)
  steerRate: 2.1,        // 최대 조향 속도 (rad/초)
  steerFullAt: 0.3,      // 이 비율 속도부터 조향이 최대가 됨
  steerHighSpeed: 0.55,  // 최고 속도에서 조향 배율 (고속일수록 둔하게)
  offroadMax: 15,        // 오프로드 최고 속도
  offroadDrag: 2.4,      // 오프로드 감속 (초당 비율)
  wallKeep: 0.3,         // 울타리 충돌 시 남는 속도 비율
  shoulder: 4.5,         // 도로 밖 갓길 폭 (여기까지 나가면 울타리)
  /* 속도감 연출 (물리·기록에는 영향 없음) */
  carScale: 0.8,         // 차를 작게 → 같은 속도라도 풍경이 더 빨리 지나가 보임
  camBack: 8.5, camUp: 3.9, camLerp: 7,
  fovBase: 66, fovBoost: 16,   // 시야각: 정지 66° → 최고 속도 82°
  speedLinesFrom: 0.45,  // 이 비율 속도부터 화면 가장자리 속도선
  postEvery: 6,          // 울타리 기둥 간격(샘플)
  flagEvery: 36,         // 트랙 옆 깃대 간격(샘플)
  samples: 800,          // 트랙 곡선 샘플 수
  kmh: 4                 // 표시용 속도 배율
};
/* 난이도별 트랙 — points: 제어점 [x, y(높이), z] (닫힌 곡선), width: 도로 폭
   세계 신기록 경로 records/turbolap/<key>, 개인 기록 localStorage turbolap_best_<key>_v1 */
const TRACKS = {
  easy: {
    key: "easy", name: "쉬움", width: 14, trees: 90,
    points: [
      [-60, 0, 80], [40, 0, 80], [110, 0, 55], [125, 0, -15], [90, 5, -65],
      [25, 9, -95], [-40, 5, -70], [-95, 0, -85], [-135, 0, -25], [-105, 0, 35], [-125, 0, 72]
    ]
  },
  hard: {
    key: "hard", name: "어려움", width: 11, trees: 110,
    points: [
      [-90, 0, 95], [20, 0, 95], [80, 0, 80], [110, 0, 40], [85, 0, 10], [45, 0, 25], [20, 0, -5],
      [50, 4, -40], [100, 9, -70], [120, 3, -115], [60, 0, -135], [0, 4, -110], [-50, 10, -130],
      [-105, 5, -100], [-140, 0, -50], [-95, 0, -20], [-135, 0, 30], [-125, 0, 80]
    ]
  }
};
const CARS = { black: { name: "검정", color: 0x2A2E35 }, yellow: { name: "노랑", color: 0xFFC23D }, blue: { name: "파랑", color: 0x3D8BFF }, green: { name: "초록", color: 0x4FD66A } };
let carKey = "blue"; try { if (CARS[localStorage.getItem("turbolap_car_v1")]) carKey = localStorage.getItem("turbolap_car_v1"); } catch (e) {}
let pendingDiff = "easy";

const $ = id => document.getElementById(id);

/* ═══════════════════ 기록 (난이도별) ═══════════════════ */
function bestKey(k) { return "turbolap_best_" + k + "_v1"; }
function loadBest(k) { try { const v = parseInt(localStorage.getItem(bestKey(k)), 10); return v > 0 ? v : 0; } catch (e) { return 0; } }
function saveBest(k, v) { try { localStorage.setItem(bestKey(k), String(v)); } catch (e) {} }
const best = { easy: loadBest("easy"), hard: loadBest("hard") };
/* 최고 랩타임(난이도별, 이 기기) */
function lapKey(k) { return "turbolap_bestlap_" + k + "_v1"; }
function loadBestLap(k) { try { const v = parseInt(localStorage.getItem(lapKey(k)), 10); return v > 0 ? v : 0; } catch (e) { return 0; } }
function saveBestLap(k, v) { try { localStorage.setItem(lapKey(k), String(v)); } catch (e) {} }
const bestLap = { easy: loadBestLap("easy"), hard: loadBestLap("hard") };
function fmtTime(ms) {
  ms = Math.max(0, Math.round(ms));
  const m = Math.floor(ms / 60000), s = Math.floor(ms % 60000 / 1000), c = Math.floor(ms % 1000 / 10);
  return m + ":" + String(s).padStart(2, "0") + "." + String(c).padStart(2, "0");
}
/* 세계 신기록 — records/turbolap/easy · hard, 시간(ms)은 작을수록 좋으므로 lower:true */
const WRS = {};
["easy", "hard"].forEach(k => { WRS[k] = window.WorldRecord ? WorldRecord("turbolap", { key: k, lower: true, format: fmtTime }) : null; });
const wrTried = { easy: false, hard: false };
function wrInfo(k) {
  const WR = WRS[k];
  if (!WR) return { val: "—", who: "", none: true };
  if (WR.loaded && WR.rec) return { val: WR.text(), who: WR.who(), none: false };
  if (WR.loaded) return { val: "아직 없음", who: "", none: true };
  return { val: !WR.url() ? "오프라인" : (wrTried[k] ? "불러오지 못함" : "불러오는 중…"), who: "", none: true };
}
function setVal(el, text, none, cls) { el.textContent = text; el.className = cls + (none ? " none" : ""); }
function renderRecords() {
  ["easy", "hard"].forEach(k => {
    const cap = k === "easy" ? "Easy" : "Hard", w = wrInfo(k);
    setVal($("best" + cap), best[k] > 0 ? fmtTime(best[k]) : "아직 없음", !(best[k] > 0), "");
    $("lap" + cap).textContent = bestLap[k] > 0 ? "최고 랩 " + fmtTime(bestLap[k]) : "";
    setVal($("wr" + cap), w.val, w.none, ""); $("wrWho" + cap).textContent = w.who;
  });
  const k = diff, w = wrInfo(k);
  setVal($("bestDone"), best[k] > 0 ? fmtTime(best[k]) : "아직 없음", !(best[k] > 0), "val");
  setVal($("wrDone"), w.val, w.none, "val"); $("wrWhoDone").textContent = w.who;

/* ═══════════════════ 소리 (Web Audio, 외부 파일 없음) ═══════════════════ */
const AUD = { ctx: null, eng: null };
function audioInit() {
  try {
    if (!AUD.ctx) AUD.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (AUD.ctx.state === "suspended") AUD.ctx.resume();
  } catch (e) {}
}
function beep(freq, dur, type, vol, when) {
  if (!AUD.ctx) return;
  try {
    const c = AUD.ctx, t = c.currentTime + (when || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.08, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
function engineStart() {
  if (!AUD.ctx || AUD.eng) return;
  try {
    const c = AUD.ctx;
    const o = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = "sawtooth"; o2.type = "square"; f.type = "lowpass"; f.frequency.value = 520; g.gain.value = 0;
    o.connect(f); o2.connect(f); f.connect(g); g.connect(c.destination); o.start(); o2.start();
    AUD.eng = { o, o2, g };
  } catch (e) {}
}
function engineUpdate(ratio, on) {
  if (!AUD.eng) return;
  const t = AUD.ctx.currentTime, fr = 60 + ratio * 260;
  AUD.eng.o.frequency.setTargetAtTime(fr, t, 0.06);
  AUD.eng.o2.frequency.setTargetAtTime(fr / 2, t, 0.06);
  AUD.eng.g.gain.setTargetAtTime(on ? 0.03 + ratio * 0.03 : 0, t, 0.1);
}

function canvasTex(w, h, draw, repeat) {

  draw(cv.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(cv);
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  t.anisotropy = 4;
  return t;
}
function rnd(a, b) { return a + Math.random() * (b - a); }
/* 잔디·연석·하늘은 img/turbo/ 의 그림을 쓴다 */
function imgTex(src, rx, ry, mirror) {

  t.wrapS = t.wrapT = mirror ? THREE.MirroredRepeatWrapping : THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8;
  return t;
}
const texGrass = imgTex("img/turbo/grass.png", 45, 45);
function makeRoadTex() {

}
const texCurb = imgTex("img/turbo/curb.png", 1, 1); texCurb.rotation = Math.PI / 2; texCurb.center.set(0.5, 0.5);   // 띠 방향(가로)을 도로 진행 방향(v)으로

/* ═══════════════════ 트랙 만들기 (난이도 바꿀 때마다 다시 만듦) ═══════════════════ */
let diff = "easy";
let S = [], N = CFG.samples, W = 14, SEG = 1, TRACK_LEN = 1, MM = null;
const SH = CFG.shoulder;
let trackGroup = null;

function edgeAt(i, off, yAdd) { const s = S[i % N]; return new THREE.Vector3(s.p.x + s.n.x * off, s.p.y + (yAdd || 0), s.p.z + s.n.z * off); }
/* 닫힌 띠 메시: edgeFn(i) → [왼쪽 점, 오른쪽 점] */
function ribbon(group, edgeFn, vRepeat, mat, from, to) {
  from = from || 0; to = (to === undefined) ? N : to;
  const cnt = to - from + 1, pos = new Float32Array(cnt * 6), uv = new Float32Array(cnt * 4), idx = [];
  for (let k = 0; k < cnt; k++) {
    const e = edgeFn((from + k) % N), v = k / (cnt - 1) * vRepeat;
    pos.set([e[0].x, e[0].y, e[0].z, e[1].x, e[1].y, e[1].z], k * 6);
    uv.set([0, v, 1, v], k * 4);
    if (k < cnt - 1) { const a = k * 2, b = a + 1, c = a + 2, d = a + 3; idx.push(a, b, c, b, d, c); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); group.add(m); return m;
}
function buildTrack(def) {
  if (trackGroup) {
    scene.remove(trackGroup);
    trackGroup.traverse(o => { if (o.isMesh) { o.geometry.dispose(); if (o.material.map && o.material.map !== texCurb && o.material.map !== texChecker) o.material.map.dispose(); o.material.dispose(); } });
  }
  const G = trackGroup = new THREE.Group(); scene.add(G);
  W = def.width;
  const curve = new THREE.CatmullRomCurve3(def.points.map(p => new THREE.Vector3(p[0], p[1], p[2])), true, "catmullrom", 0.5);
  N = CFG.samples; TRACK_LEN = curve.getLength(); SEG = TRACK_LEN / N;
  S = [];  // { p: 위치, t: 접선(xz 정규화), n: 왼쪽 법선(xz) }
  for (let i = 0; i < N; i++) {
    const u = i / N, p = curve.getPointAt(u), tg = curve.getTangentAt(u);
    p.y = Math.max(0, p.y);      // 스플라인이 언덕 앞뒤에서 땅 밑으로 살짝 파고드는 것(도로가 땅에 묻혀 안 보임) 방지
    const t = new THREE.Vector3(tg.x, 0, tg.z).normalize();
    S.push({ p, t, n: new THREE.Vector3(t.z, 0, -t.x) });   // n = up × t (왼쪽)
  }
  const grassMat = lambert(0x66C858);
  ribbon(G, i => [edgeAt(i, W / 2 + SH + 1, -0.02), edgeAt(i, -(W / 2 + SH + 1), -0.02)], 1, grassMat);           // 갓길(언덕 높이 따라감)
  ribbon(G, i => { const h = S[i].p.y, k = W / 2 + SH + 1; return [edgeAt(i, k + 3 + h * 2.2, -h - 0.04), edgeAt(i, k, -0.03)]; }, 1, grassMat);      // 왼쪽 비탈
  ribbon(G, i => { const h = S[i].p.y, k = W / 2 + SH + 1; return [edgeAt(i, -k, -0.03), edgeAt(i, -(k + 3 + h * 2.2), -h - 0.04)]; }, 1, grassMat);  // 오른쪽 비탈
  const roadRep = Math.round(TRACK_LEN / 5), texRoad = makeRoadTex(); texRoad.repeat.set(1, roadRep);
  ribbon(G, i => [edgeAt(i, W / 2, 0.05), edgeAt(i, -W / 2, 0.05)], roadRep, lambert(0xFFFFFF, { map: texRoad }));   // 도로
  const curbMat = lambert(0xFFFFFF, { map: texCurb }), curbRep = Math.round(TRACK_LEN / 3);
  ribbon(G, i => [edgeAt(i, W / 2 + 1.3, 0.09), edgeAt(i, W / 2, 0.09)], curbRep, curbMat);
  ribbon(G, i => [edgeAt(i, -W / 2, 0.09), edgeAt(i, -(W / 2 + 1.3), 0.09)], curbRep, curbMat);
  ribbon(G, i => [edgeAt(i, W / 2, 0.12), edgeAt(i, -W / 2, 0.12)], 1, lambert(0xFFFFFF, { map: texChecker }), 0, 5);   // 결승선
  /* 결승 아치 */
  {
    const postMat = lambert(0xF23B3B), beamTex = texChecker.clone(); beamTex.needsUpdate = true; beamTex.repeat.set(1.5, 0.125);
    const s0 = S[2], side = W / 2 + 2.2, hgt = 9;
    [1, -1].forEach(sg => {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, hgt, 8), postMat);
      post.position.set(s0.p.x + s0.n.x * side * sg, s0.p.y + hgt / 2, s0.p.z + s0.n.z * side * sg); G.add(post);
    });
    const beam = new THREE.Mesh(new THREE.BoxGeometry(side * 2 + 1, 1.6, 1.2), lambert(0xFFFFFF, { map: beamTex }));
    beam.position.set(s0.p.x, s0.p.y + hgt, s0.p.z); beam.rotation.y = Math.atan2(s0.n.x, s0.n.z); G.add(beam);
  }
  /* 울타리 (양쪽) — 튜브 난간 + 기둥 */
  {
    const railMat = lambert(0xFFFFFF), postMat = lambert(0xF23B3B);
    const off = W / 2 + SH;
    [1, -1].forEach(sg => {
      const pts = [];
      for (let i = 0; i < N; i += 4) pts.push(edgeAt(i, off * sg, 1.0));
      const c = new THREE.CatmullRomCurve3(pts, true);
      G.add(new THREE.Mesh(new THREE.TubeGeometry(c, N / 2, 0.22, 6, true), railMat));
      const postGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.4, 6);
      for (let i = 0; i < N; i += CFG.postEvery) { const m = new THREE.Mesh(postGeo, postMat); m.position.copy(edgeAt(i, off * sg, 0.7)); G.add(m); }
    });
    /* 깃대 (양쪽 번갈아) — 카메라 가까이 지나가는 키 큰 물체가 속도감을 살린다 */
    const poleGeo = new THREE.CylinderGeometry(0.12, 0.12, 7, 5), poleMat = lambert(0xF4F4F4);
    const flagGeo = new THREE.BufferGeometry();
    flagGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array([0, 0, 0, 2.2, -0.5, 0, 0, -1.1, 0]), 3));
    flagGeo.computeVertexNormals();
    const flagMats = [0xFF5A4E, 0x3D8BFF, 0xFFC23D, 0x4FD66A].map(c => lambert(c, { side: THREE.DoubleSide }));
    for (let i = 18, k = 0; i < N; i += CFG.flagEvery, k++) {
      const sg = k % 2 ? 1 : -1, base = edgeAt(i, (off + 1.4) * sg, 0);
      const pole = new THREE.Mesh(poleGeo, poleMat); pole.position.set(base.x, base.y + 3.5, base.z); G.add(pole);
      const flag = new THREE.Mesh(flagGeo, flagMats[k % flagMats.length]); flag.position.set(base.x, base.y + 6.9, base.z);
      flag.rotation.y = Math.atan2(S[i].t.x, S[i].t.z); G.add(flag);
    }
  }
  /* 나무 */
  {
    const trunk = new THREE.CylinderGeometry(0.4, 0.55, 2.2, 6), leaf1 = new THREE.ConeGeometry(2.6, 4.2, 7), leaf2 = new THREE.ConeGeometry(1.9, 3.4, 7);
    const trunkMat = lambert(0x8B5A2B);
    const leafMats = [0x2F9E44, 0x3DB556, 0x57C46B, 0x28874A].map(c => lambert(c));
    let placed = 0, tries = 0;
    while (placed < def.trees && tries < 3000) {
      tries++;
      const x = rnd(-240, 240), z = rnd(-220, 220);
      let ok = true;
      for (let i = 0; i < N; i += 3) { const s = S[i]; const dx = s.p.x - x, dz = s.p.z - z; if (dx * dx + dz * dz < 24 * 24) { ok = false; break; } }
      if (!ok) continue;
      const g = new THREE.Group(), sc = rnd(0.8, 1.5), lm = leafMats[Math.floor(Math.random() * leafMats.length)];
      const t = new THREE.Mesh(trunk, trunkMat); t.position.y = 1.1; g.add(t);
      const l1 = new THREE.Mesh(leaf1, lm); l1.position.y = 3.6; g.add(l1);
      const l2 = new THREE.Mesh(leaf2, lm); l2.position.y = 5.6; g.add(l2);
      g.position.set(x, 0, z); g.scale.setScalar(sc); g.rotation.y = rnd(0, 6.28); G.add(g); placed++;
    }
  }
  /* 미니맵 좌표 변환 */
  {
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    S.forEach(s => { minX = Math.min(minX, s.p.x); maxX = Math.max(maxX, s.p.x); minZ = Math.min(minZ, s.p.z); maxZ = Math.max(maxZ, s.p.z); });
    const pad = 22, sc = Math.min((300 - pad * 2) / (maxX - minX), (300 - pad * 2) / (maxZ - minZ));
    const ox = 150 - (minX + maxX) / 2 * sc, oz = 150 - (minZ + maxZ) / 2 * sc;
    MM = { sc, mx: x => ox + x * sc, mz: z => oz + z * sc };
  }
  console.log("[turbolap] " + def.key + " track length", TRACK_LEN.toFixed(1), "/ min 3-lap time at max speed", (3 * TRACK_LEN / CFG.maxSpeed).toFixed(1), "s");
}

/* ── 자동차 ── */
/* 차: 파나메라 느낌의 낮고 긴 패스트백 — 옆모습(Shape)을 차폭만큼 밀어(Extrude) 만든다.
   옆모습 좌표: x = 앞(+)·뒤(-), y = 높이. 밀어낸 뒤 y축으로 90° 돌려 앞이 -z 를 보게 한다. */
function makeCar(color) {
  const g = new THREE.Group();
  const outline = new THREE.MeshBasicMaterial({ color: 0x1B2B20, side: THREE.BackSide });
  const bodyMat = lambert(color), dark = lambert(0x23262D), glass = lambert(0x9FD8F5), chrome = lambert(0xE6E6E6);
  const BW = 1.95;                                             // 차폭
  function extrude(pts, width, depthY, opts) {
    const sh = new THREE.Shape();
    pts.forEach((p, i) => {
      if (p.arc) sh.absarc(p.arc[0], p.arc[1], p.arc[2], p.arc[3], p.arc[4], p.arc[5]);
      else if (i === 0) sh.moveTo(p[0], p[1]); else sh.lineTo(p[0], p[1]);
    });
    const geo = new THREE.ExtrudeGeometry(sh, Object.assign({ depth: width, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.06, bevelSegments: 2 }, opts || {}));
    geo.translate(0, 0, -width / 2); geo.rotateY(Math.PI / 2);   // 앞(+x) → -z
    return geo;
  }
  const WR_ = 0.42, AR = 0.5, WY = 0.32;                         // 바퀴 반지름, 아치 반지름·중심 높이
  /* 아랫몸체: 보닛~허리선~트렁크 (윗선 y≈1.0), 그 위에 유리 캐빈을 조금 좁게 얹는다 */
  const body = extrude([
    [2.45, 0.45], [2.35, 0.82], [1.15, 0.98], [-1.6, 1.02], [-2.35, 1.0], [-2.45, 0.7], [-2.35, 0.42],
    [-2.0, 0.34], { arc: [-1.5, WY, AR, Math.PI, 0, true] }, [-0.95, 0.34],
    [0.95, 0.34], { arc: [1.5, WY, AR, Math.PI, 0, true] }, [2.05, 0.34], [2.3, 0.34]
  ], BW);
  const bodyMesh = new THREE.Mesh(body, bodyMat); g.add(bodyMesh);
  const ol = new THREE.Mesh(body, outline); ol.scale.set(1.03, 1.05, 1.03); ol.position.y = -0.02; g.add(ol);
  /* 유리 캐빈: 앞유리 → 지붕 → 패스트백 뒷유리, 차폭보다 좁게 */
  const cabin = extrude([[1.1, 0.98], [0.45, 1.36], [-0.55, 1.42], [-1.55, 1.2], [-2.25, 1.02], [-2.25, 0.96], [1.1, 0.94]], BW - 0.28, 0, { bevelThickness: 0.03, bevelSize: 0.03 });
  const cabinMesh = new THREE.Mesh(cabin, glass); cabinMesh.position.y = 0.04; g.add(cabinMesh);
  const cabinOl = new THREE.Mesh(cabin, outline); cabinOl.scale.set(1.03, 1.04, 1.03); cabinOl.position.y = 0.03; g.add(cabinOl);
  /* 지붕 패널(차체색) */
  const roof = new THREE.Mesh(new THREE.BoxGeometry(BW - 0.5, 0.07, 1.0), bodyMat); roof.position.set(0, 1.45, 0.05); g.add(roof);
  /* 등화: 앞은 가는 헤드램프, 뒤는 파나메라식 가로 한 줄 라이트바 */
  const lamp = lambert(0xFFF6C8, { emissive: 0xFFE9A0 }), tail = lambert(0xFF3B3B, { emissive: 0xB01818 });
  [0.62, -0.62].forEach(x => { const m = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.12), lamp); m.position.set(x, 0.72, -2.42); g.add(m); });
  const bar = new THREE.Mesh(new THREE.BoxGeometry(BW - 0.3, 0.1, 0.1), tail); bar.position.set(0, 0.9, 2.44); g.add(bar);
  /* 뒤 스포일러 립, 사이드미러, 앞 그릴 */
  const lip = new THREE.Mesh(new THREE.BoxGeometry(BW - 0.4, 0.06, 0.35), dark); lip.position.set(0, 1.04, 2.2); g.add(lip);
  [1, -1].forEach(sg => { const m = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.12, 0.18), bodyMat); m.position.set(sg * (BW / 2 + 0.1), 1.0, -0.75); g.add(m); });
  const grille = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.18, 0.1), dark); grille.position.set(0, 0.5, -2.47); g.add(grille);
  /* 바퀴 */
  const wheelGeo = new THREE.CylinderGeometry(WR_, WR_, 0.42, 14); wheelGeo.rotateZ(Math.PI / 2);
  const hubGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.45, 5); hubGeo.rotateZ(Math.PI / 2);
  const wheels = [];
  [[BW / 2 - 0.1, -1.5], [-(BW / 2 - 0.1), -1.5], [BW / 2 - 0.1, 1.5], [-(BW / 2 - 0.1), 1.5]].forEach(([x, z], k) => {
    const w = new THREE.Group(); w.position.set(x, WR_, z);

    g.add(w); wheels.push({ g: w, front: k < 2 });
  });
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(1, 16), new THREE.MeshBasicMaterial({ color: 0x1B2B20, transparent: true, opacity: 0.22 }));
  shadow.rotation.x = -Math.PI / 2; shadow.scale.set(1.35, 2.7, 1); shadow.position.y = 0.16; g.add(shadow);
  g.rotation.order = "YXZ";
  g.scale.setScalar(CFG.carScale);
  g.userData.wheels = wheels;
  return g;
}

const P = { x: 0, z: 0, y: 0, h: 0, v: 0, ci: 0, prevCi: 0, lap: 0, expected: 0, off: false, wallT: 0, steerVis: 0 };
let state = "menu";       // menu | countdown | race | done
let cdTime = 0, cdShown = -1, goTimer = 0, t0 = 0, elapsed = 0, finalMs = 0, doneTimer = 0, shake = 0, menuAng = 0;
const keys = { up: false, down: false, left: false, right: false };
const hud = $("hud"), overlay = $("overlay"), cardStart = $("cardStart"), cardDone = $("cardDone"), cardCar = $("cardCar");
const hudLap = $("hudLap"), hudTime = $("hudTime"), hudOff = $("hudOff"), speedBox = $("speed"), speedVal = $("speedVal");
const countBox = $("count"), countNum = $("countNum"), mini = $("minimap"), mctx = mini.getContext("2d");
const lapToast = $("lapToast"), lapToastMain = $("lapToastMain"), lapToastSub = $("lapToastSub"), hudBest = $("hudBest");
const fx = $("fx"), fctx = fx.getContext("2d");
let lapTimes = [], lapStartMs = 0, lapNewInRace = false;   // 이번 경기의 랩타임들
function renderHudBest() { hudBest.innerHTML = bestLap[diff] > 0 ? fmtTime(bestLap[diff]) + (lapNewInRace ? '<span class="new">NEW</span>' : "") : "—"; }
/* 랩 하나 끝남: 랩타임 기록, 최고 랩 갱신 여부 반환 */
function closeLap() {
  const lt = Math.round(elapsed - lapStartMs); lapStartMs = elapsed; lapTimes.push(lt);
  const isNew = bestLap[diff] === 0 || lt < bestLap[diff];
  if (isNew) { bestLap[diff] = lt; saveBestLap(diff, lt); lapNewInRace = true; }
  renderHudBest(); return isNew;
}

function placeAt(i) {
  const s = S[i % N];
  P.x = s.p.x; P.z = s.p.z; P.y = s.p.y; P.v = 0; P.ci = i % N; P.prevCi = P.ci;
  P.h = Math.atan2(-s.t.x, -s.t.z);        // 전방 = (-sinθ, 0, -cosθ) 가 접선과 같게
}
function resetCar() { placeAt(N - 14); P.off = false; P.wallT = 0; P.steerVis = 0; }
function showCard(which) {
  overlay.style.display = which ? "flex" : "none";
  cardStart.style.display = which === "start" ? "" : "none";
  cardDone.style.display = which === "done" ? "" : "none";
  cardCar.style.display = which === "car" ? "" : "none";
}
function pickCourse(k) {                  // 코스 고른 뒤 차량 색 고르기 화면으로
  pendingDiff = k; $("carCourse").textContent = TRACKS[k].name + " 코스";
  document.querySelectorAll(".carbtn").forEach(b => b.classList.toggle("on", b.getAttribute("data-car") === carKey));
  showCard("car");
}
function setHud(on) { hud.style.display = on ? "flex" : "none"; speedBox.style.display = on ? "block" : "none"; mini.style.display = on ? "block" : "none"; }
function showLapToast(done, lt, isNew) {     // done = 방금 끝낸 바퀴 수, lt = 그 랩타임
  const left = CFG.laps - done;
  lapToastMain.textContent = done + "바퀴 완료! " + fmtTime(lt);
  lapToastSub.textContent = (left === 1 ? "마지막 바퀴!" : "남은 " + left + "바퀴") + "  ·  최고 랩 " + fmtTime(bestLap[diff]) + (isNew ? " NEW" : "");
  lapToast.className = ""; void lapToast.offsetWidth;   // 애니메이션 다시 시작
  lapToast.className = "show";
}

function startRace(which) {
  audioInit();
  if (which && which !== diff) { diff = which; buildTrack(TRACKS[diff]); }
  scene.remove(car); car = makeCar(CARS[carKey].color); scene.add(car);
  resetCar(); P.lap = 0; P.expected = 0; lapTimes = []; lapStartMs = 0; lapNewInRace = false; renderHudBest();
  state = "countdown"; cdTime = 0; cdShown = -1; goTimer = 0; elapsed = 0; finalMs = 0; shake = 0;
  showCard(null); setHud(true); countBox.style.display = "flex"; lapToast.className = "";
  hudLap.textContent = "1 / " + CFG.laps; hudTime.firstChild.nodeValue = fmtTime(0); hudOff.textContent = "";
  engineStart();
  snapCamera();
}
function recover() {                      // 가장 가까운 트랙 지점으로 복귀 (진행도는 그대로)
  if (state !== "race") return;
  placeAt(P.ci); P.off = false; shake = 0;
}
function showMenu() {
  state = "menu"; setHud(false); fctx.clearRect(0, 0, fx.width, fx.height); countBox.style.display = "none"; lapToast.className = ""; showCard("start");
  engineUpdate(0, false); renderRecords();
  ["easy", "hard"].forEach(k => { if (WRS[k]) WRS[k].load(); });
}
function finish() {
  state = "done"; finalMs = Math.round(elapsed); doneTimer = 0;
  engineUpdate(0, false);
  [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.35, "triangle", 0.1, i * 0.13));
  const k = diff, WR = WRS[k];
  $("finalTime").textContent = fmtTime(finalMs);
  $("lapList").innerHTML = lapTimes.map((t, i) => "랩" + (i + 1) + " " + fmtTime(t)).join(" · ") +
    "<br>최고 랩타임 <b>" + fmtTime(bestLap[k]) + "</b>" + (lapNewInRace ? '<span class="new">NEW</span>' : "");
  $("doneDiff").textContent = TRACKS[k].name;
  const isBest = best[k] === 0 || finalMs < best[k];
  if (isBest) { best[k] = finalMs; saveBest(k, finalMs); }
  renderRecords();
  $("bestDoneNew").innerHTML = isBest ? '<span class="new">NEW</span> 개인 신기록 갱신!' : "";
  const wrBeat = WR && WR.beats(finalMs);
  $("finalMsg").textContent = wrBeat ? "🏆 세계 신기록입니다!" : (isBest ? "개인 신기록입니다!" : "완주를 축하합니다!");
  setTimeout(() => {
    if (state !== "done") return;
    showCard("done"); renderRecords();
    if (wrBeat) WR.prompt(finalMs, TRACKS[k].name + " 세계 신기록 달성!").then(() => renderRecords());
  }, 1300);
}

/* ═══════════════════ 물리 ═══════════════════ */
function nearestIndex() {
  let bi = P.ci, bd = Infinity;
  for (let k = -40; k <= 40; k++) {
    const i = (P.ci + k + N) % N, s = S[i], dx = s.p.x - P.x, dz = s.p.z - P.z, d = dx * dx + dz * dz;
    if (d < bd) { bd = d; bi = i; }
  }
  return bi;
}
function updateCar(dt) {
  const racing = state === "race";
  const thr = racing ? ((keys.up ? 1 : 0) - (keys.down ? 1 : 0)) : 0;
  const str = racing ? ((keys.left ? 1 : 0) - (keys.right ? 1 : 0)) : 0;
  const maxV = P.off ? CFG.offroadMax : CFG.maxSpeed;

  /* 가속·브레이크·후진 */
  if (thr > 0) P.v += CFG.accel * dt;
  else if (thr < 0) { if (P.v > 0.5) P.v -= CFG.brake * dt; else P.v -= CFG.accel * 0.6 * dt; }
  else P.v -= P.v * CFG.coastDrag * dt;
  if (state === "done") P.v -= P.v * 1.5 * dt;
  if (P.off) { P.v -= P.v * CFG.offroadDrag * dt; }
  if (P.v > maxV) P.v = Math.max(maxV, P.v - 40 * dt);
  if (P.v < -CFG.reverseMax) P.v = -CFG.reverseMax;
  if (Math.abs(P.v) < 0.02 && thr === 0) P.v = 0;

  /* 조향 (속도에 비례, 고속에서는 둔하게) */
  const ratio = Math.abs(P.v) / CFG.maxSpeed;
  const gain = Math.min(1, ratio / CFG.steerFullAt) * (1 - (1 - CFG.steerHighSpeed) * ratio);
  P.h += str * CFG.steerRate * gain * dt * (P.v >= 0 ? 1 : -1);
  P.steerVis += (str * 0.45 - P.steerVis) * Math.min(1, dt * 10);

  /* 이동 */
  const fx = -Math.sin(P.h), fz = -Math.cos(P.h);
  P.x += fx * P.v * dt; P.z += fz * P.v * dt;

  /* 트랙 기준 위치: 가장 가까운 샘플, 옆으로 벗어난 거리 */
  P.prevCi = P.ci; P.ci = nearestIndex();
  const s = S[P.ci], dxs = P.x - s.p.x, dzs = P.z - s.p.z;
  const lat = dxs * s.n.x + dzs * s.n.z;                       // 왼쪽(+)/오른쪽(-) 거리
  const along = dxs * s.t.x + dzs * s.t.z;
  const s2 = S[(P.ci + (along >= 0 ? 1 : N - 1)) % N];
  const frac = Math.min(1, Math.abs(along) / SEG);
  P.y = s.p.y + (s2.p.y - s.p.y) * frac;
  P.off = Math.abs(lat) > W / 2 + 0.8;
  const limit = W / 2 + SH - 1.0;
  P.wallT = Math.max(0, P.wallT - dt);
  if (Math.abs(lat) > limit) {                                   // 울타리 충돌 → 안으로 밀어 넣고 감속
    const sg = lat > 0 ? 1 : -1;
    P.x = s.p.x + s.n.x * limit * sg + s.t.x * along; P.z = s.p.z + s.n.z * limit * sg + s.t.z * along;
    if (P.wallT === 0 && Math.abs(P.v) > 6) { P.v *= CFG.wallKeep; beep(80, 0.18, "square", 0.12); shake = 0.35; }
    P.wallT = 0.4;
  }

  /* 바퀴 판정: 4구간을 순서대로 지나고 결승선을 앞으로 통과해야 1바퀴 */
  if (racing) {
    const sec = Math.floor(P.ci * 4 / N);
    const fwdCross = P.prevCi > N * 0.9 && P.ci < N * 0.1, backCross = P.prevCi < N * 0.1 && P.ci > N * 0.9;
    if (P.expected < 4 && sec === P.expected % 4 && (P.expected > 0 || fwdCross)) P.expected++;
    if (fwdCross && P.expected >= 4) {
      P.lap++; P.expected = 1;
      const isNew = closeLap();
      if (P.lap >= CFG.laps) finish();
      else { showLapToast(P.lap, lapTimes[lapTimes.length - 1], isNew); beep(880, 0.12, "square", 0.08); beep(1175, 0.2, "square", 0.08, 0.12); }
    } else if (backCross) P.expected = 0;
  }

  /* 메시 배치 */
  car.position.set(P.x, P.y, P.z);
  car.rotation.y = P.h;
  const i1 = (P.ci + 5) % N, i0 = (P.ci + N - 5) % N;
  const slope = Math.atan2(S[i1].p.y - S[i0].p.y, SEG * 10);
  const c = fx * s.t.x + fz * s.t.z;
  car.rotation.x = slope * c;
  car.rotation.z = -str * Math.min(1, ratio) * 0.06;
  car.userData.wheels.forEach(w => { w.g.rotation.x += P.v * dt / 0.48; if (w.front) w.g.rotation.y = P.steerVis; });
}

/* ═══════════════════ 카메라 ═══════════════════ */
const camTarget = new THREE.Vector3(), camLook = new THREE.Vector3();
function snapCamera() {
  const fx = -Math.sin(P.h), fz = -Math.cos(P.h);
  camera.position.set(P.x - fx * CFG.camBack, P.y + CFG.camUp, P.z - fz * CFG.camBack); camera.fov = CFG.fovBase; camera.updateProjectionMatrix();
}
function updateCamera(dt) {
  if (state === "menu") {
    menuAng += dt * 0.25;
    camera.position.set(P.x + Math.cos(menuAng) * 22, P.y + 8, P.z + Math.sin(menuAng) * 22);
    camera.lookAt(P.x, P.y + 1, P.z);
    return;
  }
  const fx = -Math.sin(P.h), fz = -Math.cos(P.h);
  const r = Math.min(1, Math.abs(P.v) / CFG.maxSpeed);
  const back = CFG.camBack - r * 0.8, up = CFG.camUp - r * 0.8;      // 빠를수록 낮고 바짝 붙어서
  camTarget.set(P.x - fx * back, P.y + up, P.z - fz * back);
  camera.position.lerp(camTarget, 1 - Math.exp(-CFG.camLerp * dt));
  if (shake > 0) { shake -= dt; camera.position.x += rnd(-0.3, 0.3) * shake * 3; camera.position.y += rnd(-0.3, 0.3) * shake * 3; }
  if (r > 0.85 && state === "race") { const j = (r - 0.85) * 0.5; camera.position.x += rnd(-j, j); camera.position.y += rnd(-j, j); }   // 고속 진동
  camLook.set(P.x + fx * (4 + r * 8), P.y + 1.2, P.z + fz * (4 + r * 8));
  camera.lookAt(camLook);
  camera.fov = CFG.fovBase + r * r * CFG.fovBoost; camera.updateProjectionMatrix();
}

/* ═══════════════════ 미니맵 ═══════════════════ */
/* 속도선: 빠를수록 화면 가장자리에서 가운데로 흰 줄이 흐른다 */
function drawSpeedLines(ratio) {
  const w = fx.width, h = fx.height;
  fctx.clearRect(0, 0, w, h);
  const a = (ratio - CFG.speedLinesFrom) / (1 - CFG.speedLinesFrom);
  if (a <= 0 || state === "done") return;
  const cx = w / 2, cy = h * 0.45, n = 26;
  fctx.strokeStyle = "rgba(255,255,255," + (0.55 * a).toFixed(2) + ")"; fctx.lineCap = "round";
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2 + Math.sin(i * 7.3) * 0.1, len = (0.18 + Math.random() * 0.22) * a;
    const R = Math.hypot(w, h) * 0.5, r0 = R * (1 - len), r1 = R * 1.05;
    fctx.lineWidth = 1.5 + Math.random() * 2.5;
    fctx.beginPath(); fctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0); fctx.lineTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1); fctx.stroke();
  }
}
function drawMinimap() {
  mctx.clearRect(0, 0, 300, 300);
  mctx.lineCap = mctx.lineJoin = "round";
  mctx.beginPath();
  for (let i = 0; i <= N; i += 4) { const s = S[i % N]; if (i === 0) mctx.moveTo(MM.mx(s.p.x), MM.mz(s.p.z)); else mctx.lineTo(MM.mx(s.p.x), MM.mz(s.p.z)); }
  mctx.closePath();
  mctx.strokeStyle = "#1B2B20"; mctx.lineWidth = W * MM.sc + 6; mctx.stroke();
  mctx.strokeStyle = "#7A7E8C"; mctx.lineWidth = W * MM.sc; mctx.stroke();
  const f = S[2];
  mctx.strokeStyle = "#FFFFFF"; mctx.lineWidth = 4;
  mctx.beginPath(); mctx.moveTo(MM.mx(f.p.x + f.n.x * W / 2), MM.mz(f.p.z + f.n.z * W / 2)); mctx.lineTo(MM.mx(f.p.x - f.n.x * W / 2), MM.mz(f.p.z - f.n.z * W / 2)); mctx.stroke();
  const cx = MM.mx(P.x), cz = MM.mz(P.z);
  mctx.fillStyle = "#D97B4F"; mctx.strokeStyle = "#1B2B20"; mctx.lineWidth = 3;
  mctx.beginPath(); mctx.arc(cx, cz, 8, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
}

/* ═══════════════════ 메인 루프 ═══════════════════ */
let last = performance.now();
function frame(now) { requestAnimationFrame(frame); tick(now); }
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  if (state === "countdown") {
    cdTime += dt;
    const n = Math.ceil(CFG.countdown - cdTime);
    if (n !== cdShown && n > 0) { cdShown = n; countNum.textContent = n; countNum.className = ""; beep(440, 0.15, "square", 0.1); }
    if (cdTime >= CFG.countdown) {
      state = "race"; t0 = performance.now(); goTimer = 0.9; lapStartMs = 0;
      countNum.textContent = "GO!"; countNum.className = "go"; beep(880, 0.45, "square", 0.12);
    }
  }
  if (state === "race") {
    elapsed = performance.now() - t0;
    if (goTimer > 0) { goTimer -= dt; if (goTimer <= 0) countBox.style.display = "none"; }
  }
  if (state === "done") doneTimer += dt;

  updateCar(dt);
  updateCamera(dt);
  engineUpdate(Math.min(1, Math.abs(P.v) / CFG.maxSpeed), state === "race" || state === "countdown");

  if (state !== "menu") {
    hudTime.firstChild.nodeValue = fmtTime(state === "done" ? finalMs : elapsed);
    hudLap.textContent = Math.min(CFG.laps, P.lap + 1) + " / " + CFG.laps;
    hudOff.textContent = P.off ? "오프로드 — 감속 중" : "";
    speedVal.textContent = Math.round(Math.abs(P.v) * CFG.kmh);
    drawMinimap();
    drawSpeedLines(Math.abs(P.v) / CFG.maxSpeed);
  }
  renderer.render(scene, camera);
}
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  fx.width = w; fx.height = h;
}
window.addEventListener("resize", resize); resize();

/* ═══════════════════ 입력 (방향키는 e.key, WASD 는 한글 IME 대비 e.code) ═══════════════════ */
function onKey(e, down) {
  let k = null;
  if (e.key === "ArrowUp" || e.code === "KeyW") k = "up";
  else if (e.key === "ArrowDown" || e.code === "KeyS") k = "down";
  else if (e.key === "ArrowLeft" || e.code === "KeyA") k = "left";
  else if (e.key === "ArrowRight" || e.code === "KeyD") k = "right";
  if (k) { keys[k] = down; e.preventDefault(); }
  if (!down) return;
  if (e.code === "KeyR" && state !== "menu") startRace();
  else if (e.code === "KeyT") recover();
  else if (e.code === "Space") { e.preventDefault(); if (state === "done") startRace(); }   // 스페이스바 = 다시 하기
}
window.addEventListener("keydown", e => onKey(e, true));
window.addEventListener("keyup", e => onKey(e, false));
window.addEventListener("blur", () => { keys.up = keys.down = keys.left = keys.right = false; });
$("btnEasy").onclick = e => { e.currentTarget.blur(); pickCourse("easy"); };
$("btnHard").onclick = e => { e.currentTarget.blur(); pickCourse("hard"); };
$("btnCarBack").onclick = e => { e.currentTarget.blur(); showCard("start"); };
document.querySelectorAll(".carbtn").forEach(b => b.onclick = e => {
  e.currentTarget.blur(); carKey = b.getAttribute("data-car");
  try { localStorage.setItem("turbolap_car_v1", carKey); } catch (err) {}
  startRace(pendingDiff);
});
$("btnRetry").onclick = e => { e.currentTarget.blur(); startRace(); };
$("btnMenu").onclick = e => { e.currentTarget.blur(); showMenu(); };
$("btnReset").onclick = e => { e.currentTarget.blur(); startRace(); };
$("btnRecover").onclick = e => { e.currentTarget.blur(); recover(); };

/* 콘솔 디버그용 */
window.TL = { keys, P, CFG, camera, scene, tick, get S() { return S; }, setTrack: k => { diff = k; buildTrack(TRACKS[k]); resetCar(); } };
buildTrack(TRACKS[diff]); resetCar(); updateCar(0); showMenu();
["easy", "hard"].forEach(k => { const WR = WRS[k]; if (WR) { WR.onChange(renderRecords); WR.load().then(() => { wrTried[k] = true; renderRecords(); }); } });
requestAnimationFrame(frame);
})();
</script>
</body>
