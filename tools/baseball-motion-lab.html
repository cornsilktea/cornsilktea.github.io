<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>41번 야구 동작·구장 시험장</title>
<style>
  html,body{margin:0;height:100%;background:#1c2a22;font-family:"Nanum Gothic","Malgun Gothic",sans-serif;color:#fff;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #labBar{position:fixed;left:8px;top:8px;right:8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  #labBar button{border:0;border-radius:8px;padding:8px 11px;background:rgba(20,24,22,.8);color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent}
  #labBar button.on{border-bottom-color:#D97B4F;background:rgba(60,40,28,.92)}
  .lab-gap{width:8px}
  #labSync{position:fixed;right:8px;bottom:8px;max-width:min(46vw,430px);padding:8px 10px;border-radius:10px;background:rgba(20,24,22,.8);border-left:4px solid #D97B4F;font-size:12px;line-height:1.55}
  .lab-sync-title{font-weight:800;margin-bottom:2px}
  .lab-sync-row.ok{color:#9fe6b0}
  .lab-sync-row.bad{color:#ff9a8a}
  #labStatus{position:fixed;left:8px;bottom:8px;padding:6px 10px;border-radius:8px;background:rgba(20,24,22,.7);font-size:12px}
  body.plain #labBar,body.plain #labSync,body.plain #labStatus{display:none}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script charset="utf-8" src="../common/character-kit.js"></script>
<script charset="utf-8" src="../games/41.baseball-duel/41.baseball-motion.js?v=1"></script>
<script charset="utf-8" src="../games/41.baseball-duel/41.baseball-field.js?v=1"></script>
<script charset="utf-8" src="../games/41.baseball-duel/41.baseball-drills.js?v=1"></script>
<script charset="utf-8" src="../games/41.baseball-duel/41.baseball-actors.js?v=1"></script>
<script charset="utf-8" src="../games/41.baseball-duel/41.baseball-park.js?v=1"></script>
<script charset="utf-8" src="../games/41.baseball-duel/41.baseball-motion-lab.js?v=1"></script>
</head>
<body>
<canvas id="labView"></canvas>
<div id="labBar"></div>
<div id="labStatus">불러오는 중…</div>
<div id="labSync"></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";
new BbMotionLab({ THREE, GLTFLoader, SkeletonUtils });
</script>
</body>
</html>
