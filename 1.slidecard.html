<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src https://*.firebasedatabase.app https://*.firebaseio.com; base-uri 'none'; form-action 'none'">
<script charset="utf-8" src="firebase-config.js"></script>
<script charset="utf-8" src="access-guard.js" data-game="slidecard"></script>
<script charset="utf-8" src="world-record.js"></script>
<title>카드 옮기기</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="정보 수업용 링크 모음">
<meta property="og:title" content="카드 옮기기">
<meta property="og:description" content="정보 수업용 링크 모음">
<meta property="og:url" content="https://cornsilktea.github.io/1.slidecard.html">
<meta property="og:image" content="https://cornsilktea.github.io/icon-512.png">
<meta name="twitter:card" content="summary">
<style>
*{box-sizing:border-box;}
body{
  margin:0;padding:16px;
  background:var(--sg-bg);color:var(--sg-ink);
  font-family:var(--sg-font);
  -webkit-user-select:none;user-select:none;
}
.wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
.boardpane{flex:1 1 380px;max-width:520px;min-width:280px;}
.board{position:relative;width:100%;border:2px solid var(--sg-line-strong);border-radius:var(--sg-radius);background:var(--sg-panel);padding:8px;touch-action:none;}
.card{position:absolute;border-radius:var(--sg-radius);background:var(--sg-primary);cursor:grab;}
.card.red{background:#D97B4F;}
.card.locked{cursor:default;}
.card.anim{transition:left .13s ease-out, top .13s ease-out;}
.card.dragging{cursor:grabbing;z-index:5;}
.panel{flex:0 0 216px;display:flex;flex-direction:column;gap:8px;}
.tile{background:var(--sg-panel);border:1px solid var(--sg-line-mid);border-radius:var(--sg-radius);padding:12px;}
.k{font-size:12px;color:var(--sg-ink-soft);margin-bottom:4px;}
.v{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;}
.v.done{color:var(--sg-ok);}
.s{font-size:12px;color:var(--sg-ink-soft);margin-top:4px;}
.goal{font-size:13px;line-height:1.5;}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sg-ink-mid);margin-top:6px;}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
.dot.red{background:#D97B4F;}
.dot.blue{background:var(--sg-primary);}
button{
  font-family:inherit;font-size:13px;padding:9px 12px;
  border:1.5px solid var(--sg-line-strong);border-radius:var(--sg-radius);
  background:#fff;color:var(--sg-ink);cursor:pointer;
}
button:hover{background:var(--sg-panel-alt);}
[hidden]{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="boardpane">
    <div id="board" class="board"></div>
  </div>
  <aside class="panel">
    <div class="tile">
      <div class="k">경과 시간</div>
      <div class="v" id="clock">00:00.00</div>
      <div class="s" id="status">대기 중 · 첫 이동에서 시작</div>
    </div>
    <div class="tile">
      <div class="k">이동 횟수</div>
      <div class="v" id="moves">0</div>
    </div>
    <div class="tile">
      <div class="k">개인 최고 기록</div>
      <div class="v" id="best">-</div>
      <div class="s" id="bestMoves"></div>
    </div>
    <div class="tile">
      <div class="k">세계 신기록</div>
      <div class="v" id="world">-</div>
      <div class="s" id="worldName"></div>
    </div>
    <div class="tile" id="clsTile" hidden>
      <div class="k">우리 반 신기록</div>
      <div class="v" id="clsVal">-</div>
      <div class="s" id="clsName"></div>
    </div>
    <button id="reset" type="button">초기화</button>
    <div class="tile">
      <div class="k">목표</div>
      <div class="goal">주황 카드를 오른쪽 맨 아래 칸(6행 6열)으로 옮기기</div>
      <div class="legend"><span class="dot red"></span>주황 카드<span class="dot blue" style="margin-left:8px"></span>초록 카드</div>
    </div>
  </aside>
</div>
<script src="1.slidecard.js"></script>
</body>
</html>
