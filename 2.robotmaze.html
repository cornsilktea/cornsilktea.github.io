<style>
*{box-sizing:border-box;}
body{
  margin:0;padding:16px;
  background:var(--sg-bg);color:var(--sg-ink);
  font-family:var(--sg-font);font-size:14px;line-height:1.5;
}
h1{font-size:16px;margin:0 0 4px;letter-spacing:-0.01em;}
.sub{font-size:12px;color:var(--sg-ink-soft);margin:0 0 12px;}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start;}
@media (max-width:760px){.wrap{grid-template-columns:1fr;}}

.boardbox{display:inline-block;border:2px solid var(--sg-line-strong);border-radius:var(--sg-radius);padding:12px;background:var(--sg-panel);}
#board{display:grid;grid-template-columns:repeat(8,64px);grid-template-rows:repeat(8,64px);grid-gap:3px;gap:3px;font-size:64px;}
.c{background:var(--sg-bg);border:1px solid var(--sg-line);border-radius:4px;position:relative;display:flex;align-items:center;justify-content:center;}
.c.wall{background:var(--sg-ink);border-color:var(--sg-ink);}
.c.start{background:var(--sg-line);}
.c.goal{background:var(--sg-primary-soft);border-color:var(--sg-primary-soft);}
.tag{font-size:0.22em;color:var(--sg-ink-soft);letter-spacing:-0.03em;}
.c.goal .tag{color:var(--sg-primary);}
.robot{position:absolute;top:-1px;right:-1px;bottom:-1px;left:-1px;border-radius:4px;background:var(--sg-primary);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:0.72em;line-height:1;}
.robot.win{background:var(--sg-ok);}
.robot.fail{background:var(--sg-danger);}

.stats{display:flex;gap:12px;margin-top:12px;font-size:12px;color:var(--sg-ink-soft);flex-wrap:wrap;}
.stats b{color:var(--sg-ink);font-weight:600;font-variant-numeric:tabular-nums;}

.panel{display:flex;flex-direction:column;gap:12px;min-width:0;}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.m.wide{grid-column:1/-1;}
.m{border:1px solid var(--sg-line-mid);border-radius:var(--sg-radius);padding:12px;background:#fff;}
.m .lab{font-size:12px;color:var(--sg-ink-soft);}
.m .val{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;margin-top:2px;}

.ctrls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.btn{height:76px;border:1px solid var(--sg-primary);border-radius:var(--sg-radius);
  background:var(--sg-primary);color:#fff;font-family:inherit;font-size:14px;font-weight:600;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;}
.btn .sym{font-size:20px;line-height:1;}
.btn:disabled{background:var(--sg-line);border-color:var(--sg-line-mid);color:var(--sg-ink-faint);cursor:not-allowed;}

.subs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.sbtn{height:40px;border:1.5px solid var(--sg-line-strong);border-radius:var(--sg-radius);
  background:#fff;color:var(--sg-ink);font-family:inherit;font-size:13px;cursor:pointer;}
.sbtn:hover:not(:disabled){background:var(--sg-panel-alt);}
.sbtn:disabled{color:var(--sg-ink-faint);cursor:not-allowed;background:var(--sg-bg);}

.msg{border:1px solid var(--sg-line-mid);border-radius:var(--sg-radius);padding:12px;
  font-size:13px;min-height:44px;background:#fff;}
.msg.win{border-color:var(--sg-ok);color:var(--sg-ok);}
.msg.fail{border-color:var(--sg-danger);color:var(--sg-danger);}
.hint{font-size:12px;color:var(--sg-ink-soft);border-top:1px solid var(--sg-line-mid);padding-top:8px;}
.hint b{color:var(--sg-ink);font-weight:600;}

@media (min-width:1500px){
  body{font-size:17px;padding:24px;}
  h1{font-size:26px;}
  .sub{font-size:16px;}
  .wrap{grid-template-columns:minmax(0,1fr) 520px;}
  .stats{font-size:16px;}
  .m .lab{font-size:15px;}
  .m .val{font-size:38px;}
  .btn{height:104px;font-size:19px;}
  .btn .sym{font-size:28px;}
  .sbtn{height:56px;font-size:17px;}
  .msg{font-size:17px;min-height:60px;}
  .hint{font-size:15px;}
}
@media (min-width:2400px){
  body{font-size:22px;padding:32px;}
  h1{font-size:36px;}
  .sub{font-size:21px;}
  .wrap{grid-template-columns:minmax(0,1fr) 760px;}
  .stats{font-size:22px;}
  .m .lab{font-size:20px;}
  .m .val{font-size:54px;}
  .btn{height:150px;font-size:26px;}
  .btn .sym{font-size:40px;}
  .sbtn{height:76px;font-size:23px;}
  .msg{font-size:23px;min-height:80px;}
  .hint{font-size:20px;}
}
[hidden]{display:none !important;}
</style>

<body>
<h1>로봇 미로</h1>
<p class="sub">로봇은 자기가 보는 방향 기준으로 돕니다. 벽이나 판 밖으로 전진하면 실패입니다.</p>

<div class="wrap">
  <div>
    <div class="boardbox"><div id="board"></div></div>
    <div class="stats" id="stats">
      <span>벽 개수 <b id="sWalls">-</b></span>
      <span>4칸 구간 <b id="sRuns">-</b></span>
      <span>로봇 방향 <b id="sDir">북</b></span>
    </div>
  </div>

  <div class="panel">
    <div class="metrics">
      <div class="m"><div class="lab">시간</div><div class="val" id="mTime">0.00초</div></div>
      <div class="m"><div class="lab">명령 수</div><div class="val" id="mCmd">0</div></div>
      <div class="m wide"><div class="lab">개인 최고 기록</div><div class="val" id="mBest">-</div><div class="lab" id="mBestSub">아직 기록 없음</div></div>
      <div class="m wide"><div class="lab">세계 신기록</div><div class="val" id="mWorld">-</div><div class="lab" id="mWorldSub">불러오는 중…</div></div>
      <div class="m wide" id="mCls" hidden><div class="lab">우리 반 신기록</div><div class="val" id="mClsVal">-</div><div class="lab" id="mClsSub">불러오는 중…</div></div>
    </div>

    <div class="ctrls">
      <button class="btn" id="bL"><span class="sym">&#8624;</span>좌회전</button>
      <button class="btn" id="bF"><span class="sym">&#8593;</span>전진</button>
      <button class="btn" id="bR"><span class="sym">&#8625;</span>우회전</button>
    </div>

    <div class="subs">
      <button class="sbtn" id="bRetry">다시 시도</button>
      <button class="sbtn" id="bReset">초기화</button>
    </div>

    <div class="msg" id="msg">첫 명령을 누르면 시간이 시작됩니다.</div>
    <div class="hint">키보드 <b>&#8592;</b> 또는 <b>A</b> 좌회전 &nbsp; <b>&#8593;</b> 또는 <b>W</b> 전진 &nbsp; <b>&#8594;</b> 또는 <b>D</b> 우회전<br><b>스페이스바</b>로 다시 시작할 수 있습니다. 다시 시도는 같은 미로, 초기화는 새 미로입니다.</div>
  </div>
</div>

<script>
(function(){
  var N=8;
  var START={r:7,c:0};
  var GOAL={r:0,c:7};
  var DIRS=[[-1,0],[0,1],[1,0],[0,-1]];
  var ARROW=['▲','▶','▼','◀'];
  var DIRNAME=['북','동','남','서'];
  var TARGET_MIN_COMMANDS=22;

  function key(r,c){
    return r*N+c;
  }
  function inBounds(r,c){
    return r>=0 && r<N && c>=0 && c<N;
  }
  function isStart(r,c){
    return r===START.r && c===START.c;
  }
  function isGoal(r,c){
    return r===GOAL.r && c===GOAL.c;
  }
  function emptyGrid(){
    var g=[];
    for(var r=0;r<N;r++){
      g.push([0,0,0,0,0,0,0,0]);
    }
    return g;
  }

  var PROTECTED=(function(){
    var s={};
    s[key(START.r,START.c)]=1;
    s[key(GOAL.r,GOAL.c)]=1;
    for(var dr=-1;dr<=1;dr++){
      for(var dc=-1;dc<=1;dc++){
        var r=START.r+dr, c=START.c+dc;
        if(inBounds(r,c)){
          s[key(r,c)]=1;
        }
      }
    }
    return s;
  })();

  function openRuns(g){
    var out=[];
    function scan(byColumn){
      for(var a=0;a<N;a++){
        var cur=[];
        for(var b=0;b<N;b++){
          var r=byColumn?b:a, c=byColumn?a:b;
          if(g[r][c]===0){
            cur.push([r,c]);
          }else{
            if(cur.length){
              out.push(cur);
            }
            cur=[];
          }
        }
        if(cur.length){
          out.push(cur);
        }
      }
    }
    scan(false);
    scan(true);
    return out;
  }

  function carve(){
    var g=emptyGrid();
    for(var attempt=0;attempt<400;attempt++){
      var longRuns=openRuns(g).filter(function(run){ return run.length>=5; });
      if(longRuns.length===0){
        return g;
      }
      var run=longRuns[Math.floor(Math.random()*longRuns.length)];
      var candidates=run.filter(function(p){ return !PROTECTED[key(p[0],p[1])]; });
      if(candidates.length===0){
        return null;
      }
      var pick=Math.random()<0.6
        ? candidates[Math.floor(candidates.length/2)]
        : candidates[Math.floor(Math.random()*candidates.length)];
      g[pick[0]][pick[1]]=1;
    }
    return null;
  }

  function reachable(g){
    var seen={}, q=[[START.r,START.c]];
    seen[key(START.r,START.c)]=1;
    for(var h=0;h<q.length;h++){
      var r=q[h][0], c=q[h][1];
      if(isGoal(r,c)){
        return true;
      }
      for(var d=0;d<4;d++){
        var nr=r+DIRS[d][0], nc=c+DIRS[d][1];
        if(inBounds(nr,nc) && g[nr][nc]===0 && !seen[key(nr,nc)]){
          seen[key(nr,nc)]=1;
          q.push([nr,nc]);
        }
      }
    }
    return false;
  }

  function minCommands(g){
    var dist={}, q=[[START.r,START.c,0]];
    dist[key(START.r,START.c)*4]=0;
    for(var h=0;h<q.length;h++){
      var r=q[h][0], c=q[h][1], d=q[h][2];
      var cur=dist[key(r,c)*4+d];
      if(isGoal(r,c)){
        return cur;
      }
      var turns=[(d+1)%4,(d+3)%4];
      for(var t=0;t<2;t++){
        var nd=turns[t];
        if(dist[key(r,c)*4+nd]===undefined){
          dist[key(r,c)*4+nd]=cur+1;
          q.push([r,c,nd]);
        }
      }
      var fr=r+DIRS[d][0], fc=c+DIRS[d][1];
      if(inBounds(fr,fc) && g[fr][fc]===0 && dist[key(fr,fc)*4+d]===undefined){
        dist[key(fr,fc)*4+d]=cur+1;
        q.push([fr,fc,d]);
      }
    }
    return -1;
  }

  function tryOne(maxRunsOfFour){
    var g=carve();
    if(!g){
      return null;
    }
    var runs=openRuns(g);
    var longest=0, runsOfFour=0;
    for(var i=0;i<runs.length;i++){
      longest=Math.max(longest,runs[i].length);
      if(runs[i].length===4){
        runsOfFour++;
      }
    }
    if(longest>4 || runsOfFour>maxRunsOfFour || !reachable(g) || minCommands(g)!==TARGET_MIN_COMMANDS){
      return null;
    }
    var walls=0;
    for(var r=0;r<N;r++){
      for(var c=0;c<N;c++){
        walls+=g[r][c];
      }
    }
    return {grid:g, walls:walls, runs4:runsOfFour};
  }

  function makeBoard(){
    var caps=[5,6,99];
    for(var k=0;k<caps.length;k++){
      for(var i=0;i<4000;i++){
        var b=tryOne(caps[k]);
        if(b){
          return b;
        }
      }
    }
    return null;
  }

  var board=null, nextBoard=null;
  var st={r:START.r,c:START.c,d:0,cmds:0,started:false,t0:0,tEnd:0,fin:null};
  var timerId=null;

  function byId(id){ return document.getElementById(id); }
  var el={
    board:byId('board'),
    stats:byId('stats'),
    time:byId('mTime'),
    cmd:byId('mCmd'),
    walls:byId('sWalls'),
    runs:byId('sRuns'),
    dir:byId('sDir'),
    msg:byId('msg'),
    bL:byId('bL'),
    bF:byId('bF'),
    bR:byId('bR'),
    retry:byId('bRetry'),
    reset:byId('bReset'),
    best:byId('mBest'),
    bestSub:byId('mBestSub'),
    world:byId('mWorld'),
    worldSub:byId('mWorldSub'),
    classBox:byId('mCls'),
    classVal:byId('mClsVal'),
    classSub:byId('mClsSub')
  };

  function seconds(ms){
    return (ms/1000).toFixed(2)+'초';
  }

  var BEST_KEY='robotmaze_best_v1';
  var best=loadBest();

  function loadBest(){
    try{
      var raw=localStorage.getItem(BEST_KEY);
      if(!raw){
        return null;
      }
      var v=JSON.parse(raw);
      if(v&&typeof v.cmds==='number'&&typeof v.time==='number'){
        return v;
      }
    }catch(e){}
    return null;
  }

  function saveBest(v){
    try{
      localStorage.setItem(BEST_KEY,JSON.stringify(v));
    }catch(e){}
  }

  function renderBest(){
    if(best){
      el.best.textContent='명령 '+best.cmds+'개';
      el.bestSub.textContent=seconds(best.time);
    }else{
      el.best.textContent='-';
      el.bestSub.textContent='아직 기록 없음';
    }
  }

  function recordWin(cmds,time){
    if(!best || cmds<best.cmds || (cmds===best.cmds && time<best.time)){
      best={cmds:cmds,time:time};
      saveBest(best);
    }
    renderBest();
    if(WR){WR.prompt(time);}
  }

  var WR=window.WorldRecord?WorldRecord('robotmaze',{lower:true,format:seconds}):null;
  function renderWorld(){
    if(WR&&WR.rec){el.world.textContent=WR.text();el.worldSub.textContent=WR.who();}
    else{el.world.textContent='-';el.worldSub.textContent=(WR&&!WR.loaded)?'불러오는 중…':'아직 기록 없음';}
    var classRecord=WR&&WR.cls;
    if(classRecord){
      el.classBox.hidden=false;
      el.classVal.textContent=classRecord.rec?classRecord.text():'-';
      el.classSub.textContent=classRecord.rec?classRecord.who():(classRecord.loaded?'아직 기록 없음':'불러오는 중…');
    }
  }
  if(WR){WR.onChange(renderWorld);WR.load();}
  renderWorld();

  var cells=[];
  for(var i=0;i<N*N;i++){
    var cellEl=document.createElement('div');
    cellEl.className='c';
    el.board.appendChild(cellEl);
    cells.push(cellEl);
  }
  var robotEl=document.createElement('div');

  var GAP=3, MINCELL=28, MAXCELL=240;
  var HAS_GRID=typeof document.createElement('div').style.gridTemplateColumns==='string';

  function fitBoard(){
    var box=el.board.parentNode;
    var col=box.parentNode;
    var padX=24, bord=2;
    if(window.getComputedStyle){
      var cs=window.getComputedStyle(box);
      padX=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
      bord=(parseFloat(cs.borderLeftWidth)||0)+(parseFloat(cs.borderRightWidth)||0);
    }
    var availW=col.clientWidth-padX-bord;
    var vh=window.innerHeight||document.documentElement.clientHeight||600;
    var top=el.board.getBoundingClientRect().top+(window.pageYOffset||document.documentElement.scrollTop||0);
    var reserve=el.stats.offsetHeight+48;
    var availH=vh-top-reserve;
    var byW=(availW-GAP*(N-1))/N;
    var byH=(availH-GAP*(N-1))/N;
    var size=Math.floor(Math.min(byW,byH));
    if(!(size>MINCELL)){
      size=MINCELL;
    }
    if(size>MAXCELL){
      size=MAXCELL;
    }
    var full=size*N+GAP*(N-1);
    el.board.style.width=full+'px';
    el.board.style.fontSize=size+'px';
    if(HAS_GRID){
      var tmpl='repeat('+N+', '+size+'px)';
      el.board.style.gridTemplateColumns=tmpl;
      el.board.style.gridTemplateRows=tmpl;
      return;
    }
    el.board.style.position='relative';
    el.board.style.height=full+'px';
    for(var i=0;i<cells.length;i++){
      var cell=cells[i];
      cell.style.position='absolute';
      cell.style.width=size+'px';
      cell.style.height=size+'px';
      cell.style.left=((i%N)*(size+GAP))+'px';
      cell.style.top=(Math.floor(i/N)*(size+GAP))+'px';
    }
  }

  function elapsed(){
    if(!st.started){
      return 0;
    }
    return (st.fin!==null ? st.tEnd : Date.now()) - st.t0;
  }

  function tick(){
    el.time.textContent=seconds(elapsed());
  }

  function renderGrid(){
    for(var r=0;r<N;r++){
      for(var c=0;c<N;c++){
        var d=cells[key(r,c)];
        var open=board.grid[r][c]===0;
        var cls='c';
        if(!open){
          cls+=' wall';
        }else if(isGoal(r,c)){
          cls+=' goal';
        }else if(isStart(r,c)){
          cls+=' start';
        }
        d.className=cls;
        d.innerHTML='';
        if(open && isGoal(r,c)){
          d.innerHTML='<span class="tag">도착</span>';
        }else if(open && isStart(r,c)){
          d.innerHTML='<span class="tag">출발</span>';
        }
      }
    }
    el.walls.textContent=String(board.walls);
    el.runs.textContent=board.runs4+'개';
  }

  function render(){
    robotEl.className='robot'+(st.fin==='win'?' win':(st.fin==='fail'?' fail':''));
    robotEl.textContent=ARROW[st.d];
    cells[key(st.r,st.c)].appendChild(robotEl);

    el.cmd.textContent=String(st.cmds);
    el.dir.textContent=DIRNAME[st.d];
    tick();

    var lock=(st.fin!==null);
    el.bL.disabled=lock;
    el.bF.disabled=lock;
    el.bR.disabled=lock;
    el.retry.disabled=(st.fin==='win');
  }

  function stopTimer(){
    if(timerId){
      clearInterval(timerId);
      timerId=null;
    }
  }

  function finish(kind, text){
    st.fin=kind;
    st.tEnd=Date.now();
    stopTimer();
    el.msg.className='msg '+kind;
    el.msg.textContent=text;
    render();
  }

  function summary(){
    return '명령 '+st.cmds+'개 · '+seconds(elapsed());
  }

  function act(kind){
    if(st.fin!==null){
      return;
    }
    if(!st.started){
      st.started=true;
      st.t0=Date.now();
      timerId=setInterval(tick,50);
    }
    st.cmds++;
    if(kind==='L'){
      st.d=(st.d+3)%4;
    }else if(kind==='R'){
      st.d=(st.d+1)%4;
    }else{
      var nr=st.r+DIRS[st.d][0];
      var nc=st.c+DIRS[st.d][1];
      if(!inBounds(nr,nc)){
        finish('fail','실패. 판 밖으로 나갔습니다. '+summary());
        return;
      }
      st.r=nr;
      st.c=nc;
      if(board.grid[nr][nc]===1){
        finish('fail','실패. 벽에 부딪혔습니다. '+summary());
        return;
      }
      if(isGoal(nr,nc)){
        var time=Date.now()-st.t0;
        finish('win','도착. 명령 '+st.cmds+'개 · '+seconds(time));
        recordWin(st.cmds,time);
        return;
      }
    }
    render();
  }

  function softReset(){
    stopTimer();
    st={r:START.r,c:START.c,d:0,cmds:0,started:false,t0:0,tEnd:0,fin:null};
    el.msg.className='msg';
    el.msg.textContent='첫 명령을 누르면 시간이 시작됩니다.';
    renderGrid();
    render();
  }

  function prefetch(){
    setTimeout(function(){
      if(!nextBoard){
        nextBoard=makeBoard();
      }
    },0);
  }

  function newBoard(){
    var b=nextBoard||makeBoard();
    nextBoard=null;
    if(b){
      board=b;
    }
    softReset();
    prefetch();
  }

  function retry(){
    if(st.fin!=='win'){
      softReset();
    }
  }

  el.bL.addEventListener('click',function(){ act('L'); });
  el.bF.addEventListener('click',function(){ act('F'); });
  el.bR.addEventListener('click',function(){ act('R'); });
  el.retry.addEventListener('click',retry);
  el.reset.addEventListener('click',newBoard);

  document.addEventListener('keydown',function(e){
    var k=e.key.length===1 ? e.key.toLowerCase() : e.key;
    var c=e.code;
    if(k==='ArrowUp' || k==='w' || c==='KeyW'){
      e.preventDefault();
      act('F');
    }else if(k==='ArrowLeft' || k==='a' || c==='KeyA'){
      e.preventDefault();
      act('L');
    }else if(k==='ArrowRight' || k==='d' || c==='KeyD'){
      e.preventDefault();
      act('R');
    }else if(k===' ' || k==='Spacebar' || c==='Space'){
      e.preventDefault();
      if(st.fin==='win'){
        newBoard();
      }else{
        softReset();
      }
    }
  });

  board=makeBoard()||{grid:emptyGrid(),walls:0,runs4:0};
  fitBoard();
  softReset();
  renderBest();
  prefetch();
  window.addEventListener('resize',fitBoard);
  window.addEventListener('orientationchange',fitBoard);
  if(document.readyState!=='complete'){
    window.addEventListener('load',fitBoard);
  }
  setTimeout(fitBoard,300);
})();
</script>
</body>
</html>
