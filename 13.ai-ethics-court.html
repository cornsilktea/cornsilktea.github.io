<!DOCTYPE html>
<html lang="ko">
<head>
<script charset="utf-8" src="firebase-config.js"></script>
<script charset="utf-8" src="access-guard.js" data-game="aiethicscourt"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 윤리 법정 — 전자칠판</title>
<style>
  :root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --ink:#1f2430;
    --sub:#6b7280;
    --line:#e1e6ef;
    --wood:#8b5e34;
    --wood-soft:#f2e9df;
    --agree:#1a9b64;
    --cond:#c9860a;
    --disagree:#e5484d;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-user-select:none;
    user-select:none;
  }
  header{
    padding:14px 26px 6px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:10px;
  }
  h1{font-size:1.5rem;margin:0;font-weight:800;letter-spacing:-0.02em;}
  .desc{color:var(--sub);font-size:0.92rem;margin-top:2px;}
  .status{display:flex;gap:10px;flex-wrap:wrap;}
  .pill{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 16px;
    font-weight:700;
    white-space:nowrap;
    font-size:0.95rem;
  }
  .pill.count{color:var(--wood);}
  .pill.link{color:var(--sub);}
  .pill.link.bad{color:var(--disagree);border-color:#f4c7c9;}

  main{
    flex:1;
    display:grid;
    grid-template-columns:minmax(0,1fr) 300px;
    gap:18px;
    align-items:start;
    padding:6px 26px 22px;
  }

  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px 28px;
  }

  #stage{display:flex;flex-direction:column;gap:18px;}

  .case-label{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:0.95rem;
    font-weight:800;
    color:var(--wood);
    background:var(--wood-soft);
    border-radius:999px;
    padding:6px 16px;
    width:fit-content;
  }
  .case-text{
    font-size:clamp(1.3rem, 2.4vw, 2rem);
    font-weight:700;
    line-height:1.5;
  }

  /* ----- 저울 ----- */
  .scale-wrap{
    display:flex;
    justify-content:center;
    padding:4px 0 0;
  }
  svg.scale{width:min(560px,100%);height:auto;}
  .beam{transition:transform .5s cubic-bezier(.34,1.3,.64,1);transform-origin:200px 40px;}
  .pan-label{font-size:13px;font-weight:800;}

  /* ----- 막대 ----- */
  .bars{display:flex;flex-direction:column;gap:12px;}
  .bar-row{
    display:grid;
    grid-template-columns:120px 1fr 92px;
    align-items:center;
    gap:12px;
  }
  .bar-label{font-size:1.05rem;font-weight:800;}
  .bar-track{background:#f0f2f7;border-radius:999px;height:34px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:999px;width:0%;transition:width .4s ease;}
  .bar-fill.agree{background:var(--agree);}
  .bar-fill.cond{background:var(--cond);}
  .bar-fill.disagree{background:var(--disagree);}
  .bar-count{font-size:1.05rem;font-weight:800;text-align:right;}
  .bar-count small{color:var(--sub);font-weight:700;font-size:0.85rem;}

  /* ----- 참여 안내 ----- */
  #joinPanel{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:20px;}
  .join-title{font-size:0.92rem;font-weight:800;color:var(--sub);}
  .join-code{
    font-size:2.6rem;
    font-weight:900;
    letter-spacing:0.14em;
    color:var(--wood);
    line-height:1;
  }
  .qr-box{
    width:190px;height:190px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:8px;
  }
  .qr-box svg{display:block;width:100%;height:100%;shape-rendering:crispEdges;}
  .join-url{font-size:0.8rem;color:var(--sub);word-break:break-all;line-height:1.4;}
  .join-hint{font-size:0.85rem;color:var(--sub);line-height:1.5;}

  /* ----- 버튼 ----- */
  .btnbar{
    grid-column:1 / -1;
    display:flex;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .left-btns,.right-btns{display:flex;gap:10px;flex-wrap:wrap;}
  button.primary{
    background:var(--wood);color:#fff;border:none;border-radius:14px;
    padding:14px 28px;font-size:1.05rem;font-weight:800;cursor:pointer;
  }
  button.primary:active{transform:translateY(1px);}
  button.ghost{
    background:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:14px;padding:14px 22px;font-size:1.02rem;font-weight:700;cursor:pointer;
  }
  button:disabled{opacity:.45;cursor:default;}

  /* ----- 결과 모음 ----- */
  #summaryScreen{display:none;grid-column:1 / -1;flex-direction:column;gap:20px;}
  #summaryScreen h2{margin:0;font-size:1.6rem;}
  .summary-list{display:flex;flex-direction:column;gap:14px;max-height:62vh;overflow-y:auto;padding-right:6px;}
  .summary-case{border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;}
  .summary-case .case-text{font-size:1.02rem;}
  .summary-case .bar-row{grid-template-columns:100px 1fr 80px;}
  .summary-case .bar-track{height:22px;}
  .summary-case .bar-label,.summary-case .bar-count{font-size:0.92rem;}

  @media (max-width:900px){
    main{grid-template-columns:1fr;}
    .qr-box{width:160px;height:160px;}
  }
</style>
</head>

  <div>
    <h1>⚖️ AI 윤리 법정</h1>
    <div class="desc">사건을 읽고 태블릿으로 판결해 주세요. 정답은 없어요 — 우리 반의 생각을 함께 확인해봐요.</div>

    <div>
      <div class="join-title">참여 코드</div>

    </div>

</main>

<script charset="utf-8" src="court-cases.js"></script>
<script>
(function(){
  "use strict";

  var CASES   = window.COURT_CASES || [];
  var OPTIONS = window.COURT_OPTIONS || [];
  var CFG     = window.PORTAL_CONFIG || {};

  /* 학생 태블릿이 접속할 주소 — 오른쪽 QR은 이 주소로 미리 만들어 둔 것입니다.
     파일 이름이나 사이트 주소를 바꾸면 QR도 다시 만들어야 합니다(사용법.md 참고). */
  var VOTE_URL = "https://cornsilktea.github.io/13.ai-ethics-court-vote.html";

  /* 헷갈리기 쉬운 글자(0 O 1 I)는 빼고 코드를 만듭니다. */
  var CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var STORE_KEY  = "court_board_room_v1";

  var room = null;       /* 참여 코드 */
  var idx = 0;           /* 지금 보여 주는 사건 번호(0부터) */
  var data = {};         /* 서버에서 받아 온 이 세션 전체 */
  var pollTimer = null;
  var lastOk = 0;

  var el = function(id){ return document.getElementById(id); };
  var caseLabel = el('caseLabel'), caseText = el('caseText'), barsBox = el('barsBox');
  var progressPill = el('progressPill'), votePill = el('votePill'), linkPill = el('linkPill');
  var codeText = el('codeText'), joinUrl = el('joinUrl'), beam = el('beam');
  var stage = el('stage'), joinPanel = el('joinPanel'), btnbar = el('btnbar');
  var summaryScreen = el('summaryScreen'), summaryList = el('summaryList');

  function dbUrl(path){
    return String(CFG.DB_URL || "").replace(/\/+$/, "") + "/" + path + ".json";
  }
  function ready(){
    return !!(CFG.isReady && CFG.isReady());
  }

  function put(path, value){
    return fetch(dbUrl(path), {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(value)
    });
  }
  function del(path){
    return fetch(dbUrl(path), { method:"DELETE" });
  }

  function makeCode(){
    var s = "";
    for (var i = 0; i < 4; i++){
      s += CODE_CHARS.charAt(Math.floor(Math.random() * CODE_CHARS.length));
    }
    return s;
  }

  /* ---------- 세션 ---------- */

  function startSession(){
    if (!ready()){ setLink(false, "설정 파일 확인 필요"); return; }
    room = makeCode();
    idx = 0;
    data = {};
    try { localStorage.setItem(STORE_KEY, room); } catch(e){}
    codeText.textContent = room;

    /* 방을 새로 만들고, 태블릿이 찾아올 수 있게 '지금 열린 방'으로 등록합니다. */
    put("court/room/" + room, { state: { i: 0, t: Date.now() } })
      .then(function(){ return put("court/now", { code: room, t: Date.now() }); })
      .then(function(){ setLink(true); refresh(); })
      .catch(function(){ setLink(false, "저장 실패"); });

    render();
  }

  function resumeSession(){
    var saved = null;
    try { saved = localStorage.getItem(STORE_KEY); } catch(e){}
    if (saved && /^[A-Z0-9]{4}$/.test(saved)){
      room = saved;
      codeText.textContent = room;
      /* 이 화면이 여전히 '지금 열린 방'인지 확인하고, 아니면 다시 등록합니다. */
      fetch(dbUrl("court/now"), {cache:"no-store"})
        .then(function(r){ return r.json(); })
        .then(function(now){
          if (!now || now.code !== room){ put("court/now", { code: room, t: Date.now() }); }
        })
        .catch(function(){});
      refresh();
      render();
    } else {
      startSession();
    }
  }

  function pushState(){
    if (!room) return;
    put("court/room/" + room + "/state", { i: idx, t: Date.now() }).catch(function(){});
  }

  /* ---------- 서버에서 판결 받아오기 ---------- */

  function refresh(){
    if (!room || !ready()) return;
    fetch(dbUrl("court/room/" + room), {cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(json){
        data = json || {};
        lastOk = Date.now();
        setLink(true);
        if (summaryScreen.style.display === "flex") renderSummary(); else renderBars();
      })
      .catch(function(){
        if (Date.now() - lastOk > 6000) setLink(false, "연결 끊김");
      });
  }

  function setLink(ok, msg){
    linkPill.textContent = ok ? "연결됨" : ("⚠ " + (msg || "연결 확인 중…"));
    linkPill.classList.toggle("bad", !ok);
  }

  function tally(caseIdx){
    var out = { agree:0, cond:0, disagree:0, total:0 };
    var votes = data && data.votes ? data.votes[caseIdx] : null;
    if (!votes) return out;
    Object.keys(votes).forEach(function(dev){
      var v = votes[dev];
      if (out.hasOwnProperty(v)){ out[v] += 1; out.total += 1; }
    });
    return out;
  }

  /* ---------- 화면 그리기 ---------- */

  function render(){
    var c = CASES[idx] || { text:"" };
    caseLabel.textContent = "사건 " + (idx + 1);
    progressPill.textContent = "사건 " + (idx + 1) + " / " + CASES.length;
    caseText.textContent = c.text;
    el('prevBtn').style.visibility = idx === 0 ? "hidden" : "visible";
    el('nextBtn').textContent = idx === CASES.length - 1 ? "결과 보기 →" : "다음 사건 →";
    renderBars();
  }

  function renderBars(){
    var t = tally(idx);
    votePill.textContent = "판결 " + t.total + "표";

    barsBox.innerHTML = "";
    OPTIONS.forEach(function(opt){
      var count = t[opt.key];
      var pct = t.total > 0 ? Math.round((count / t.total) * 100) : 0;
      var row = document.createElement('div');
      row.className = "bar-row";
      row.innerHTML =
        '<div class="bar-label">' + opt.label + '</div>' +
        '<div class="bar-track"><div class="bar-fill ' + opt.key + '" style="width:' + pct + '%"></div></div>' +
        '<div class="bar-count">' + count + '표 <small>' + pct + '%</small></div>';
      barsBox.appendChild(row);
    });

    /* 저울 — 조건부 찬성은 양쪽에 반씩 얹습니다. */
    var left = t.agree + t.cond * 0.5;
    var right = t.disagree + t.cond * 0.5;
    var angle = t.total > 0 ? ((right - left) / t.total) * 16 : 0;
    beam.style.transform = "rotate(" + angle.toFixed(2) + "deg)";
  }

  function renderSummary(){
    summaryList.innerHTML = "";
    CASES.forEach(function(c, i){
      var t = tally(i);
      var bars = OPTIONS.map(function(opt){
        var count = t[opt.key];
        var pct = t.total > 0 ? Math.round((count / t.total) * 100) : 0;
        return '<div class="bar-row">' +
               '<div class="bar-label">' + opt.label + '</div>' +
               '<div class="bar-track"><div class="bar-fill ' + opt.key + '" style="width:' + pct + '%"></div></div>' +
               '<div class="bar-count">' + count + '표</div></div>';
      }).join("");

      var wrap = document.createElement('div');
      wrap.className = "summary-case";
      var label = document.createElement('div');
      label.className = "case-label";
      label.textContent = "사건 " + (i + 1) + " · 총 " + t.total + "표";
      var text = document.createElement('div');
      text.className = "case-text";
      text.textContent = c.text;
      var barsWrap = document.createElement('div');
      barsWrap.className = "bars";
      barsWrap.innerHTML = bars;
      wrap.appendChild(label); wrap.appendChild(text); wrap.appendChild(barsWrap);
      summaryList.appendChild(wrap);
    });
  }

  function showSummary(){
    stage.style.display = "none";
    joinPanel.style.display = "none";
    btnbar.style.display = "none";
    summaryScreen.style.display = "flex";
    renderSummary();
  }
  function hideSummary(){
    summaryScreen.style.display = "none";
    stage.style.display = "flex";
    joinPanel.style.display = "flex";
    btnbar.style.display = "flex";
    render();
  }

  /* ---------- 버튼 ---------- */

  el('nextBtn').addEventListener('click', function(){
    if (idx < CASES.length - 1){ idx += 1; pushState(); render(); }
    else { showSummary(); }
  });
  el('prevBtn').addEventListener('click', function(){
    if (idx > 0){ idx -= 1; pushState(); render(); }
  });
  el('backBtn').addEventListener('click', hideSummary);
  el('resetBtn').addEventListener('click', function(){
    if (!room) return;
    if (!confirm("사건 " + (idx + 1) + "의 판결을 모두 지울까요?")) return;
    del("court/room/" + room + "/votes/" + idx).then(function(){
      if (data.votes) delete data.votes[idx];
      renderBars();
      refresh();
    });
  });
  el('newSessionBtn').addEventListener('click', function(){
    if (!confirm("새 참여 코드를 만들고 판결을 처음부터 다시 받을까요?\n(지금까지의 판결은 화면에서 사라집니다)")) return;
    hideSummary();
    startSession();
  });

  /* ---------- 시작 ---------- */

  joinUrl.textContent = VOTE_URL.replace(/^https?:\/\//, "");
  render();
  if (!ready()){
    setLink(false, "firebase-config.js 확인");
    caseText.textContent = "설정 파일(firebase-config.js)의 주소를 읽지 못했습니다.";
  } else {
    resumeSession();
    pollTimer = setInterval(refresh, 1200);
    document.addEventListener("visibilitychange", function(){
      if (!document.hidden) refresh();
    });
  }
})();
</script>
</body>
</html>
