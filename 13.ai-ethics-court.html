<!DOCTYPE html>
<html lang="ko">
<head>
<script charset="utf-8" src="firebase-config.js"></script>
<script charset="utf-8" src="access-guard.js" data-game="aiethicscourt"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 윤리 법정</title>
<style>
  :root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --ink:#1f2430;
    --sub:#6b7280;
    --line:#e1e6ef;
    --wood:#8b5e34;
    --wood-soft:#f2e9df;
    --agree:#1a9b64;
    --agree-soft:#e6f7ef;
    --cond:#c9860a;
    --cond-soft:#fdf3e3;
    --disagree:#e5484d;
    --disagree-soft:#fdecec;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-user-select:none;
    user-select:none;
  }
  header{
    padding:18px 28px 8px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:10px;
  }
  h1{font-size:1.6rem;margin:0;font-weight:800;letter-spacing:-0.02em;}
  .desc{color:var(--sub);font-size:0.95rem;margin-top:2px;}
  .status{display:flex;gap:14px;}
  .pill{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 18px;
    font-weight:700;
    white-space:nowrap;
  }
  .pill.count{color:var(--wood);}

  main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px 20px 30px;
  }

  #playScreen{
    width:min(880px,95vw);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:30px 34px;
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  .case-label{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:0.95rem;
    font-weight:800;
    color:var(--wood);
    background:var(--wood-soft);
    border-radius:999px;
    padding:6px 16px;
    width:fit-content;
  }
  .case-text{
    font-size:1.35rem;
    font-weight:700;
    line-height:1.55;
  }

  .verdicts{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:14px;
  }
  .verdict-btn{
    background:#fbfcfe;
    border:2px solid var(--line);
    border-radius:16px;
    padding:20px 14px;
    font-size:1.15rem;
    font-weight:800;
    text-align:center;
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease, transform .08s ease;
  }
  .verdict-btn:active{transform:scale(.97);}
  .verdict-btn.picked{border-color:var(--wood);background:var(--wood-soft);}

  .result-area{
    border-top:1px dashed var(--line);
    padding-top:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .result-title{
    font-size:1rem;
    font-weight:800;
    color:var(--sub);
  }
  .bars{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .bar-row{
    display:grid;
    grid-template-columns:110px 1fr 50px;
    align-items:center;
    gap:10px;
  }
  .bar-label{font-size:0.95rem;font-weight:700;}
  .bar-track{
    background:#f0f2f7;
    border-radius:999px;
    height:24px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    border-radius:999px;
    width:0%;
    transition:width .35s ease;
  }
  .bar-fill.agree{background:var(--agree);}
  .bar-fill.cond{background:var(--cond);}
  .bar-fill.disagree{background:var(--disagree);}
  .bar-count{font-size:0.95rem;font-weight:800;text-align:right;}

  .btnbar{
    display:flex;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .left-btns, .right-btns{display:flex;gap:10px;}
  button.primary{
    background:var(--wood);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:14px 26px;
    font-size:1.02rem;
    font-weight:800;
    cursor:pointer;
  }
  button.primary:active{transform:translateY(1px);}
  button.ghost{
    background:var(--card);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 22px;
    font-size:1.02rem;
    font-weight:700;
    cursor:pointer;
  }

  #summaryScreen{
    display:none;
    width:min(920px,95vw);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:34px;
    flex-direction:column;
    gap:22px;
  }
  #summaryScreen h2{margin:0;font-size:1.7rem;}
  .summary-case{
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 20px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .summary-case .case-text{font-size:1.05rem;}
  .summary-list{
    display:flex;
    flex-direction:column;
    gap:16px;
    max-height:55vh;
    overflow-y:auto;
    padding-right:4px;
  }

  @media (max-width:640px){
    .verdicts{grid-template-columns:1fr;}
    .bar-row{grid-template-columns:80px 1fr 40px;}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>⚖️ AI 윤리 법정</h1>
    <div class="desc">사건을 읽고 판사가 되어 판결을 내려보세요. 정답은 없어요 — 우리 반의 생각을 함께 확인해봐요.</div>
  </div>
  <div class="status">
    <div class="pill" id="progressPill">사건 1 / 6</div>
    <div class="pill count" id="totalVotesPill">총 판결 0표</div>
  </div>
</header>

<main>
  <div id="playScreen">
    <div class="case-label" id="caseLabel">사건 1</div>
    <div class="case-text" id="caseText"></div>

    <div class="verdicts" id="verdictsBox"></div>

    <div class="result-area">
      <div class="result-title">📊 우리 반 판결 분포 (실시간)</div>
      <div class="bars" id="barsBox"></div>
    </div>

    <div class="btnbar">
      <div class="left-btns">
        <button class="ghost" id="resetBtn">이 사건 초기화</button>
      </div>
      <div class="right-btns">
        <button class="ghost" id="prevBtn">← 이전 사건</button>
        <button class="primary" id="nextBtn">다음 사건 →</button>
      </div>
    </div>
  </div>

  <div id="summaryScreen">
    <h2>🏛️ 오늘의 판결 모음</h2>
    <div class="summary-list" id="summaryList"></div>
    <div class="btnbar">
      <button class="ghost" id="backBtn">← 사건으로 돌아가기</button>
      <button class="primary" id="restartBtn">전체 초기화</button>
    </div>
  </div>
</main>

<script>
const VERDICT_OPTIONS = [
  {key:'agree', label:'찬성'},
  {key:'cond', label:'조건부 찬성'},
  {key:'disagree', label:'반대'},
];

const CASES = [
  { text: "학교에서 AI가 시험 중 부정행위를 자동으로 감지해 선생님께 알려주는 시스템을 도입하려고 합니다. 이 시스템 도입에 찬성하시나요?" },
  { text: "한 회사가 채용 과정에서 지원자의 표정을 AI로 분석해 합격 여부를 결정하는 방식을 도입했습니다. 이 방식에 찬성하시나요?" },
  { text: "우리 반 친구가 AI 챗봇에게 숙제를 대신 풀게 하고 그대로 제출했습니다. 이런 행동에 찬성하시나요?" },
  { text: "공공장소의 CCTV가 AI 얼굴 인식으로 시민들의 위치를 실시간으로 추적하는 것에 찬성하시나요?" },
  { text: "AI가 작곡한 노래를 사람이 직접 만든 것처럼 속여 음원 사이트에 올리는 것에 찬성하시나요?" },
  { text: "AI 스피커가 우리 집 대화 내용을 항상 녹음해 두었다가, 나중에 다시 들려주는 기능을 넣는 것에 찬성하시나요?" },
];

let votes = CASES.map(()=> ({agree:0, cond:0, disagree:0}));
let idx = 0;

const caseLabel = document.getElementById('caseLabel');
const caseText = document.getElementById('caseText');
const verdictsBox = document.getElementById('verdictsBox');
const barsBox = document.getElementById('barsBox');
const progressPill = document.getElementById('progressPill');
const totalVotesPill = document.getElementById('totalVotesPill');
const playScreen = document.getElementById('playScreen');
const summaryScreen = document.getElementById('summaryScreen');

function init(){
  votes = CASES.map(()=> ({agree:0, cond:0, disagree:0}));
  idx = 0;
  render();
}

function render(){
  const c = CASES[idx];
  caseLabel.textContent = `사건 ${idx+1}`;
  progressPill.textContent = `사건 ${idx+1} / ${CASES.length}`;
  caseText.textContent = c.text;

  verdictsBox.innerHTML = '';
  VERDICT_OPTIONS.forEach(opt=>{
    const btn = document.createElement('div');
    btn.className = 'verdict-btn';
    btn.textContent = opt.label;
    btn.addEventListener('click', ()=>{
      votes[idx][opt.key] += 1;
      btn.classList.add('picked');
      setTimeout(()=>btn.classList.remove('picked'), 250);
      renderBars();
    });
    verdictsBox.appendChild(btn);
  });

  renderBars();

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = idx === CASES.length - 1 ? '결과 보기 →' : '다음 사건 →';

  const prevBtn = document.getElementById('prevBtn');
  prevBtn.style.visibility = idx === 0 ? 'hidden' : 'visible';
}

function renderBars(){
  const v = votes[idx];
  const total = v.agree + v.cond + v.disagree;
  totalVotesPill.textContent = `총 판결 ${total}표`;

  barsBox.innerHTML = '';
  VERDICT_OPTIONS.forEach(opt=>{
    const count = v[opt.key];
    const pct = total > 0 ? Math.round((count/total)*100) : 0;
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = `
      <div class="bar-label">${opt.label}</div>
      <div class="bar-track"><div class="bar-fill ${opt.key}" style="width:${pct}%"></div></div>
      <div class="bar-count">${count}표</div>
    `;
    barsBox.appendChild(row);
  });
}

document.getElementById('resetBtn').addEventListener('click', ()=>{
  votes[idx] = {agree:0, cond:0, disagree:0};
  renderBars();
});

document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(idx > 0){
    idx -= 1;
    render();
  }
});

document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(idx < CASES.length - 1){
    idx += 1;
    render();
  } else {
    showSummary();
  }
});

function showSummary(){
  playScreen.style.display = 'none';
  summaryScreen.style.display = 'flex';

  const list = document.getElementById('summaryList');
  list.innerHTML = '';
  CASES.forEach((c, i)=>{
    const v = votes[i];
    const total = v.agree + v.cond + v.disagree;
    const wrap = document.createElement('div');
    wrap.className = 'summary-case';

    const barsHtml = VERDICT_OPTIONS.map(opt=>{
      const count = v[opt.key];
      const pct = total > 0 ? Math.round((count/total)*100) : 0;
      return `
        <div class="bar-row">
          <div class="bar-label">${opt.label}</div>
          <div class="bar-track"><div class="bar-fill ${opt.key}" style="width:${pct}%"></div></div>
          <div class="bar-count">${count}표</div>
        </div>`;
    }).join('');

    wrap.innerHTML = `
      <div class="case-label">사건 ${i+1}</div>
      <div class="case-text">${c.text}</div>
      <div class="bars">${barsHtml}</div>
    `;
    list.appendChild(wrap);
  });
}

document.getElementById('backBtn').addEventListener('click', ()=>{
  summaryScreen.style.display = 'none';
  playScreen.style.display = 'flex';
});

document.getElementById('restartBtn').addEventListener('click', ()=>{
  summaryScreen.style.display = 'none';
  playScreen.style.display = 'flex';
  init();
});

init();
</script>
</body>
</html>
