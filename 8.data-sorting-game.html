<!DOCTYPE html>
<html lang="ko">
<head>
<script charset="utf-8" src="firebase-config.js"></script>
<script charset="utf-8" src="access-guard.js" data-game="datasorting"></script>
<meta charset="UTF-8">
<link rel="stylesheet" href="theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>자료 정렬하기</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="정보 수업용 링크 모음">
<meta property="og:title" content="자료 정렬하기">
<meta property="og:description" content="정보 수업용 링크 모음">
<meta property="og:url" content="https://cornsilktea.github.io/8.data-sorting-game.html">
<meta property="og:image" content="https://cornsilktea.github.io/icon-512.png">
<meta name="twitter:card" content="summary">
<style>
  :root{
    --bg:var(--sg-bg);
    --card:#ffffff;
    --ink:var(--sg-ink);
    --sub:var(--sg-ink-soft);
    --line:var(--sg-line-mid);
    --blue:var(--sg-primary);
    --blue-soft:var(--sg-primary-soft);
    --green:var(--sg-ok);
    --green-soft:#E1F1E5;
    --red:var(--sg-danger);
    --red-soft:#F6E3E7;
    --radius:var(--sg-radius);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--sg-font);
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    -webkit-user-select:none;
    user-select:none;
  }
  header{
    padding:18px 28px 10px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  h1{font-size:1.6rem;margin:0;font-weight:800;letter-spacing:-0.02em;}
  .desc{color:var(--sub);font-size:0.95rem;margin-top:2px;}
  .status{
    display:flex;
    gap:14px;
    align-items:center;
    font-size:1rem;
  }
  .pill{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--sg-radius);
    padding:8px 18px;
    font-weight:700;
    white-space:nowrap;
  }
  .pill.score{color:var(--blue);}
  .pill.progress{color:var(--ink);}
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:10px 24px 30px;
    gap:24px;
  }
  #trayWrap{
    width:min(1100px,94vw);
    min-height:120px;
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    justify-content:center;
    align-content:center;
    padding:16px;
  }
  .card{
    background:var(--card);
    border:2px solid var(--sg-line-strong);
    border-radius:var(--sg-radius);
    padding:18px 22px;
    font-size:1.25rem;
    font-weight:700;
    box-shadow:0 3px 0 rgba(0,0,0,0.04);
    cursor:grab;
    touch-action:none;
    display:flex;
    align-items:center;
    gap:10px;
    min-width:150px;
    justify-content:center;
    transition:transform .12s ease, box-shadow .12s ease, opacity .2s ease;
  }
  .card .emoji{font-size:1.4rem;}
  .card.dragging{
    cursor:grabbing;
    box-shadow:0 10px 24px rgba(0,0,0,0.18);
    transform:scale(1.05);
    z-index:50;
  }
  .card.placed-correct{
    border-color:var(--green);
    background:var(--green-soft);
  }
  .card.placed-wrong{
    border-color:var(--red);
    background:var(--red-soft);
  }
  .card.fading{opacity:0;transform:scale(.85);}

  #bins{
    width:min(1100px,94vw);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
  }
  .bin{
    background:var(--card);
    border:3px dashed var(--sg-line-mid);
    border-radius:var(--radius);
    min-height:220px;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:12px;
    transition:border-color .15s ease, background .15s ease;
  }
  .bin.hover{border-color:var(--blue);background:var(--blue-soft);}
  .bin-title{
    font-size:1.2rem;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .bin-hint{font-size:0.9rem;color:var(--sub);margin-top:-6px;}
  .bin-body{
    flex:1;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-content:flex-start;
  }

  #feedback{
    min-height:34px;
    font-size:1.15rem;
    font-weight:700;
  }
  #feedback.ok{color:var(--green);}
  #feedback.no{color:var(--red);}

  .btnbar{
    display:flex;
    gap:12px;
  }
  button.primary{
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:var(--sg-radius);
    padding:16px 30px;
    font-size:1.1rem;
    font-weight:800;
    cursor:pointer;
  }
  button.primary:active{transform:translateY(1px);}


  #endScreen{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:18px;
    text-align:center;
  }
  #endScreen h2{font-size:2rem;margin:0;}
  #endScreen .bigscore{font-size:3.2rem;font-weight:900;color:var(--blue);}


  @media (max-width:720px){
    #bins{grid-template-columns:1fr;}
    h1{font-size:1.3rem;}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>🗂️ 데이터 분류 놀이터</h1>
    <div class="desc">카드를 손가락(또는 마우스)으로 끌어서 알맞은 바구니에 넣어보세요.</div>
  </div>
  <div class="status">
    <div class="pill progress" id="progressPill">0 / 16</div>
    <div class="pill score" id="scorePill">점수 0</div>
  </div>
</header>

<main>
  <div id="playScreen">
    <div id="trayWrap"></div>

    <div id="bins">
      <div class="bin" data-type="structured" id="binStructured">
        <div class="bin-title">📊 정형 데이터</div>
        <div class="bin-hint">정해진 형식(표, 항목)으로 딱 떨어지게 정리되는 데이터</div>
        <div class="bin-body"></div>
      </div>
      <div class="bin" data-type="unstructured" id="binUnstructured">
        <div class="bin-title">🎨 비정형 데이터</div>
        <div class="bin-hint">형식이 정해져 있지 않은, 자유로운 형태의 데이터</div>
        <div class="bin-body"></div>
      </div>
    </div>

    <div id="feedback"></div>
  </div>

  <div id="endScreen">
    <h2>결과 발표! 🎉</h2>
    <div class="bigscore" id="finalScore">0 / 16</div>
    <div id="finalComment" style="font-size:1.1rem;color:var(--sub);"></div>
    <div class="btnbar">
      <button class="primary" id="retryBtn">다시 하기</button>
    </div>
  </div>
</main>

<script>
const ITEMS = [
  {label:"학번", emoji:"🔢", type:"structured"},
  {label:"키(cm)", emoji:"📏", type:"structured"},
  {label:"몸무게(kg)", emoji:"⚖️", type:"structured"},
  {label:"시험 점수", emoji:"💯", type:"structured"},
  {label:"전화번호", emoji:"📱", type:"structured"},
  {label:"출석부", emoji:"📋", type:"structured"},
  {label:"좌석 번호", emoji:"🪑", type:"structured"},
  {label:"엑셀 성적표", emoji:"📈", type:"structured"},
  {label:"일기", emoji:"📔", type:"unstructured"},
  {label:"여행 사진", emoji:"🖼️", type:"unstructured"},
  {label:"좋아하는 노래", emoji:"🎵", type:"unstructured"},
  {label:"미술 작품", emoji:"🖌️", type:"unstructured"},
  {label:"친구와의 대화 메시지", emoji:"💬", type:"unstructured"},
  {label:"동영상", emoji:"🎬", type:"unstructured"},
  {label:"손 편지", emoji:"✉️", type:"unstructured"},
  {label:"음성 메모", emoji:"🎙️", type:"unstructured"},
];
const TOTAL = ITEMS.length;
const TRAY_SIZE = 4;

let queue = [];
let score = 0;
let activeCard = null;
let activePointerId = null;
let dragOffsetX = 0, dragOffsetY = 0;
let activeItem = null;
let nextSpawnIndex = 0;
let resolvedCount = 0;

const trayWrap = document.getElementById('trayWrap');
const scorePill = document.getElementById('scorePill');
const progressPill = document.getElementById('progressPill');
const feedback = document.getElementById('feedback');
const playScreen = document.getElementById('playScreen');
const endScreen = document.getElementById('endScreen');
const bins = [document.getElementById('binStructured'), document.getElementById('binUnstructured')];
const binBodies = bins.map(bin => bin.querySelector('.bin-body'));

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function typeName(type){
  return type==='structured' ? '정형' : '비정형';
}

function init(){
  queue = shuffle(ITEMS);
  score = 0;
  resolvedCount = 0;
  updateStatus();
  binBodies.forEach(body => { body.innerHTML = ''; });
  playScreen.style.display = 'flex';
  playScreen.style.flexDirection = 'column';
  playScreen.style.alignItems = 'center';
  playScreen.style.gap = '24px';
  endScreen.style.display = 'none';
  feedback.textContent = '';
  feedback.className = '';
  spawnFirstCards();
}

function updateStatus(){
  progressPill.textContent = `${resolvedCount} / ${TOTAL}`;
  scorePill.textContent = `점수 ${score}`;
}

function spawnFirstCards(){
  trayWrap.innerHTML = '';
  nextSpawnIndex = Math.min(TRAY_SIZE, TOTAL);
  for(let i=0;i<nextSpawnIndex;i++){
    addCardToTray(queue[i]);
  }
}

function addCardToTray(item){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<span class="emoji">${item.emoji}</span><span>${item.label}</span>`;
  card.dataset.type = item.type;
  card.addEventListener('pointerdown', (e)=>startDrag(e, card, item));
  trayWrap.appendChild(card);
}

function startDrag(e, card, item){
  if(activeCard) return;
  e.preventDefault();
  activeCard = card;
  activeItem = item;
  activePointerId = e.pointerId;
  const rect = card.getBoundingClientRect();
  dragOffsetX = e.clientX - rect.left;
  dragOffsetY = e.clientY - rect.top;
  card.classList.add('dragging');
  card.style.position = 'fixed';
  card.style.left = rect.left + 'px';
  card.style.top = rect.top + 'px';
  card.style.width = rect.width + 'px';
  document.body.appendChild(card);
}

function releaseDrag(e){
  if(!activeCard || e.pointerId !== activePointerId) return null;
  const released = {card: activeCard, item: activeItem};
  activeCard = null;
  activeItem = null;
  activePointerId = null;
  return released;
}

window.addEventListener('pointermove', (e)=>{
  if(!activeCard || e.pointerId !== activePointerId) return;
  activeCard.style.left = (e.clientX - dragOffsetX) + 'px';
  activeCard.style.top = (e.clientY - dragOffsetY) + 'px';
  bins.forEach(bin => bin.classList.toggle('hover', isInside(bin, e.clientX, e.clientY)));
});

window.addEventListener('pointerup', (e)=>{
  const released = releaseDrag(e);
  if(released) handleDrop(released.card, released.item, e.clientX, e.clientY);
});

window.addEventListener('pointercancel', (e)=>{
  const released = releaseDrag(e);
  if(!released) return;
  clearHover();
  returnToTray(released.card);
});

function isInside(el, x, y){
  const r = el.getBoundingClientRect();
  return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom;
}

function clearHover(){
  bins.forEach(bin => bin.classList.remove('hover'));
}

function clearDragStyle(card){
  card.style.position = 'static';
  card.style.left = '';
  card.style.top = '';
  card.style.width = '';
  card.classList.remove('dragging');
}

function handleDrop(card, item, x, y){
  clearHover();
  let targetIndex = -1;
  bins.forEach((bin, i)=>{ if(isInside(bin, x, y)) targetIndex = i; });

  if(targetIndex < 0){
    returnToTray(card);
    return;
  }

  const correct = bins[targetIndex].dataset.type === item.type;
  clearDragStyle(card);
  binBodies[targetIndex].appendChild(card);

  if(correct){
    card.classList.add('placed-correct');
    score += 1;
    showFeedback(true, `${item.label} 정답! ${typeName(item.type)} 데이터가 맞아요.`);
  } else {
    card.classList.add('placed-wrong');
    showFeedback(false, `${item.label}은(는) 사실 ${typeName(item.type)} 데이터예요.`);
  }

  resolvedCount += 1;
  updateStatus();

  setTimeout(()=>{
    card.classList.add('fading');
    setTimeout(()=>{
      card.remove();
      fillTray();
    }, 250);
  }, 700);
}

function fillTray(){
  if(nextSpawnIndex < TOTAL){
    addCardToTray(queue[nextSpawnIndex]);
    nextSpawnIndex += 1;
  }
  if(resolvedCount >= TOTAL){
    setTimeout(showEnd, 400);
  }
}

function returnToTray(card){
  clearDragStyle(card);
  trayWrap.appendChild(card);
}

function showFeedback(ok, text){
  feedback.textContent = (ok ? '✅ ' : '❌ ') + text;
  feedback.className = ok ? 'ok' : 'no';
}

function endComment(ratio){
  if(ratio === 1) return '완벽해요! 정형·비정형 데이터를 정확히 구분하네요.';
  if(ratio >= 0.75) return '아주 잘했어요! 조금만 더 연습하면 완벽!';
  if(ratio >= 0.5) return '절반 이상 맞혔어요. 헷갈렸던 카드를 다시 떠올려볼까요?';
  return '정형 데이터는 "표로 정리하기 쉬운 것", 비정형은 "자유로운 형태"라는 점을 기억해보세요!';
}

function showEnd(){
  playScreen.style.display = 'none';
  endScreen.style.display = 'flex';
  document.getElementById('finalScore').textContent = `${score} / ${TOTAL}`;
  document.getElementById('finalComment').textContent = endComment(score/TOTAL);
}

document.getElementById('retryBtn').addEventListener('click', init);

init();
</script>
</body>
</html>
