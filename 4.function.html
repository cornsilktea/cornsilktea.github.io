<!DOCTYPE html>
<html lang="ko">
<head>
<script charset="utf-8" src="firebase-config.js"></script>
<script charset="utf-8" src="access-guard.js" data-game="function"></script>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>코딩 미로</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="정보 수업용 링크 모음">
<meta property="og:title" content="코딩 미로">
<meta property="og:description" content="정보 수업용 링크 모음">
<meta property="og:url" content="https://cornsilktea.github.io/4.function.html">
<meta property="og:image" content="https://cornsilktea.github.io/icon-512.png">
<meta name="twitter:card" content="summary">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--sg-bg);color:var(--sg-ink);
 font-family:var(--sg-font);}
header{background:#fff;border-bottom:1px solid var(--sg-line-mid);padding:10px 16px;}
h1{font-size:18px;margin:0 0 8px;}
#stagebar{display:flex;flex-wrap:wrap;gap:6px;}
#stagebar button{width:40px;height:34px;border:1px solid var(--sg-line-mid);background:#fff;
 border-radius:var(--sg-radius);font-size:14px;font-weight:600;cursor:pointer;color:var(--sg-ink-soft);}
#stagebar button.on{background:var(--sg-primary);border-color:var(--sg-primary);color:#fff;}
#stagebar button.clear{border-color:var(--sg-ok);color:var(--sg-ok);}
#stagebar button.on.clear{background:var(--sg-ok);border-color:var(--sg-ok);color:#fff;}
main{display:flex;gap:14px;padding:14px;align-items:flex-start;flex-wrap:wrap;}
.panel{background:#fff;border:1px solid var(--sg-line-mid);border-radius:var(--sg-radius);padding:12px;}
#left{flex:1 1 420px;min-width:340px;}
#right{flex:1 1 340px;min-width:300px;}
#title{font-size:16px;font-weight:700;margin-bottom:4px;}
#hint{font-size:13px;color:var(--sg-ink-soft);line-height:1.5;margin-bottom:10px;}
canvas{display:block;background:var(--sg-panel);border:2px solid var(--sg-line-strong);border-radius:var(--sg-radius);margin:0 auto;}
#msg{margin-top:10px;font-size:14px;min-height:22px;line-height:1.5;font-weight:600;}
.ok{color:var(--sg-ok)}.bad{color:var(--sg-danger)}.warn{color:var(--sg-warn)}
#counter{font-size:13px;color:var(--sg-ink-soft);margin-bottom:8px;}
#counter b{color:var(--sg-ink);font-size:15px;}
.tabs{display:flex;gap:6px;margin-bottom:8px;}
.tabs button{flex:1;padding:7px;border:1px solid var(--sg-line-mid);background:#fff;border-radius:var(--sg-radius);
 font-size:13px;font-weight:600;cursor:pointer;color:var(--sg-ink-soft);}
.tabs button.on{background:var(--sg-primary-soft);border-color:var(--sg-primary);color:var(--sg-primary);}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.pal button{padding:8px 11px;border:1px solid var(--sg-line-mid);background:#fff;border-radius:var(--sg-radius);
 font-size:13px;font-weight:600;cursor:pointer;}
.pal button:hover{background:var(--sg-bg);}
.pal .go{border-color:var(--sg-primary);color:var(--sg-primary);}
.pal .turn{border-color:#7c3aed;color:#7c3aed;}
.pal .rep{border-color:var(--sg-warn);color:var(--sg-warn);}
.pal .fn{border-color:#0d9488;color:#0d9488;}
.pal input{width:52px;padding:6px;border:1px solid var(--sg-line-mid);border-radius:var(--sg-radius);text-align:right;}
#code,#fcode{border:1px solid var(--sg-line-mid);border-radius:var(--sg-radius);padding:8px;min-height:120px;
 max-height:300px;overflow:auto;background:var(--sg-panel);}
.list{padding-left:0;}
.list.active{outline:2px dashed var(--sg-primary);outline-offset:2px;border-radius:var(--sg-radius);min-height:22px;}
.blk{border:1px solid var(--sg-line-mid);border-radius:var(--sg-radius);padding:5px 8px;margin:3px 0;font-size:13px;
 background:#fff;font-weight:600;}
.b-M{border-left:4px solid var(--sg-primary);}
.b-L,.b-R{border-left:4px solid #7c3aed;}
.b-CALL{border-left:4px solid #0d9488;}
.b-REP{border-left:4px solid var(--sg-warn);padding:5px 6px;}
.rep-head,.rep-foot{font-size:13px;font-weight:700;color:var(--sg-warn);}
.rep-body{margin:4px 0 4px 14px;border-left:2px dotted #d9b382;padding-left:8px;min-height:20px;}
.empty{color:var(--sg-ink-faint);font-size:12px;font-weight:500;padding:4px;}
#runbar{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap;}
#runbar button{padding:9px 14px;border-radius:var(--sg-radius);font-size:14px;font-weight:700;cursor:pointer;
 border:1.5px solid var(--sg-line-strong);background:#fff;}
#runbar button#run{background:var(--sg-primary);border-color:var(--sg-primary);color:#fff;}
#runbar select{padding:7px;border:1px solid var(--sg-line-mid);border-radius:var(--sg-radius);}
.note{font-size:12px;color:var(--sg-ink-soft);margin-top:8px;line-height:1.5;}
</style>
</head>
<body>
<header>
  <h1>코딩 미로</h1>
  <div id="stagebar"></div>
</header>
<main>
  <section id="left" class="panel">
    <div id="title"></div>
    <div id="hint"></div>
    <div id="record" class="note"></div>
    <canvas id="cv" width="520" height="420"></canvas>
    <div id="msg"></div>
  </section>
  <section id="right" class="panel">
    <div id="counter"></div>
    <div class="tabs" id="tabs">
      <button id="tabMain" class="on">메인 프로그램</button>
      <button id="tabFunc">나만의 블록</button>
    </div>
    <div class="pal">
      <button class="go" data-t="M">앞으로 가기</button>
      <button class="turn" data-t="L">왼쪽 돌기</button>
      <button class="turn" data-t="R">오른쪽 돌기</button>
      <input id="repN" type="number" min="2" max="20" value="3">
      <button class="rep" data-t="REP">번 반복</button>
      <button class="rep" id="endrep">반복 끝내기</button>
      <button class="fn" id="callbtn" data-t="CALL">나만의 블록 넣기</button>
    </div>
    <div id="code"></div>
    <div id="fwrap" style="margin-top:10px;">
      <div style="font-size:13px;font-weight:700;color:#0d9488;margin-bottom:4px;">나만의 블록 만들기</div>
      <div id="fcode"></div>
    </div>
    <div id="runbar">
      <button id="run">실행하기</button>
      <button id="undo">되돌리기</button>
      <button id="clear">전체 지우기</button>
      <select id="speed">
        <option value="320">느리게</option>
        <option value="170" selected>보통</option>
        <option value="70">빠르게</option>
      </select>
    </div>
    <div class="note">블록을 반복 안에 넣으려면 먼저 반복 블록을 만드세요. 새 블록은 점선으로 표시된 곳에 들어갑니다.</div>
  </section>
</main>
<script>
(function(){
var STAGES = [{"name": "1단계 · 첫 걸음", "hint": "앞으로 가기 버튼만 눌러 도착 깃발까지 가 보세요.", "grid": ["#########", "#S.....G#", "#########"], "dir": "E", "limit": 8, "best": 6, "func": false}, {"name": "2단계 · 블록이 모자라요", "hint": "앞으로 15칸! 그런데 블록은 5개뿐입니다. 반복 블록을 써 보세요.", "grid": ["##################", "#S..............G#", "##################"], "dir": "E", "limit": 5, "best": 2, "func": false}, {"name": "3단계 · 모퉁이 돌기", "hint": "직진 구간마다 반복 블록으로 묶어 보세요.", "grid": ["##########", "#S.......#", "########.#", "########.#", "########.#", "########.#", "########G#", "##########"], "dir": "E", "limit": 7, "best": 5, "func": false}, {"name": "4단계 · 계단 오르기", "hint": "앞으로-왼쪽-앞으로-오른쪽. 이 네 개가 계속 되풀이됩니다.", "grid": ["########", "######G#", "#####..#", "####..##", "###..###", "##..####", "#S.#####", "########"], "dir": "E", "limit": 7, "best": 5, "func": false}, {"name": "5단계 · 반복 속의 반복", "hint": "반복 블록 안에 반복 블록을 넣을 수 있어요.", "grid": ["###############", "#############G#", "#############.#", "###########...#", "###########.###", "#########...###", "#########.#####", "#######...#####", "#######.#######", "#####...#######", "#####.#########", "###...#########", "###.###########", "#S..###########", "###############"], "dir": "E", "limit": 8, "best": 7, "func": false}, {"name": "6단계 · 별을 모두 모아라", "hint": "별을 하나도 빠짐없이 지나간 뒤 도착해야 성공입니다.", "grid": ["########", "#S.*...#", "#G####.#", "#.####*#", "#*####.#", "#.####.#", "#...*..#", "########"], "dir": "E", "limit": 7, "best": 6, "func": false}, {"name": "7단계 · 똑같은 동작에 이름 붙이기", "hint": "같은 계단 동작이 네 번 나오는데 사이 간격이 제각각입니다. 나만의 블록을 만들어 보세요.", "grid": ["#############", "###########G#", "#######.....#", "#####...#####", "##....#######", "#S.##########", "#############"], "dir": "E", "limit": 15, "best": 13, "func": true}, {"name": "8단계 · 블록 속의 블록", "hint": "나만의 블록 안에도 반복 블록을 넣을 수 있어요.", "grid": ["#############", "###########G#", "###########.#", "######......#", "######.######", "###....######", "###.#########", "#S..#########", "#############"], "dir": "E", "limit": 14, "best": 12, "func": true}, {"name": "9단계 · 밭갈이", "hint": "좌우로 왔다 갔다 하는 큰 규칙 하나가 숨어 있습니다.", "grid": ["########", "#S.....#", "######.#", "#....*.#", "#.######", "#......#", "######.#", "#.....*#", "#.######", "#.....*#", "######.#", "#......#", "#.######", "#G######", "########"], "dir": "E", "limit": 14, "best": 13, "func": false}, {"name": "10단계 · 마지막 관문", "hint": "반복 블록과 나만의 블록을 함께 써야 통과할 수 있습니다.", "grid": ["##############", "############G#", "############.#", "######*....*.#", "######.#######", "###*...#######", "###.##########", "#S..##########", "##############"], "dir": "E", "limit": 13, "best": 12, "func": true}];
var DIRS={E:[0,1],S:[1,0],W:[0,-1],N:[-1,0]};
var RIGHT={E:'S',S:'W',W:'N',N:'E'};
var LEFT={E:'N',N:'W',W:'S',S:'E'};
var LABEL={M:'앞으로 가기',L:'왼쪽 돌기',R:'오른쪽 돌기',CALL:'나만의 블록'};
var CLEARED_KEY='rmz10';
var FONT_FAMILY='"Nanum Gothic", "Malgun Gothic", sans-serif';

function byId(id){ return document.getElementById(id); }
var ui={
  stagebar:byId('stagebar'), title:byId('title'), hint:byId('hint'), record:byId('record'),
  msg:byId('msg'), counter:byId('counter'), tabs:byId('tabs'), tabMain:byId('tabMain'), tabFunc:byId('tabFunc'),
  repN:byId('repN'), callbtn:byId('callbtn'), code:byId('code'), fwrap:byId('fwrap'), fcode:byId('fcode'), speed:byId('speed')
};

var idx=0, st=null, grid=[], startPos=null, goalPos=null, stars=[];
var robot={r:0,c:0,d:'E'}, got={}, running=false;
var prog={main:[],func:[]}, target='main', cursor=[];
var cv=byId('cv'), cx=cv.getContext('2d');

function cleared(){
  try{ return JSON.parse(localStorage.getItem(CLEARED_KEY)||'{}'); }catch(e){ return {}; }
}
function markClear(i,used){
  var c=cleared();
  if(!c[i] || used<c[i]) c[i]=used;
  try{ localStorage.setItem(CLEARED_KEY, JSON.stringify(c)); }catch(e){}
}
function renderRecord(){
  var mine=cleared()[idx];
  ui.record.textContent = mine
    ? '역대 최고 기록: 블록 ' + mine + '개 (최소 ' + st.best + '개)'
    : '역대 최고 기록: 아직 없음 (최소 ' + st.best + '개로 통과할 수 있어요)';
}

function buildBar(){
  ui.stagebar.innerHTML='';
  var c=cleared();
  STAGES.forEach(function(stage,i){
    var b=document.createElement('button');
    b.textContent=(i+1);
    if(i===idx) b.className='on';
    if(c[i]) b.className+=' clear';
    b.onclick=function(){ load(i); };
    ui.stagebar.appendChild(b);
  });
}

function load(i){
  idx=i; st=STAGES[i];
  grid=st.grid.map(function(r){ return r.split(''); });
  stars=[];
  for(var r=0;r<grid.length;r++){
    for(var c=0;c<grid[r].length;c++){
      if(grid[r][c]==='S') startPos={r:r,c:c};
      if(grid[r][c]==='G') goalPos={r:r,c:c};
      if(grid[r][c]==='*') stars.push({r:r,c:c,key:r+','+c});
    }
  }
  prog={main:[],func:[]}; target='main'; cursor=[];
  ui.title.textContent=st.name;
  ui.hint.textContent=st.hint;
  ui.tabs.style.display = st.func?'flex':'none';
  ui.fwrap.style.display = st.func?'block':'none';
  ui.callbtn.style.display = st.func?'inline-block':'none';
  setMsg('','');
  renderRecord();
  resetRobot(); buildBar(); render();
}

function resetRobot(){
  robot={r:startPos.r,c:startPos.c,d:st.dir}; got={};
}
function setMsg(t,cls){
  ui.msg.textContent=t; ui.msg.className=cls||'';
}
function collectedCount(){ return Object.keys(got).length; }

function draw(){
  var H=grid.length, W=grid[0].length;
  var cell=Math.max(18, Math.floor(Math.min(500/W, 400/H)));
  if(cv.width!==W*cell) cv.width=W*cell;
  if(cv.height!==H*cell) cv.height=H*cell;
  for(var r=0;r<H;r++){
    for(var c=0;c<W;c++){
      var wall=grid[r][c]==='#';
      cx.fillStyle=wall?'#5B6B5E':'#ffffff';
      cx.fillRect(c*cell,r*cell,cell,cell);
      cx.strokeStyle=wall?'#5B6B5E':'#E4E8DE';
      cx.strokeRect(c*cell+0.5,r*cell+0.5,cell-1,cell-1);
    }
  }
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.font='bold '+Math.floor(cell*0.62)+'px '+FONT_FAMILY;
  stars.forEach(function(s){
    cx.fillStyle = got[s.key] ? '#C9D2C3' : '#f59e0b';
    cx.fillText('★', s.c*cell+cell/2, s.r*cell+cell/2+1);
  });
  cx.fillStyle='#2F7D4F';
  cx.fillRect(goalPos.c*cell+cell*0.2, goalPos.r*cell+cell*0.2, cell*0.6, cell*0.6);
  cx.fillStyle='#fff'; cx.font='bold '+Math.floor(cell*0.4)+'px '+FONT_FAMILY;
  cx.fillText('G', goalPos.c*cell+cell/2, goalPos.r*cell+cell/2+1);
  var x=robot.c*cell+cell/2, y=robot.r*cell+cell/2;
  cx.fillStyle='#B33951';
  cx.beginPath();
  cx.arc(x,y,cell*0.32,0,Math.PI*2);
  cx.fill();
  var d=DIRS[robot.d];
  cx.fillStyle='#fbbf24';
  cx.beginPath();
  cx.arc(x+d[1]*cell*0.2, y+d[0]*cell*0.2, cell*0.11, 0, Math.PI*2);
  cx.fill();
}

function root(){ return target==='main'?prog.main:prog.func; }
function container(){
  var a=root();
  for(var i=0;i<cursor.length;i++){ a=a[cursor[i]].body; }
  return a;
}
function countList(list){
  var n=0;
  for(var i=0;i<list.length;i++){
    n++;
    if(list[i].t==='REP') n+=countList(list[i].body);
  }
  return n;
}
function total(){ return countList(prog.main)+countList(prog.func); }

function addBlock(t){
  if(running) return;
  if(t==='CALL' && target==='func'){
    setMsg('나만의 블록 안에는 자기 자신을 넣을 수 없어요.','bad'); return;
  }
  if(total()>=st.limit){
    setMsg('블록을 '+st.limit+'개까지만 쓸 수 있어요. 더 짧게 만들 방법이 있을까요?','warn');
    return;
  }
  var c=container();
  if(t==='REP'){
    var n=parseInt(ui.repN.value,10);
    if(!(n>=2)) n=2;
    if(n>20) n=20;
    c.push({t:'REP',n:n,body:[]});
    cursor=cursor.concat([c.length-1]);
  } else {
    c.push({t:t});
  }
  setMsg('','');
  render();
}
function endRep(){
  if(cursor.length>0){ cursor=cursor.slice(0,-1); render(); }
}
function undo(){
  if(running) return;
  var c=container();
  if(c.length>0){ c.pop(); }
  else if(cursor.length>0){
    cursor=cursor.slice(0,-1);
    container().pop();
  }
  setMsg('','');
  render();
}
function clearAll(){
  if(running) return;
  if(target==='main'){ prog.main=[]; } else { prog.func=[]; }
  cursor=[]; setMsg('','');
  render();
}

function renderList(list, path, wrap){
  var isCursorHere = path.join(',')===cursor.join(',') && wrap.dataset.target===target;
  wrap.className = isCursorHere ? 'list active' : 'list';
  if(list.length===0){
    var e=document.createElement('div');
    e.className='empty'; e.textContent='(블록을 추가해 보세요)';
    wrap.appendChild(e);
  }
  for(var i=0;i<list.length;i++){
    var n=list[i];
    var el=document.createElement('div');
    el.className='blk b-'+n.t;
    if(n.t==='REP'){
      var head=document.createElement('div');
      head.className='rep-head'; head.textContent=n.n+'번 반복';
      el.appendChild(head);
      var body=document.createElement('div');
      body.className='rep-body';
      var inner=document.createElement('div');
      inner.dataset.target=wrap.dataset.target;
      renderList(n.body, path.concat([i]), inner);
      body.appendChild(inner);
      el.appendChild(body);
      var foot=document.createElement('div');
      foot.className='rep-foot'; foot.textContent='반복 끝';
      el.appendChild(foot);
    } else {
      el.textContent=LABEL[n.t];
    }
    wrap.appendChild(el);
  }
}

function renderProgram(host, list, name){
  host.innerHTML='';
  var wrap=document.createElement('div');
  wrap.dataset.target=name;
  renderList(list, [], wrap);
  host.appendChild(wrap);
}

function render(){
  draw();
  ui.tabMain.className = (target==='main')?'on':'';
  ui.tabFunc.className = (target==='func')?'on':'';
  renderProgram(ui.code, prog.main, 'main');
  if(st.func) renderProgram(ui.fcode, prog.func, 'func');
  var starTxt = stars.length? ' · 별 '+collectedCount()+'/'+stars.length : '';
  ui.counter.innerHTML = '사용한 블록 <b>'+total()+'</b> / 최대 '+st.limit+'개'+starTxt;
}

function expandList(list, out){
  for(var i=0;i<list.length;i++){
    if(out.length>4000) return;
    var n=list[i];
    if(n.t==='M'||n.t==='L'||n.t==='R'){ out.push(n.t); }
    else if(n.t==='REP'){
      for(var k=0;k<n.n;k++){ expandList(n.body,out); }
    }
    else if(n.t==='CALL'){ expandList(prog.func,out); }
  }
}

function run(){
  if(running) return;
  if(prog.main.length===0){ setMsg('먼저 블록을 놓아 주세요.','warn'); return; }
  var commands=[]; expandList(prog.main, commands);
  var used=total();
  resetRobot(); render();
  running=true; setMsg('로봇이 움직입니다...','');
  var i=0;
  var timer=setInterval(function(){
    if(i>=commands.length){
      clearInterval(timer); running=false; finish(used); return;
    }
    var cmd=commands[i++];
    if(cmd==='L'){ robot.d=LEFT[robot.d]; }
    else if(cmd==='R'){ robot.d=RIGHT[robot.d]; }
    else {
      var d=DIRS[robot.d], nr=robot.r+d[0], nc=robot.c+d[1];
      if(nr<0||nr>=grid.length||nc<0||nc>=grid[0].length||grid[nr][nc]==='#'){
        clearInterval(timer); running=false;
        render();
        setMsg('벽에 부딪혔어요. 어느 명령에서 잘못됐는지 찾아볼까요?','bad');
        return;
      }
      robot.r=nr; robot.c=nc;
      if(grid[nr][nc]==='*') got[nr+','+nc]=true;
    }
    render();
  }, parseInt(ui.speed.value,10));
}

function finish(used){
  var atGoal = (robot.r===goalPos.r && robot.c===goalPos.c);
  var allGot = (collectedCount()===stars.length);
  if(atGoal && allGot){
    markClear(idx, used); buildBar(); renderRecord();
    if(used>st.best){
      setMsg('성공! 그런데 블록 '+st.best+'개로도 갈 수 있어요. 더 줄여 볼까요?','ok');
    } else {
      setMsg('완벽합니다! 최소 블록 '+st.best+'개로 통과했어요.','ok');
    }
  } else if(atGoal){
    setMsg('도착은 했지만 별을 다 모으지 못했어요. 별을 모두 지나가야 합니다.','bad');
  } else {
    setMsg('도착 깃발까지 가지 못했어요. 명령을 다시 살펴보세요.','bad');
  }
}

function selectTarget(name){ target=name; cursor=[]; render(); }

Array.prototype.forEach.call(document.querySelectorAll('.pal button[data-t]'),function(b){
  b.onclick=function(){ addBlock(b.dataset.t); };
});
byId('endrep').onclick=endRep;
byId('undo').onclick=undo;
byId('clear').onclick=clearAll;
byId('run').onclick=run;
ui.tabMain.onclick=function(){ selectTarget('main'); };
ui.tabFunc.onclick=function(){ selectTarget('func'); };
load(0);
})();
</script>
</body>
</html>
