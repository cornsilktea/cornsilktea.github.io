<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>표 읽고 답 찾기</title>
<style>
  :root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --ink:#1f2430;
    --sub:#6b7280;
    --line:#e1e6ef;
    --green:#1a9b64;
    --green-soft:#e6f7ef;
    --red:#e5484d;
    --red-soft:#fdecec;
    --amber:#c9860a;
    --amber-soft:#fdf3e3;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-user-select:none;
    user-select:none;
  }
  header{
    padding:18px 28px 8px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:10px;
  }
  h1{font-size:1.6rem;margin:0;font-weight:800;letter-spacing:-0.02em;}
  .desc{color:var(--sub);font-size:0.95rem;margin-top:2px;}
  .status{display:flex;gap:14px;}
  .pill{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 18px;
    font-weight:700;
    white-space:nowrap;
  }
  .pill.score{color:var(--amber);}

  main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px 20px 30px;
  }

  #playScreen{
    width:min(880px,95vw);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    padding:26px 30px 30px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .table-title{
    font-size:1.15rem;
    font-weight:800;
  }
  .table-wrap{
    overflow-x:auto;
  }
  table.data{
    border-collapse:collapse;
    width:100%;
    min-width:420px;
    font-size:1.05rem;
  }
  table.data th, table.data td{
    border:1px solid var(--line);
    padding:12px 14px;
    text-align:center;
  }
  table.data thead th{
    background:#eef1f8;
    font-weight:800;
    color:var(--ink);
  }
  table.data tbody th{
    background:#f7f8fb;
    font-weight:800;
    text-align:left;
  }
  table.data tbody tr:nth-child(even) td{
    background:#fbfcfe;
  }

  .question{
    font-size:1.3rem;
    font-weight:800;
    margin-top:4px;
  }
  .options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .opt{
    background:#fbfcfe;
    border:2px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
    font-size:1.1rem;
    font-weight:700;
    cursor:pointer;
    text-align:center;
    transition:border-color .12s ease, background .12s ease, transform .08s ease;
  }
  .opt:active{transform:scale(.98);}
  .opt.correct{border-color:var(--green);background:var(--green-soft);color:var(--green);}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red);}
  .opt.disabled{cursor:default;}

  #feedback{
    min-height:30px;
    font-size:1.05rem;
    font-weight:700;
  }
  #feedback.ok{color:var(--green);}
  #feedback.no{color:var(--red);}

  .btnbar{display:flex;justify-content:flex-end;}
  button.primary{
    background:var(--amber);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:15px 28px;
    font-size:1.05rem;
    font-weight:800;
    cursor:pointer;
    visibility:hidden;
  }
  button.primary.show{visibility:visible;}
  button.primary:active{transform:translateY(1px);}

  #endScreen{
    display:none;
    width:min(700px,95vw);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    padding:40px;
    flex-direction:column;
    align-items:center;
    gap:16px;
    text-align:center;
  }
  #endScreen h2{margin:0;font-size:2rem;}
  #endScreen .bigscore{font-size:3.2rem;font-weight:900;color:var(--amber);}
  button.secondary{
    background:var(--card);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 30px;
    font-size:1.1rem;
    font-weight:800;
    cursor:pointer;
  }

  @media (max-width:600px){
    .options{grid-template-columns:1fr;}
    h1{font-size:1.3rem;}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>📋 표 읽고 답 찾기</h1>
    <div class="desc">표를 잘 살펴보고, 알맞은 답을 골라보세요.</div>
  </div>
  <div class="status">
    <div class="pill" id="progressPill">1 / 6</div>
    <div class="pill score" id="scorePill">점수 0</div>
  </div>
</header>

<main>
  <div id="playScreen">
    <div class="table-title" id="tableTitle"></div>
    <div class="table-wrap" id="tableBox"></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsBox"></div>
    <div id="feedback"></div>
    <div class="btnbar">
      <button class="primary" id="nextBtn">다음 문제 →</button>
    </div>
  </div>

  <div id="endScreen">
    <h2>결과 발표! 📋</h2>
    <div class="bigscore" id="finalScore">0 / 6</div>
    <div id="finalComment" style="font-size:1.1rem;color:var(--sub);"></div>
    <button class="secondary" id="retryBtn">다시 하기</button>
  </div>
</main>

<script>
const ROUNDS = [
  {
    title:'요일별 급식 메뉴와 만족도 조사',
    headers:['요일','메뉴','만족도(점)'],
    rowHeaderCol:0,
    rows:[
      ['월','김치볶음밥','7'],
      ['화','돈가스','9'],
      ['수','비빔밥','6'],
      ['목','떡볶이','8'],
      ['금','짜장면','9'],
    ],
    question:'만족도 점수가 가장 낮은 요일은?',
    options:['월요일','수요일','목요일','금요일'],
    correct:'수요일',
    explain:'수요일 비빔밥이 6점으로 가장 낮아요.'
  },
  {
    title:'체육대회 반별 종목 순위 (1등이 가장 높은 점수)',
    headers:['반','줄다리기','이어달리기','피구'],
    rowHeaderCol:0,
    rows:[
      ['1반','2','4','3'],
      ['2반','4','1','2'],
      ['3반','1','3','4'],
      ['4반','3','2','1'],
    ],
    question:'피구에서 가장 높은 순위(1등)를 받은 반은?',
    options:['1반','2반','3반','4반'],
    correct:'4반',
    explain:'피구 열에서 4반이 1을 기록해 1등이에요.'
  },
  {
    title:'학생별 과목 점수표',
    headers:['이름','국어','영어','수학'],
    rowHeaderCol:0,
    rows:[
      ['민준','85','78','92'],
      ['서연','90','88','76'],
      ['도윤','72','95','80'],
      ['하은','88','82','85'],
    ],
    question:'수학 점수가 가장 높은 학생은?',
    options:['민준','서연','도윤','하은'],
    correct:'민준',
    explain:'민준이의 수학 점수가 92점으로 가장 높아요.'
  },
  {
    title:'월별 도서관 대출 도서 분야(권)',
    headers:['분야','3월','4월','5월'],
    rowHeaderCol:0,
    rows:[
      ['소설','12','15','20'],
      ['만화','25','22','18'],
      ['과학','8','10','14'],
      ['역사','5','7','9'],
    ],
    question:'5월에 가장 많이 대출된 분야는?',
    options:['소설','만화','과학','역사'],
    correct:'소설',
    explain:'5월 소설 대출이 20권으로 가장 많아요.'
  },
  {
    title:'학급 문구점 판매 품목표',
    headers:['품목','재고(개)','가격(원)'],
    rowHeaderCol:0,
    rows:[
      ['볼펜','40','500'],
      ['지우개','25','300'],
      ['형광펜','15','1200'],
      ['노트','30','1500'],
    ],
    question:'가격이 가장 비싼 품목은?',
    options:['볼펜','지우개','형광펜','노트'],
    correct:'노트',
    explain:'노트가 1500원으로 가장 비싸요.'
  },
  {
    title:'동아리별 인원과 담당 선생님',
    headers:['동아리','인원(명)','담당 선생님'],
    rowHeaderCol:0,
    rows:[
      ['과학탐구','18','김OO'],
      ['보드게임','24','이OO'],
      ['댄스','30','박OO'],
      ['도서편집','12','최OO'],
    ],
    question:'담당 선생님이 "박OO"인 동아리는?',
    options:['과학탐구','보드게임','댄스','도서편집'],
    correct:'댄스',
    explain:'표에서 담당 선생님 열을 보면 댄스 동아리가 박OO 선생님이에요.'
  },
];

let order = [];
let idx = 0;
let score = 0;
let answered = false;

const tableTitle = document.getElementById('tableTitle');
const tableBox = document.getElementById('tableBox');
const questionText = document.getElementById('questionText');
const optionsBox = document.getElementById('optionsBox');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const progressPill = document.getElementById('progressPill');
const scorePill = document.getElementById('scorePill');
const playScreen = document.getElementById('playScreen');
const endScreen = document.getElementById('endScreen');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function init(){
  order = ROUNDS.map((_,i)=>i);
  idx = 0;
  score = 0;
  playScreen.style.display = 'flex';
  endScreen.style.display = 'none';
  renderRound();
}

function renderRound(){
  answered = false;
  const r = ROUNDS[order[idx]];
  progressPill.textContent = `${idx+1} / ${ROUNDS.length}`;
  scorePill.textContent = `점수 ${score}`;
  tableTitle.textContent = r.title;
  questionText.textContent = r.question;
  feedback.textContent = '';
  feedback.className = '';
  nextBtn.classList.remove('show');

  tableBox.innerHTML = '';
  tableBox.appendChild(buildTable(r));

  optionsBox.innerHTML = '';
  const opts = shuffle(r.options);
  opts.forEach(optText=>{
    const btn = document.createElement('div');
    btn.className = 'opt';
    btn.textContent = optText;
    btn.addEventListener('click', ()=> handleAnswer(btn, optText, r));
    optionsBox.appendChild(btn);
  });
}

function handleAnswer(btn, chosen, r){
  if(answered) return;
  answered = true;
  const allOpts = optionsBox.querySelectorAll('.opt');
  allOpts.forEach(o=>o.classList.add('disabled'));

  if(chosen === r.correct){
    btn.classList.add('correct');
    score += 1;
    feedback.textContent = `✅ 정답이에요! ${r.explain}`;
    feedback.className = 'ok';
  } else {
    btn.classList.add('wrong');
    allOpts.forEach(o=>{ if(o.textContent === r.correct) o.classList.add('correct'); });
    feedback.textContent = `❌ 아쉬워요. ${r.explain}`;
    feedback.className = 'no';
  }
  scorePill.textContent = `점수 ${score}`;
  nextBtn.classList.add('show');
}

nextBtn.addEventListener('click', ()=>{
  idx += 1;
  if(idx >= order.length){
    showEnd();
  } else {
    renderRound();
  }
});

function showEnd(){
  playScreen.style.display = 'none';
  endScreen.style.display = 'flex';
  document.getElementById('finalScore').textContent = `${score} / ${ROUNDS.length}`;
  const ratio = score/ROUNDS.length;
  let comment = '';
  if(ratio === 1) comment = '완벽해요! 표에서 원하는 값을 정확히 찾아내는군요.';
  else if(ratio >= 0.66) comment = '잘했어요! 행과 열을 침착하게 따라가면 만점도 가능해요.';
  else comment = '표는 행(가로)과 열(세로)이 만나는 칸을 찾는 게 핵심이에요. 다시 천천히 짚어볼까요?';
  document.getElementById('finalComment').textContent = comment;
}

document.getElementById('retryBtn').addEventListener('click', init);

function buildTable(r){
  const table = document.createElement('table');
  table.className = 'data';

  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  r.headers.forEach(h=>{
    const th = document.createElement('th');
    th.textContent = h;
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  r.rows.forEach(row=>{
    const tr = document.createElement('tr');
    row.forEach((cell, colIdx)=>{
      const cellEl = document.createElement(colIdx === r.rowHeaderCol ? 'th' : 'td');
      cellEl.textContent = cell;
      tr.appendChild(cellEl);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  return table;
}

init();
</script>
</body>
</html>
