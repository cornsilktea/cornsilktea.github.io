<!DOCTYPE html>
<html lang="ko">
<head>
<script charset="utf-8" src="firebase-config.js"></script>
<script charset="utf-8" src="access-guard.js" data-game="aiorhuman"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI일까, 사람일까?</title>
<style>
  :root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --ink:#1f2430;
    --sub:#6b7280;
    --line:#e1e6ef;
    --purple:#7c5cff;
    --purple-soft:#efeaff;
    --green:#1a9b64;
    --green-soft:#e6f7ef;
    --red:#e5484d;
    --red-soft:#fdecec;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-user-select:none;
    user-select:none;
  }
  header{
    padding:18px 28px 8px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:10px;
  }
  h1{font-size:1.6rem;margin:0;font-weight:800;letter-spacing:-0.02em;}
  .desc{color:var(--sub);font-size:0.95rem;margin-top:2px;}
  .status{display:flex;gap:14px;}
  .pill{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 18px;
    font-weight:700;
    white-space:nowrap;
  }
  .pill.score{color:var(--purple);}

  .notice{
    margin:0 28px 6px;
    background:var(--purple-soft);
    color:#5a3fd6;
    border-radius:14px;
    padding:10px 18px;
    font-size:0.9rem;
    font-weight:600;
  }

  main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px 20px 30px;
  }

  #playScreen{
    width:min(760px,95vw);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:32px 34px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .passage{
    background:#fbfcfe;
    border:2px solid var(--line);
    border-radius:16px;
    padding:26px;
    font-size:1.25rem;
    line-height:1.6;
    font-weight:600;
    min-height:100px;
    display:flex;
    align-items:center;
  }
  .passage.reveal-human{border-color:var(--green);background:var(--green-soft);}
  .passage.reveal-ai{border-color:var(--purple);background:var(--purple-soft);}

  .choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .choice{
    background:#fbfcfe;
    border:2px solid var(--line);
    border-radius:16px;
    padding:20px;
    font-size:1.15rem;
    font-weight:800;
    text-align:center;
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease, transform .08s ease;
  }
  .choice:active{transform:scale(.98);}
  .choice.correct{border-color:var(--green);background:var(--green-soft);color:var(--green);}
  .choice.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red);}
  .choice.disabled{cursor:default;}

  #explainBox{
    min-height:30px;
    font-size:1.02rem;
    font-weight:600;
    color:var(--sub);
    background:#f7f8fb;
    border-radius:12px;
    padding:14px 16px;
    display:none;
  }
  #explainBox.show{display:block;}
  #explainBox.ok{color:var(--green);}
  #explainBox.no{color:var(--red);}

  .btnbar{display:flex;justify-content:flex-end;}
  button.primary{
    background:var(--purple);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:15px 28px;
    font-size:1.05rem;
    font-weight:800;
    cursor:pointer;
    visibility:hidden;
  }
  button.primary.show{visibility:visible;}
  button.primary:active{transform:translateY(1px);}

  #endScreen{
    display:none;
    width:min(700px,95vw);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:40px;
    flex-direction:column;
    align-items:center;
    gap:16px;
    text-align:center;
  }
  #endScreen h2{margin:0;font-size:2rem;}
  #endScreen .bigscore{font-size:3.2rem;font-weight:900;color:var(--purple);}
  button.secondary{
    background:var(--card);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 30px;
    font-size:1.1rem;
    font-weight:800;
    cursor:pointer;
  }

  @media (max-width:600px){
    .choices{grid-template-columns:1fr;}
    h1{font-size:1.3rem;}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>🤖 AI일까, 사람일까?</h1>
    <div class="desc">짧은 글을 읽고 누가 썼을지 맞혀보세요.</div>
  </div>
  <div class="status">
    <div class="pill" id="progressPill">1 / 10</div>
    <div class="pill score" id="scorePill">점수 0</div>
  </div>
</header>

<div class="notice">💡 정답을 맞히는 것보다, 왜 그렇게 생각했는지 친구들과 이야기해보는 게 더 중요해요. AI도 얼마든지 사람처럼 자연스럽게 쓸 수 있답니다!</div>

<main>
  <div id="playScreen">
    <div class="passage" id="passageBox"></div>
    <div class="choices">
      <div class="choice" id="btnHuman">🙋 사람이 쓴 글 같아요</div>
      <div class="choice" id="btnAI">🤖 AI가 쓴 글 같아요</div>
    </div>
    <div id="explainBox"></div>
    <div class="btnbar">
      <button class="primary" id="nextBtn">다음 글 →</button>
    </div>
  </div>

  <div id="endScreen">
    <h2>결과 발표! 🔍</h2>
    <div class="bigscore" id="finalScore">0 / 10</div>
    <div id="finalComment" style="font-size:1.1rem;color:var(--sub);"></div>
    <button class="secondary" id="retryBtn">다시 하기</button>
  </div>
</main>

<script>
const PASSAGES = [
  {
    text:"어제 저녁에 강아지랑 산책하다가 갑자기 소나기가 쏟아져서 둘 다 흠뻑 젖었어요. 근데 그 와중에 강아지가 신나서 방방 뛰는 거 보니까 저도 웃음이 나더라고요.",
    origin:'human',
    explain:'특정 시간(어제 저녁)과 구체적인 상황, 감정 표현이 담겨 있어요. 사람이 직접 겪은 일을 쓴 것에 가까워요.'
  },
  {
    text:"반려동물과의 산책은 신체 건강뿐만 아니라 정서적 안정에도 도움이 됩니다. 규칙적인 산책 습관을 기르면 반려동물과의 유대감이 깊어지고, 스트레스 해소에도 효과적입니다.",
    origin:'ai',
    explain:'개인적인 경험 없이 일반적인 조언을 정리해서 전달하는 방식이에요. AI가 정보를 요약할 때 자주 쓰는 말투예요.'
  },
  {
    text:"이번 방학에 부산 갔다 왔는데 진짜 대박이었음ㅋㅋ 특히 광안리에서 먹은 회가 인생회였다. 다음엔 꼭 여름에 다시 가고 싶다.",
    origin:'human',
    explain:'구어체 표현(ㅋㅋ, 대박, 인생회)과 개인적인 바람이 담겨 있어 사람이 쓴 글에 가까워요.'
  },
  {
    text:"부산은 다양한 관광 명소와 먹거리로 유명한 도시입니다. 해운대, 광안리 등의 해변과 자갈치시장 등의 전통 시장을 함께 즐길 수 있어 여행지로 인기가 많습니다.",
    origin:'ai',
    explain:'개인 경험 없이 부산이라는 도시를 객관적으로 소개하는 균형 잡힌 설명이에요.'
  },
  {
    text:"오늘 수학 시험 완전 망친 것 같아... 어제 늦게까지 게임하다 자서 그런가. 아 근데 옆반 애들도 다 어려웠다고 하니까 조금 위안이 되긴 함.",
    origin:'human',
    explain:'자신의 실수(게임하다 늦게 잠)와 감정이 솔직하게 드러나 있어요. 아주 개인적인 이야기예요.'
  },
  {
    text:"시험 준비를 위해서는 충분한 수면과 규칙적인 학습 계획이 중요합니다. 벼락치기보다는 평소에 꾸준히 복습하는 습관을 기르는 것이 좋은 결과로 이어집니다.",
    origin:'ai',
    explain:'"~것이 중요합니다"처럼 조언을 정돈된 형태로 전달하는 문장이에요. 누구에게나 적용되는 일반적인 내용이죠.'
  },
  {
    text:"친구가 생일선물로 내가 좋아하는 캐릭터 스티커를 잔뜩 사줬는데 진짜 감동이었다. 어떻게 내 취향을 그렇게 잘 아는지... 역시 베프는 다르다.",
    origin:'human',
    explain:'특정 친구와의 구체적인 에피소드, "베프" 같은 표현에서 개인적인 관계와 감정이 느껴져요.'
  },
  {
    text:"좋은 친구 관계를 유지하기 위해서는 서로에 대한 관심과 배려가 필요합니다. 상대방의 취향을 기억하고 표현하는 작은 행동들이 관계를 더욱 돈독하게 만들어줍니다.",
    origin:'ai',
    explain:'구체적인 사건 없이 우정에 대한 일반적인 원칙을 설명하고 있어요.'
  },
  {
    text:"체육 시간에 피구하다가 발목을 살짝 삐끗했는데 보건 선생님이 얼음찜질 해주셔서 금방 괜찮아졌다. 그래도 다음 시합엔 못 나가서 좀 아쉬움.",
    origin:'human',
    explain:'오늘 겪은 구체적인 사건(피구, 발목, 보건 선생님)과 아쉬움이라는 감정이 담겨 있어요.'
  },
  {
    text:"운동 중 부상을 예방하기 위해서는 충분한 준비운동과 올바른 자세가 중요합니다. 만약 부상이 발생했다면, 즉시 활동을 중단하고 냉찜질 등 적절한 응급처치를 하는 것이 좋습니다.",
    origin:'ai',
    explain:'특정 사건이 아니라 부상 예방과 대처법을 순서대로 안내하는 정보성 문장이에요.'
  }
];

let order = [];
let idx = 0;
let score = 0;
let answered = false;

const passageBox = document.getElementById('passageBox');
const btnHuman = document.getElementById('btnHuman');
const btnAI = document.getElementById('btnAI');
const explainBox = document.getElementById('explainBox');
const nextBtn = document.getElementById('nextBtn');
const progressPill = document.getElementById('progressPill');
const scorePill = document.getElementById('scorePill');
const playScreen = document.getElementById('playScreen');
const endScreen = document.getElementById('endScreen');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function init(){
  order = shuffle(PASSAGES.map((_,i)=>i));
  idx = 0;
  score = 0;
  playScreen.style.display = 'flex';
  endScreen.style.display = 'none';
  renderRound();
}

function renderRound(){
  answered = false;
  const p = PASSAGES[order[idx]];
  progressPill.textContent = `${idx+1} / ${PASSAGES.length}`;
  scorePill.textContent = `점수 ${score}`;
  passageBox.textContent = p.text;
  passageBox.className = 'passage';
  explainBox.className = '';
  explainBox.classList.remove('show');
  explainBox.textContent = '';
  nextBtn.classList.remove('show');
  btnHuman.classList.remove('correct','wrong','disabled');
  btnAI.classList.remove('correct','wrong','disabled');
}

function handleChoice(chosen){
  if(answered) return;
  answered = true;
  const p = PASSAGES[order[idx]];
  btnHuman.classList.add('disabled');
  btnAI.classList.add('disabled');

  const correctBtn = p.origin === 'human' ? btnHuman : btnAI;
  const chosenBtn = chosen === 'human' ? btnHuman : btnAI;

  if(chosen === p.origin){
    chosenBtn.classList.add('correct');
    score += 1;
    explainBox.textContent = `✅ 정답! ${p.origin === 'human' ? '사람' : 'AI'}이(가) 쓴 글이에요. ${p.explain}`;
    explainBox.className = 'show ok';
  } else {
    chosenBtn.classList.add('wrong');
    correctBtn.classList.add('correct');
    explainBox.textContent = `❌ 사실 이 글은 ${p.origin === 'human' ? '사람' : 'AI'}이(가) 쓴 글이에요. ${p.explain}`;
    explainBox.className = 'show no';
  }

  passageBox.classList.add(p.origin === 'human' ? 'reveal-human' : 'reveal-ai');
  scorePill.textContent = `점수 ${score}`;
  nextBtn.classList.add('show');
}

btnHuman.addEventListener('click', ()=>handleChoice('human'));
btnAI.addEventListener('click', ()=>handleChoice('ai'));

nextBtn.addEventListener('click', ()=>{
  idx += 1;
  if(idx >= order.length){
    showEnd();
  } else {
    renderRound();
  }
});

function showEnd(){
  playScreen.style.display = 'none';
  endScreen.style.display = 'flex';
  document.getElementById('finalScore').textContent = `${score} / ${PASSAGES.length}`;
  const ratio = score/PASSAGES.length;
  let comment = '';
  if(ratio >= 0.8) comment = '글의 특징을 예리하게 잘 찾아냈어요!';
  else if(ratio >= 0.5) comment = '절반 이상 맞혔어요. 구체적인 경험이 담겼는지 살펴보는 게 힌트가 돼요.';
  else comment = 'AI도 사람처럼 자연스럽게 쓸 수 있다는 걸 직접 느껴봤네요. 그게 바로 이 게임의 핵심이에요!';
  document.getElementById('finalComment').textContent = comment;
}

document.getElementById('retryBtn').addEventListener('click', init);

init();
</script>
</body>
</html>
