<!DOCTYPE html>
<html lang="ko">
<head>
<script charset="utf-8" src="firebase-config.js"></script>
<script charset="utf-8" src="access-guard.js" data-game="cardauction"></script>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경매</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="정보 수업용 링크 모음">
<meta property="og:title" content="경매">
<meta property="og:description" content="정보 수업용 링크 모음">
<meta property="og:url" content="https://cornsilktea.github.io/5.cardauction.html">
<meta property="og:image" content="https://cornsilktea.github.io/icon-512.png">
<meta name="twitter:card" content="summary">
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;font-family:var(--sg-font);background:var(--sg-bg);color:var(--sg-ink);font-size:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--sg-line-mid);padding-bottom:10px;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:700}
h1 span{font-size:14px;color:var(--sg-ink-soft);font-weight:400;margin-left:10px}
button{font-family:inherit;font-size:15px;padding:8px 12px;border:1.5px solid var(--sg-line-strong);background:#fff;color:var(--sg-ink);border-radius:var(--sg-radius);cursor:pointer}
button:hover{background:var(--sg-panel-alt)}
.btn-p{background:var(--sg-primary);border-color:var(--sg-primary);color:#fff;font-weight:700;font-size:20px;padding:14px 16px;width:100%;border-radius:var(--sg-radius)}
.grid{display:grid;grid-template-columns:minmax(340px,1fr) minmax(380px,1.1fr);gap:14px;align-items:start}
.panel{background:var(--sg-panel);border:1px solid var(--sg-line-mid);border-radius:var(--sg-radius);padding:14px}
.cardbig{background:var(--sg-panel);border:1px solid var(--sg-line-mid);border-radius:var(--sg-radius);overflow:hidden;margin-bottom:12px}
.cband{height:12px}
.cinner{padding:12px 14px}
.ctop{font-size:17px;font-weight:700}
.cpts{font-size:56px;font-weight:700;line-height:1.1;margin:2px 0}
.cpts em{font-size:18px;font-style:normal;font-weight:500;color:var(--sg-ink-soft);margin-left:6px}
.cnote{font-size:14px;color:var(--sg-ink-soft)}
.brow{display:grid;grid-template-columns:1fr 44px 44px 74px 44px 44px 58px;gap:5px;align-items:center;padding:7px 0;border-top:1px solid var(--sg-line)}
.brow.off{opacity:.45}
.bname{font-size:16px;font-weight:700}
.bname span{display:block;font-size:12px;font-weight:400;color:var(--sg-ink-soft)}
.bval{text-align:right;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.stp{padding:9px 0;width:100%;font-size:15px}
.msg{font-size:15px;border:1px solid var(--sg-line-mid);border-radius:var(--sg-radius);padding:10px 12px;margin-top:12px;background:var(--sg-panel-alt);min-height:44px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{background:var(--sg-panel);border:1px solid var(--sg-line-mid);border-radius:var(--sg-radius);padding:11px 12px}
.tcard.lead{border-color:var(--sg-primary);border-width:2px}
.thead{display:flex;justify-content:space-between;align-items:baseline}
.tname{font-size:17px;font-weight:700}
.ttot{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tsub{font-size:13px;color:var(--sg-ink-soft);margin-top:2px}
.dots{display:flex;gap:8px;margin-top:7px;font-size:13px;color:var(--sg-ink-mid)}
.dot{display:inline-flex;align-items:center;gap:4px}
.sw{width:11px;height:11px;border-radius:2px;display:inline-block}
.bon{display:inline-block;font-size:12px;font-weight:700;border:1px solid var(--sg-ok);color:var(--sg-ok);border-radius:4px;padding:1px 5px;margin-left:5px}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:14px}
.chip{background:var(--sg-panel);border:1px solid var(--sg-line-mid);border-radius:var(--sg-radius);padding:5px 2px;text-align:center;font-size:12px;line-height:1.35}
.chip b{display:block;font-size:16px}
.chip.now{border-color:var(--sg-primary);border-width:2px}
.chip.done{background:var(--sg-panel-alt);color:var(--sg-ink-soft)}
.rrow{display:grid;grid-template-columns:26px 80px 1fr 70px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--sg-line);font-size:16px}
.rbar{height:18px;background:var(--sg-primary);border-radius:3px}
.rnum{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:20px}
.foot{font-size:13px;color:var(--sg-ink-soft);margin-top:12px;line-height:1.7}
table.rt{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.rt th,table.rt td{border-top:1px solid var(--sg-line);padding:5px;text-align:right}
table.rt th:first-child,table.rt td:first-child{text-align:left}
table.rt thead th{color:var(--sg-ink-soft);font-weight:600;border-top:0}
@media print{button{display:none}}
</style>
</head>
<body>
<div class="bar">
  <h1>보물카드 경매 진행판<span id="prog"></span></h1>
  <div>
    <button id="btnView">최종 결과</button>
    <button id="btnUndo">되돌리기</button>
    <button id="btnReset">처음부터</button>
  </div>
</div>
<div class="grid">
  <div class="panel" id="left"></div>
  <div>
    <div class="tgrid" id="teams"></div>
    <div class="strip" id="strip"></div>
    <div class="foot">예산 100점 · 같은 색 3장 모으면 보너스 25점 · 남은 예산은 그대로 점수 · 최고가 동점은 유찰</div>
  </div>
</div>
<script>
(function(){
  var CARDS=[
    {c:'red',p:18},{c:'blue',p:12},{c:'green',p:20},{c:'red',p:8},
    {c:'blue',p:22},{c:'green',p:10},{c:'red',p:15},{c:'blue',p:6},
    {c:'green',p:5},{c:'red',p:11},{c:'blue',p:16},{c:'green',p:14}
  ];
  var COLORS={red:{k:'빨강',h:'#B33951'},blue:{k:'파랑',h:'#2E5FA3'},green:{k:'초록',h:'#2F7D4F'}};
  var COLOR_KEYS=['red','blue','green'];
  var SET_BONUS=25, SET_SIZE=3, HISTORY_LIMIT=40, RESET_CONFIRM_MS=4000;

  function byId(id){return document.getElementById(id);}
  var leftEl=byId('left'), teamsEl=byId('teams'), stripEl=byId('strip'), progEl=byId('prog');
  var btnView=byId('btnView'), btnReset=byId('btnReset');

  var teams,idx,owner,msg,hist,view,resetArm,resetTimer=null;
  function init(){
    teams=[];
    for(var i=1;i<=4;i++){teams.push({name:i+'조',budget:100,won:[],bid:0,pass:false});}
    idx=0;
    owner=CARDS.map(function(){return null;});
    msg='1번 카드부터 시작합니다. 각 조가 상의한 입찰가를 입력하세요.';
    hist=[];view='play';disarmReset();render();
  }
  function snap(){hist.push(JSON.stringify({t:teams,i:idx,o:owner,m:msg}));if(hist.length>HISTORY_LIMIT){hist.shift();}}
  function undo(){if(hist.length===0){return;}var s=JSON.parse(hist.pop());teams=s.t;idx=s.i;owner=s.o;msg=s.m;view='play';render();}
  function colorCount(t,c){var n=0;for(var i=0;i<t.won.length;i++){if(CARDS[t.won[i]].c===c){n++;}}return n;}
  function scoreOf(t){
    var pts=0,bonus=0,counts={};
    for(var i=0;i<t.won.length;i++){pts+=CARDS[t.won[i]].p;}
    COLOR_KEYS.forEach(function(k){
      counts[k]=colorCount(t,k);
      if(counts[k]>=SET_SIZE){bonus+=SET_BONUS;}
    });
    return {pts:pts,bonus:bonus,total:pts+bonus+t.budget,counts:counts};
  }
  function adjustBid(i,d){
    var t=teams[i];
    if(t.pass){return;}
    t.bid=Math.min(t.budget,Math.max(0,t.bid+d));
    render();
  }
  function award(){
    if(idx>=CARDS.length){return;}
    snap();
    var mx=0,i;
    for(i=0;i<teams.length;i++){if(!teams[i].pass&&teams[i].bid>mx){mx=teams[i].bid;}}
    var winners=[];
    for(i=0;i<teams.length;i++){if(!teams[i].pass&&teams[i].bid===mx&&mx>0){winners.push(i);}}
    if(mx===0){
      owner[idx]=-1;
      msg=(idx+1)+'번 카드 — 입찰이 없어 유찰되었습니다.';
    }else if(winners.length>1){
      var names=winners.map(function(w){return teams[w].name;});
      owner[idx]=-1;
      msg=(idx+1)+'번 카드 — '+names.join(', ')+'가 '+mx+'점 동점이므로 유찰되었습니다.';
    }else{
      var t=teams[winners[0]];
      t.budget=t.budget-mx;
      t.won.push(idx);
      owner[idx]=winners[0];
      msg=(idx+1)+'번 카드 — '+t.name+' 낙찰, '+mx+'점 지불 (카드 '+CARDS[idx].p+'점 · 잔여 예산 '+t.budget+'점)';
    }
    for(i=0;i<teams.length;i++){teams[i].bid=0;teams[i].pass=false;}
    idx++;
    if(idx>=CARDS.length){view='result';msg='12장 경매가 모두 끝났습니다. 최종 점수를 확인하세요.';}
    render();
  }
  function renderResult(){
    var arr=teams.map(function(t){return {n:t.name,s:scoreOf(t),b:t.budget};});
    arr.sort(function(a,b){return b.s.total-a.s.total;});
    var top=Math.max(1,arr[0].s.total);
    var h='<div style="font-size:16px;font-weight:700;margin-bottom:4px">최종 순위</div>';
    arr.forEach(function(r,i){
      var pct=Math.round(r.s.total/top*100);
      h+='<div class="rrow"><div>'+(i+1)+'</div><div style="font-weight:700">'+r.n+'</div><div><div class="rbar" style="width:'+pct+'%"></div></div><div class="rnum">'+r.s.total+'</div></div>';
    });
    h+='<table class="rt"><thead><tr><th>조</th><th>카드 점수</th><th>보너스</th><th>남은 예산</th><th>합계</th></tr></thead><tbody>';
    arr.forEach(function(r){
      h+='<tr><td>'+r.n+'</td><td>'+r.s.pts+'</td><td>'+r.s.bonus+'</td><td>'+r.b+'</td><td style="font-weight:700">'+r.s.total+'</td></tr>';
    });
    h+='</tbody></table><div class="msg">'+msg+'</div>';
    leftEl.innerHTML=h;
  }
  function stepButton(action,label,i){
    return '<button class="stp" data-a="'+action+'" data-i="'+i+'">'+label+'</button>';
  }
  function renderLeft(){
    if(view==='result'||idx>=CARDS.length){renderResult();return;}
    var c=CARDS[idx], color=COLORS[c.c];
    var h='<div class="cardbig"><div class="cband" style="background:'+color.h+'"></div><div class="cinner">'+
       '<div class="ctop" style="color:'+color.h+'">'+(idx+1)+'번 카드 · '+color.k+'</div>'+
       '<div class="cpts">'+c.p+'<em>점</em></div>'+
       '<div class="cnote">진행 '+(idx+1)+' / 12 · 남은 카드 '+(CARDS.length-idx-1)+'장</div></div></div>';
    teams.forEach(function(t,i){
      h+='<div class="brow'+(t.pass?' off':'')+'">'+
         '<div class="bname">'+t.name+'<span>예산 '+t.budget+'점</span></div>'+
         stepButton('-5','-5',i)+stepButton('-1','-1',i)+
         '<div class="bval">'+(t.pass?'포기':t.bid)+'</div>'+
         stepButton('1','+1',i)+stepButton('5','+5',i)+
         stepButton('p',t.pass?'복귀':'포기',i)+'</div>';
    });
    h+='<div style="margin-top:12px"><button class="btn-p" id="btnAward">낙찰 처리 · 다음 카드</button></div>';
    h+='<div class="msg">'+msg+'</div>';
    leftEl.innerHTML=h;
  }
  function renderTeams(){
    var scores=teams.map(scoreOf);
    var best=-1;
    scores.forEach(function(s){if(s.total>best){best=s.total;}});
    var h='';
    teams.forEach(function(t,i){
      var s=scores[i],bon='',dots='';
      COLOR_KEYS.forEach(function(k){
        if(s.counts[k]>=SET_SIZE){bon+='<span class="bon">'+COLORS[k].k+' +'+SET_BONUS+'</span>';}
      });
      COLOR_KEYS.forEach(function(k){
        dots+='<span class="dot"><span class="sw" style="background:'+COLORS[k].h+'"></span>'+s.counts[k]+'</span>';
      });
      h+='<div class="tcard'+(s.total===best?' lead':'')+'">'+
         '<div class="thead"><span class="tname">'+t.name+bon+'</span><span class="ttot">'+s.total+'</span></div>'+
         '<div class="tsub">카드 '+s.pts+' + 보너스 '+s.bonus+' + 예산 '+t.budget+'</div>'+
         '<div class="dots">'+dots+'<span class="dot" style="color:#5B6B5E">보유 '+t.won.length+'장</span></div></div>';
    });
    teamsEl.innerHTML=h;
  }
  function renderStrip(){
    var h='';
    for(var i=0;i<CARDS.length;i++){
      var cls='chip';
      if(i===idx&&view==='play'){cls+=' now';}
      if(owner[i]!==null){cls+=' done';}
      var who='대기';
      if(owner[i]===-1){who='유찰';}
      else if(owner[i]!==null){who=teams[owner[i]].name;}
      h+='<div class="'+cls+'"><span class="sw" style="background:'+COLORS[CARDS[i].c].h+'"></span><b>'+CARDS[i].p+'</b>'+who+'</div>';
    }
    stripEl.innerHTML=h;
    progEl.textContent=(idx>=CARDS.length?'경매 종료':'진행 '+(idx+1)+'/12');
  }
  function render(){
    renderLeft();renderTeams();renderStrip();
    btnView.textContent=(view==='result'?'진행 화면':'최종 결과');
    btnReset.textContent=(resetArm?'한 번 더 누르면 초기화':'처음부터');
  }
  function disarmReset(){
    resetArm=false;
    if(resetTimer){clearTimeout(resetTimer);resetTimer=null;}
  }
  leftEl.addEventListener('click',function(e){
    if(e.target.closest('#btnAward')){award();return;}
    var b=e.target.closest('button.stp');
    if(!b){return;}
    var i=parseInt(b.getAttribute('data-i'),10);
    var a=b.getAttribute('data-a');
    if(a==='p'){teams[i].pass=!teams[i].pass;teams[i].bid=0;render();}
    else{adjustBid(i,parseInt(a,10));}
  });
  byId('btnUndo').addEventListener('click',undo);
  btnView.addEventListener('click',function(){
    view=(idx>=CARDS.length||view!=='result')?'result':'play';
    render();
  });
  btnReset.addEventListener('click',function(){
    if(resetArm){init();return;}
    resetArm=true;render();
    resetTimer=setTimeout(function(){disarmReset();render();},RESET_CONFIRM_MS);
  });
  init();
})();
</script>
</body>
</html>
