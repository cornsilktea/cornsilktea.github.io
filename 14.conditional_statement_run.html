<!DOCTYPE html>
<html lang="ko">
<head>
<script charset="utf-8" src="firebase-config.js"></script>
<script charset="utf-8" src="access-guard.js" data-game="conditionrun"></script>
<script charset="utf-8" src="world-record.js"></script>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>조건문 러너</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="정보 수업용 링크 모음">
<meta property="og:title" content="조건문 러너">
<meta property="og:description" content="정보 수업용 링크 모음">
<meta property="og:url" content="https://cornsilktea.github.io/14.conditional_statement_run.html">
<meta property="og:image" content="https://cornsilktea.github.io/icon-512.png">
<meta name="twitter:card" content="summary">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#123f42;
    font-family:var(--sg-font);
    touch-action:none;overscroll-behavior:none;}
  #scene{position:fixed;top:0;left:0;width:100%;height:100%;display:block;}

  #topbar{position:fixed;top:0;left:0;right:0;z-index:20;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 28px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;
    color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55);
    background:linear-gradient(to bottom, rgba(10,30,18,.55), rgba(10,30,18,0));}
  #stageBox{margin-top:40px;min-width:130px;}
  #stageLabel{font-size:11px;font-weight:700;letter-spacing:.18em;color:#DCE6D6;}
  #stageLine{display:flex;align-items:baseline;gap:4px;line-height:1;margin:2px 0 6px;}
  #hStage{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;}
  #stageTotal{font-size:14px;font-weight:700;color:#DCE6D6;}
  #stageBar{width:130px;height:6px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.35);}
  #stageFill{height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#9fd08a,#D97B4F);
    transition:width .25s ease-out;}
  #records{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right;min-width:0;}
  .rec{display:flex;align-items:center;gap:7px;min-width:0;}
  .recIcon{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;text-shadow:none;box-shadow:0 1px 3px rgba(0,0,0,.35);}
  .recIcon.me{background:#DCE6D6;}
  .recIcon.world{background:#D97B4F;}
  .recIcon.cls{background:#fff;}
  .recText{min-width:0;}
  .recText span{display:block;font-size:10.5px;font-weight:700;color:#DCE6D6;letter-spacing:.02em;line-height:1.2;}
  .recText b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;}
  .recText small{display:block;font-size:10.5px;color:#fff;opacity:.85;line-height:1.2;
    max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .recText small:empty{display:none;}

  #controls{position:fixed;z-index:20;
    left:calc(env(safe-area-inset-left,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
    width:156px;height:156px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  #controls::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:rgba(10,30,18,.28);border:1px solid rgba(255,255,255,.25);}
  .pad{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    margin:3px;border-radius:12px;background:rgba(255,255,255,.88);border:1px solid rgba(36,64,47,.35);
    color:var(--sg-primary);box-shadow:0 2px 5px rgba(0,0,0,.3);pointer-events:none;
    transition:transform .06s, background .06s;}
  .pad svg{width:20px;height:20px;}
  .pad i{font-style:normal;font-size:10px;font-weight:700;line-height:1;}
  .pad.on{background:var(--sg-primary);color:#fff;transform:scale(.93);}
  #pUp{grid-area:1/2;} #pLeft{grid-area:2/1;} #pRight{grid-area:2/3;} #pDown{grid-area:3/2;}
  #padCenter{grid-area:2/2;margin:12px;border-radius:50%;background:rgba(255,255,255,.35);pointer-events:none;position:relative;}

  .screen{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;background:rgba(16,44,47,.72);
    display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto;}
  .card{background:#fff;border:1px solid #d9dcdf;border-radius:10px;
    padding:20px;width:100%;max-width:440px;}
  .card h1{margin:0 0 4px;font-size:21px;color:#111827;letter-spacing:-.01em;}
  .card h2{margin:0 0 12px;font-size:19px;color:#111827;}
  .card p{margin:0 0 14px;font-size:13.5px;line-height:1.65;color:#4b535b;}
  .maptable{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:13px;}
  .maptable th,.maptable td{border:1px solid #e3e6e9;padding:8px 9px;text-align:left;color:#28303a;}
  .maptable th{background:#f6f7f8;font-weight:600;color:#4b535b;font-size:12px;}
  .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:7px;
    vertical-align:-1px;border:1px solid rgba(0,0,0,.14);}
  .bigbtn{display:block;width:100%;appearance:none;background:#1f2933;color:#fff;
    border:1px solid #1f2933;border-radius:8px;padding:15px 0;font-size:16px;font-weight:700;
    font-family:inherit;cursor:pointer;}
  .bigbtn:active{background:#333d47;}
  
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px;}
  .stat{border:1px solid #e3e6e9;border-radius:8px;padding:7px 8px;min-width:0;}
  .stat span{display:block;font-size:11px;color:#7a828a;margin-bottom:2px;white-space:nowrap;}
  .stat b{font-size:16px;color:#111827;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .stat em{display:block;font-style:normal;font-size:12px;color:#3d454d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  
  #fullLog{max-height:190px;overflow-y:auto;border:1px solid #e3e6e9;border-radius:8px;
    padding:9px 11px;margin-bottom:12px;
    font-family:"SFMono-Regular",Consolas,Menlo,monospace;font-size:11.5px;line-height:1.6;
    color:#28303a;-webkit-overflow-scrolling:touch;}
  #fullLog div.no{color:#b03a2e;}
  .hide{display:none !important;}
  #startScreen{--st-bg:8,30,32;--st-panel:rgba(12,38,40,.8);--st-accent:#D97B4F;--st-title2:#9fd08a;--st-glow:rgba(159,208,138,.4);}
  #startScreen code{font-family:"SFMono-Regular",Consolas,Menlo,monospace;font-size:14px;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.1);color:#F4F1E8;}
  @media (max-height:620px){
    #controls{width:138px;height:138px;}
    #stageBox{margin-top:38px;}
    #hStage{font-size:28px;}
    .card{padding:16px;}
  }
  [hidden]{display:none !important;}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="topbar">
  <div id="stageBox">
    <div id="stageLabel">STAGE</div>
    <div id="stageLine"><span id="hStage">0</span><span id="stageTotal">/ 100</span></div>
    <div id="stageBar"><div id="stageFill"></div></div>
  </div>
  <div id="records">
    <div class="rec"><div class="recText"><span>개인 최고 기록</span><b id="hBest">0</b></div><div class="recIcon me">⭐</div></div>
    <div class="rec"><div class="recText"><span>세계 신기록</span><b id="hWorld">-</b><small id="hWorldWho"></small></div><div class="recIcon world">🏆</div></div>
    <div class="rec" id="hClsChip" hidden><div class="recText"><span>우리 반 신기록</span><b id="hCls">-</b><small id="hClsWho"></small></div><div class="recIcon cls">🏫</div></div>
  </div>
</div>

<div id="controls" aria-label="방향키">
  <div class="pad" id="pUp"><svg viewBox="0 0 24 24"><path d="M12 5l7 9H5z" fill="currentColor"/></svg><i>점프</i></div>
  <div class="pad" id="pLeft"><svg viewBox="0 0 24 24"><path d="M5 12l9-7v14z" fill="currentColor"/></svg><i>이동</i></div>
  <div id="padCenter"></div>
  <div class="pad" id="pRight"><svg viewBox="0 0 24 24"><path d="M19 12l-9 7V5z" fill="currentColor"/></svg><i>이동</i></div>
  <div class="pad" id="pDown"><i>숙이기</i><svg viewBox="0 0 24 24"><path d="M12 19l-7-9h14z" fill="currentColor"/></svg></div>
</div>

<div class="st-screen" id="startScreen">
  <div class="st-wrap">
    <div class="st-hero">
      <h1 class="st-title">조건문 러너<span>3D</span></h1>
    </div>
    <div class="st-card">
      <button class="st-btn primary" id="startBtn" type="button">시작하기 (Space)</button>
    </div>
    <div class="st-card">
      <h2>조건 → 실행</h2>
      <table class="st-table">
        <thead><tr><th>조건 (장애물)</th><th>실행 (행동)</th></tr></thead>
        <tbody>
          <tr><td><span class="sw" style="background:#a9743c"></span>바닥의 통나무</td><td><b>점프</b></td></tr>
          <tr><td><span class="sw" style="background:#c2543f"></span>공중의 낮은 천장</td><td><b>숙이기</b></td></tr>
          <tr><td><span class="sw" style="background:#5c7f8c"></span>차선을 막는 벽</td><td><b>차선 이동</b></td></tr>
        </tbody>
      </table>
      <ul class="st-rules" style="margin-top:12px">
        <li>장애물 <b>100개</b>를 통과하면 완주입니다.</li>
      </ul>
    </div>
    <div class="st-card">
      <h2>조작 방법</h2>
      <div class="st-keys">
        <span><kbd>↑</kbd> <kbd>W</kbd> <kbd>Space</kbd></span><span>점프</span>
        <span><kbd>↓</kbd> <kbd>S</kbd></span><span>숙이기</span>
        <span><kbd>←</kbd> <kbd>→</kbd> <kbd>A</kbd> <kbd>D</kbd></span><span>왼쪽·오른쪽 차선으로 이동</span>
      </div>
      <div class="st-keys">
        <span><span class="st-tag">📱 터치</span></span><span>화면을 위·아래·옆으로 밀거나 왼쪽 아래 방향 버튼을 누릅니다.</span>
      </div>
    </div>
  </div>
</div>

<div class="screen hide" id="resultScreen">
  <div class="card">
    <h2 id="rTitle">결과</h2>
    <div class="stats">
      <div class="stat"><span>도달 스테이지</span><b id="rStage">0</b></div>
      <div class="stat"><span>최고 기록</span><b id="rBest">0</b></div>
      <div class="stat"><span>세계 신기록</span><b id="rWorld">-</b><em id="rWorldName"></em></div>
      <div class="stat" id="rClsStat" hidden><span>우리 반 신기록</span><b id="rCls">-</b><em id="rClsName"></em></div>
    </div>
    <div id="fullLog"></div>
    <button class="bigbtn" id="againBtn" type="button">다시 하기 (Space)</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
  "use strict";

  var LANES = [-3.2, 0, 3.2];
  var TOTAL = 100;
  var PLAYER_Z = -0.15;
  var SPAWN_Z = -155;
  var SEG_LEN = 20;
  var SEG_COUNT = 12;

  var TIERS = [
    { speed:30.0, gap:30 },
    { speed:36.6, gap:26 },
    { speed:43.3, gap:23 },
    { speed:50.0, gap:20 },
    { speed:56.6, gap:18 },
    { speed:63.3, gap:16 },
    { speed:70.0, gap:14 }
  ];
  function tierOf(n){
    if (n >= 69) return 6;
    var t = Math.floor(n / 11.5);
    if (t < 0) t = 0;
    if (t > 6) t = 6;
    return t;
  }

  var COND_NAME = { log:"통나무", ceil:"낮은천장", wall:"벽", wall2:"벽(2개)" };
  var NEED_ACT  = { log:"점프",   ceil:"숙이기",   wall:"차선이동", wall2:"차선이동" };

  var bestStage = 0;
  try { bestStage = parseInt(localStorage.getItem("runner_best_stage") || "0", 10) || 0; }
  catch (e) { bestStage = 0; }

  function checkBestStage(current){
    if (current > bestStage) {
      bestStage = current;
      try { localStorage.setItem("runner_best_stage", bestStage.toString()); } catch (e) {}
    }
  }

  var $ = function(id){ return document.getElementById(id); };
  var elStage=$("hStage"), elStageFill=$("stageFill"), elBest=$("hBest"),
      elStart=$("startScreen"), elResult=$("resultScreen"), elTop=$("topbar"),
      elCtrl=$("controls");
  var recordEls = {
    hWorld:$("hWorld"), hWorldWho:$("hWorldWho"), rWorld:$("rWorld"), rWorldName:$("rWorldName"),
    hClsChip:$("hClsChip"), rClsStat:$("rClsStat"), hCls:$("hCls"), hClsWho:$("hClsWho"), rCls:$("rCls"), rClsName:$("rClsName")
  };

  var WR = window.WorldRecord ? WorldRecord("conditionrun") : null;
  function renderWorld(){
    var E = recordEls;
    var has = WR && WR.rec;
    E.hWorld.textContent = has ? WR.value() : "-";
    E.hWorldWho.textContent = has ? WR.who() : "";
    E.rWorld.textContent = has ? WR.value() + " / " + TOTAL : "-";
    E.rWorldName.textContent = has ? WR.who() : ((WR && !WR.loaded) ? "불러오는 중…" : "기록 없음");
    var classRecord = WR && WR.cls;
    if (classRecord) {
      var hasClass = !!classRecord.rec;
      E.hClsChip.hidden = false; E.rClsStat.hidden = false;
      E.hCls.textContent = hasClass ? classRecord.value() : "-";
      E.hClsWho.textContent = hasClass ? classRecord.who() : "";
      E.rCls.textContent = hasClass ? classRecord.value() + " / " + TOTAL : "-";
      E.rClsName.textContent = hasClass ? classRecord.who() : (classRecord.loaded ? "기록 없음" : "불러오는 중…");
    }
  }
  if (WR) { WR.onChange(renderWorld); WR.load(); }

  var state = {
    phase:"ready", speed:TIERS[0].speed, targetSpeed:TIERS[0].speed,
    spawned:0, passed:0, distSinceSpawn:0, logs:[]
  };
  var player = {
    lane:1, x:0, y:0, jumping:false, sliding:false,
    tAct:0, durAct:0, jumpH:2.45, animTime:0, squash:0
  };
  
  var isSlidePressed = false;
  var isJumpPressed = false;

  var scene, camera, renderer, clock, roadSegs=[], obstacles=[], pool=[], playerObj;
  var dirLight, skyFarMesh, skyNearMesh, composer = null, bloomOn = true;
  var sunPosition = null, sunStrength = 1;

  var ASSET_DIR = "img/conditionrun/";
  var IMG = {
    bg_sky_far: ASSET_DIR + "bg_sky_far.jpg",
    bg_sky_near: ASSET_DIR + "bg_sky_near.webp",
    bush_flower: ASSET_DIR + "bush_flower.webp",
    ruin_pillar: ASSET_DIR + "ruin_pillar.webp",
    obstacle_log: ASSET_DIR + "obstacle_log.webp",
    obstacle_vine: ASSET_DIR + "obstacle_vine.webp",
    obstacle_wall: ASSET_DIR + "obstacle_wall.webp",
    light_shaft: ASSET_DIR + "light_shaft.webp",
    tex_curb: ASSET_DIR + "tex_curb.jpg",
    tex_ground_grass: ASSET_DIR + "tex_ground_grass.jpg",
    tex_road: ASSET_DIR + "tex_road.jpg",
    tex_road_normal: ASSET_DIR + "tex_road_normal.jpg",
    tex_road_orm: ASSET_DIR + "tex_road_orm.jpg",
    tree_big: ASSET_DIR + "tree_big.webp",
    tree_palm: ASSET_DIR + "tree_palm.webp"
  };
  var ASSET_VERSION = "?v=3";
  Object.keys(IMG).forEach(function(k){ IMG[k] += ASSET_VERSION; });
  var LINEAR_MAP_SUFFIXES = ["_normal", "_rough", "_orm"];
  var PLAYER_MODEL_URL = ASSET_DIR + "player.glb" + ASSET_VERSION;
  var PLAYER_H = 2.3;
  var playerGltf = null;

  var TEX = {};
  var MAT = {};
  var TINT_MATS = [];
  var billboards = [];

  function isLinearMap(key){
    return LINEAR_MAP_SUFFIXES.some(function(s){ return key.slice(-s.length) === s; });
  }
  function makeTexture(src, repeatX, repeatY){
    var t = TEX[src];
    if (repeatX !== undefined) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeatX, repeatY); }
    t.encoding = isLinearMap(src) ? THREE.LinearEncoding : THREE.sRGBEncoding;
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return t;
  }
  function optionalTexture(src, repeatX, repeatY){
    return TEX[src] ? makeTexture(src, repeatX, repeatY) : null;
  }
  function spriteMat(src){
    var m = new THREE.MeshStandardMaterial({ map:makeTexture(src), transparent:true, alphaTest:0.5, side:THREE.DoubleSide,
      roughness:0.92, metalness:0 });
    TINT_MATS.push(m);
    return m;
  }
  function tileMat(src, rx, ry, roughness){
    var m = new THREE.MeshStandardMaterial({ map:makeTexture(src, rx, ry), roughness:roughness, metalness:0 });
    var normal = optionalTexture(src + "_normal", rx, ry);
    var rough = optionalTexture(src + "_rough", rx, ry);
    if (normal) m.normalMap = normal;
    if (rough) { m.roughnessMap = rough; m.roughness = 1; }
    var occlusionRoughness = optionalTexture(src + "_orm", rx, ry);
    if (occlusionRoughness) { m.aoMap = occlusionRoughness; m.roughnessMap = occlusionRoughness; m.roughness = 1; }
    TINT_MATS.push(m);
    return m;
  }
  function skyMat(src){
    return new THREE.MeshBasicMaterial({ map:makeTexture(src), fog:false, transparent:true, depthWrite:false, toneMapped:false });
  }

  function makeMaterials(){
    MAT.road   = tileMat("tex_road", 1, 3, 0.82);
    MAT.curb   = tileMat("tex_curb", 7, 1, 0.9);
    MAT.curbTop = MAT.curb.clone();
    MAT.curbTop.map = MAT.curb.map.clone();
    MAT.curbTop.map.center.set(0.5, 0.5);
    MAT.curbTop.map.rotation = Math.PI / 2;
    MAT.curbTop.map.repeat.set(7, 0.5);
    MAT.curbTop.map.needsUpdate = true;
    TINT_MATS.push(MAT.curbTop);
    MAT.curbFaces = [MAT.curb, MAT.curb, MAT.curbTop, MAT.curb, MAT.curb, MAT.curb];
    MAT.ground = tileMat("tex_ground_grass", 32, 3, 0.95);
    MAT.skyFar  = skyMat("bg_sky_far");
    MAT.skyNear = skyMat("bg_sky_near");
    MAT.treeBig  = spriteMat("tree_big");
    MAT.treePalm = spriteMat("tree_palm");
    MAT.bush     = spriteMat("bush_flower");
    MAT.pillar   = spriteMat("ruin_pillar");
    MAT.obLog    = spriteMat("obstacle_log");
    MAT.obVine   = spriteMat("obstacle_vine");
    MAT.obWall   = spriteMat("obstacle_wall");
    MAT.shaft    = new THREE.MeshBasicMaterial({ map:makeTexture("light_shaft"), transparent:true, depthWrite:false,
                     blending:THREE.AdditiveBlending, fog:false, toneMapped:false, side:THREE.DoubleSide, opacity:0.3 });
    MAT.shadow   = new THREE.MeshBasicMaterial({ map:makeShadowTexture(), color:0x000000, transparent:true, opacity:0.4,
                     depthWrite:false, fog:true });
  }

  function makeShadowTexture(){
    var c = document.createElement("canvas"); c.width = c.height = 128;
    var x = c.getContext("2d"), g = x.createRadialGradient(64, 64, 6, 64, 64, 64);
    g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.55, "rgba(255,255,255,0.55)"); g.addColorStop(1, "rgba(255,255,255,0)");
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    var t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter;
    return t;
  }
  var SHADOW_Y = 0.07;
  var shadows = [];
  var shadowDir = 0;
  var SHADOW_MATS = [];
  function makeShadow(w, d, opacity){
    var mat = MAT.shadow.clone();
    mat.userData.baseOpacity = (opacity === undefined) ? 0.4 : opacity;
    SHADOW_MATS.push(mat);

  function buildPlayerModel(){
    if (!playerGltf) return buildFallbackModel();

      if (!o.isMesh) return;
      o.castShadow = true;
      o.frustumCulled = false;
    });
    var holder = new THREE.Group();
    holder.rotation.y = Math.PI;
    holder.add(model);

    poseMixer = new THREE.AnimationMixer(model);
    var clips = {};
    playerGltf.animations.forEach(function(c){ clips[c.name] = c; });
    if (clips.slide) {
      var fps = 60;
      clips.slide = THREE.AnimationUtils.subclip(clips.slide, "slideHold",
        Math.round(SLIDE_CLIP_RANGE[0] * fps), Math.round(SLIDE_CLIP_RANGE[1] * fps), fps);
    }
    ["run", "jump", "slide"].forEach(function(name){
      if (!clips[name]) return;
      var a = poseMixer.clipAction(clips[name]);

  function fitModelToPlayerHeight(model){
    poseMixer.update(0);
    model.updateMatrixWorld(true);
    var minY = Infinity, maxY = -Infinity, p = new THREE.Vector3();
    model.traverse(function(o){
      if (!o.isBone) return;
      o.getWorldPosition(p);
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    });
    if (!isFinite(minY) || maxY - minY < 0.01) return;
    var k = PLAYER_H / (maxY - minY);
    model.scale.multiplyScalar(k);
    model.position.y -= minY * k;
  }

    var next = poseActions[name];

    if (timeScale !== undefined) next.timeScale = timeScale;
    if (name === currentPose && !restart) return;
    var prev = poseActions[currentPose];
    next.reset();
    next.setEffectiveWeight(1);
    next.play();
    if (prev && prev !== next) {
      next.fadeIn(POSE_FADE);
      prev.fadeOut(POSE_FADE);
    }
    currentPose = name;

  var dustNext = 0;
  function puff(x, z, n, spread){
    for (var i = 0; i < n; i++) {
      var d = dust[dustNext]; dustNext = (dustNext + 1) % DUST_MAX;
      d.t = 0; d.life = 0.3 + Math.random() * 0.15;
      d.vx = (Math.random() - 0.5) * spread; d.vy = 0.9 + Math.random() * 0.8; d.vz = 1.5 + Math.random() * 1.5;
      d.mesh.position.set(x + (Math.random() - 0.5) * 0.5, 0.12, z + (Math.random() - 0.5) * 0.4);
      d.mesh.visible = true;
    }
  }
  function updateDust(dt){
    for (var i = 0; i < DUST_MAX; i++) {
      var d = dust[i];
      if (!d.mesh.visible) continue;
      d.t += dt;
      var p = d.t / d.life;
      if (p >= 1) { d.mesh.visible = false; continue; }
      d.mesh.position.x += d.vx * dt; d.mesh.position.y += d.vy * dt; d.mesh.position.z += d.vz * dt;
      var s = 0.35 + p * 0.9;
      d.mesh.scale.set(s, s, 1);
      d.mesh.material.opacity = 0.6 * (1 - p) * (1 - p);
    }
  }

  var SPORE_COUNT = 240, FIREFLY_COUNT = 40, AIR_DEPTH = 110, AIR_NEAR_Z = 12;
  var spores = null, fireflies = null, fireflyPhase = [], atmosphereTime = 0;
  function randomAirPoint(arr, i, minSideX){
    var side = Math.random() < 0.5 ? -1 : 1;
    arr[i * 3] = minSideX ? side * (minSideX + Math.random() * 12) : (Math.random() - 0.5) * 30;
    arr[i * 3 + 1] = 0.3 + Math.random() * (minSideX ? 3.5 : 9);
    arr[i * 3 + 2] = AIR_NEAR_Z - Math.random() * AIR_DEPTH;
  }
  function initAirParticles(){
    var sporePos = new Float32Array(SPORE_COUNT * 3);
    for (var i = 0; i < SPORE_COUNT; i++) randomAirPoint(sporePos, i, 0);
    var sg = new THREE.BufferGeometry();
    sg.setAttribute("position", new THREE.BufferAttribute(sporePos, 3));
    spores = new THREE.Points(sg, new THREE.PointsMaterial({ map:MAT.shadow.map, color:0xf1efc4, size:0.13, transparent:true,
      opacity:0.55, depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true, toneMapped:false }));
    spores.frustumCulled = false;
    scene.add(spores);

    var flyPos = new Float32Array(FIREFLY_COUNT * 3), flyCol = new Float32Array(FIREFLY_COUNT * 3);
    for (var j = 0; j < FIREFLY_COUNT; j++) { randomAirPoint(flyPos, j, 6); fireflyPhase.push(Math.random() * 10); }
    var fg = new THREE.BufferGeometry();
    fg.setAttribute("position", new THREE.BufferAttribute(flyPos, 3));
    fg.setAttribute("color", new THREE.BufferAttribute(flyCol, 3));
    fireflies = new THREE.Points(fg, new THREE.PointsMaterial({ map:MAT.shadow.map, size:0.42, transparent:true, vertexColors:true,
      depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true, toneMapped:false }));
    fireflies.frustumCulled = false;
    fireflies.visible = false;
    scene.add(fireflies);
  }

  function driftAir(points, move, dt, sway, minSideX){
    var pos = points.geometry.attributes.position, a = pos.array, n = pos.count;
    for (var i = 0; i < n; i++) {
      a[i * 3 + 2] += move;
      a[i * 3] += Math.sin(atmosphereTime * 0.7 + i) * sway * dt;
      a[i * 3 + 1] += Math.cos(atmosphereTime * 0.5 + i * 1.3) * sway * 0.6 * dt;
      if (a[i * 3 + 2] > AIR_NEAR_Z) { randomAirPoint(a, i, minSideX); a[i * 3 + 2] = AIR_NEAR_Z - AIR_DEPTH; }
    }
    pos.needsUpdate = true;
  }

  function nightAmount(){
    return Math.max(0, Math.min(1, (state.passed / TOTAL - 0.72) / 0.18));
  }

  function updateAtmosphere(dt, move){
    atmosphereTime += dt;
    driftAir(spores, move, dt, 0.25, 0);

    var night = nightAmount();
    fireflies.visible = night > 0;
    if (night > 0) {
      driftAir(fireflies, move, dt, 0.9, 6);
      var col = fireflies.geometry.attributes.color.array;
      for (var i = 0; i < FIREFLY_COUNT; i++) {
        var b = Math.pow(Math.max(0, Math.sin(atmosphereTime * 2.3 + fireflyPhase[i])), 3) * night;
        col[i * 3] = b; col[i * 3 + 1] = b * 0.88; col[i * 3 + 2] = b * 0.3;
      }
      fireflies.geometry.attributes.color.needsUpdate = true;
    }

    var shaftLight = 0.5 + 0.5 * sunStrength * (1 - night * 0.8);
    for (var s = 0; s < shafts.length; s++) {
      var sh = shafts[s];
      sh.mat.opacity = 0.26 * shaftLight * (0.75 + 0.25 * Math.sin(atmosphereTime * 0.8 + sh.phase));
      sh.mesh.rotation.z = sh.tilt + Math.sin(atmosphereTime * 0.35 + sh.phase) * 0.03;
    }

    skyFarMesh.position.x = camera.position.x * 0.92;
    skyNearMesh.position.x = camera.position.x * 0.8;
  }

  var hit = { t:0, dur:0.7, active:false };
  function startHit(){
    state.phase = "hit";
    hit.t = 0; hit.active = true;
    isSlidePressed = false; player.sliding = false; player.jumping = false;
    setPose("jump", true, 1);
    puff(player.x, PLAYER_Z, 6, 2.4);
  }

  function act(kind){
    if (state.phase !== "run") return;
    if (kind === "left")  { if (player.lane > 0) { player.lane--; puff(player.x, PLAYER_Z, 3, 1.2); } return; }
    if (kind === "right") { if (player.lane < 2) { player.lane++; puff(player.x, PLAYER_Z, 3, 1.2); } return; }

    if (kind === "jump") {
      player.jumping = true; player.sliding = false; player.tAct = 0;
      player.durAct = Math.min(0.68, Math.max(0.17, 12.4 / state.speed));
      if (poseActions.jump) setPose("jump", true, poseActions.jump.getClip().duration / player.durAct);
      puff(player.x, PLAYER_Z, 2, 0.8);
    } else if (kind === "slide") {
      var wasSliding = player.sliding;
      player.sliding = true; player.jumping = false; player.y = 0; player.tAct = 0;
      player.durAct = Math.min(0.62, Math.max(0.16, 11.0 / state.speed));
      if (!wasSliding) setPose("slide", true, SLIDE_TIME_SCALE);
    }
  }

  function keyAction(e){
    var k = e.key, c = e.code;
    if (k === "ArrowLeft" || k === "a" || k === "A" || c === "KeyA") return "left";
    if (k === "ArrowRight" || k === "d" || k === "D" || c === "KeyD") return "right";
    if (k === "ArrowUp" || k === "w" || k === "W" || c === "KeyW" || k === " " || k === "Spacebar") return "jump";
    if (k === "ArrowDown" || k === "s" || k === "S" || c === "KeyS") return "slide";
    return null;
  }

  document.addEventListener("keydown", function(e){
    var k = e.key;
    if ((state.phase === "ready" || state.phase === "over") && (k === " " || k === "Spacebar" || k === "Enter")) {
      startGame();
      e.preventDefault();
      return;
    }
    var action = keyAction(e);
    if (e.repeat && action !== "slide") { e.preventDefault(); return; }
    if (action === "left" || action === "right") { act(action); e.preventDefault(); }
    else if (action === "jump") {
      if (!isJumpPressed) { isJumpPressed = true; act("jump"); }
      e.preventDefault();
    }
    else if (action === "slide") {
      if (!isSlidePressed) { isSlidePressed = true; act("slide"); }
      e.preventDefault();
    }
  }, { passive:false });

  window.addEventListener("blur", function(){ isJumpPressed = false; isSlidePressed = false; });
  document.addEventListener("keyup", function(e){
    var action = keyAction(e);
    if (action === "jump") isJumpPressed = false;
    if (action === "slide") { isSlidePressed = false; player.sliding = false; }
  });

  var sx = 0, sy = 0, swiping = false;
  function pStart(x, y){ sx = x; sy = y; swiping = true; }
  function pEnd(x, y){
    if (!swiping) return; swiping = false;
    var dx = x - sx, dy = y - sy, ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax < 22 && ay < 22) return;
    if (ax > ay) act(dx > 0 ? "right" : "left");
    else act(dy > 0 ? "slide" : "jump");
  }
  var cv = $("scene");
  cv.addEventListener("touchstart", function(e){ var t=e.changedTouches[0]; pStart(t.clientX,t.clientY); e.preventDefault(); }, { passive:false });
  cv.addEventListener("touchend", function(e){ var t=e.changedTouches[0]; pEnd(t.clientX,t.clientY); e.preventDefault(); }, { passive:false });
  cv.addEventListener("touchmove", function(e){ e.preventDefault(); }, { passive:false });
  cv.addEventListener("mousedown", function(e){ pStart(e.clientX, e.clientY); });
  cv.addEventListener("mouseup", function(e){ pEnd(e.clientX, e.clientY); });

  var PAD_KEYS = { jump:"pUp", slide:"pDown", left:"pLeft", right:"pRight" };
  var PAD_SWITCH_DIST = 18;
  var padEl = $("controls"), padPointers = {};

  function padDirection(e, current){
    var r = padEl.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    if (current && Math.hypot(dx, dy) < PAD_SWITCH_DIST) return current;
    var horizontal = Math.abs(dx) > Math.abs(dy);
    var next = horizontal ? (dx > 0 ? "right" : "left") : (dy > 0 ? "slide" : "jump");
    if (current && next !== current) {
      var ax = Math.abs(dx), ay = Math.abs(dy);
      if (Math.max(ax, ay) < Math.min(ax, ay) * 1.4) return current;
    }
    return next;
  }
  function padLight(kind, on){ $(PAD_KEYS[kind]).classList.toggle("on", on); }
  function padPress(kind){
    padLight(kind, true);
    if (kind === "slide") { isSlidePressed = true; act("slide"); }
    else act(kind);
  }
  function padRelease(kind){
    padLight(kind, false);
    if (kind === "slide") { isSlidePressed = false; player.sliding = false; }
  }
  padEl.addEventListener("touchstart", function(e){ e.preventDefault(); }, { passive:false });
  padEl.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  padEl.addEventListener("pointerdown", function(e){
    e.preventDefault();
    try { padEl.setPointerCapture(e.pointerId); } catch (err) {}
    var kind = padDirection(e, null);
    padPointers[e.pointerId] = kind;
    padPress(kind);
  });
  padEl.addEventListener("pointermove", function(e){
    var kind = padPointers[e.pointerId];
    if (!kind) return;
    var next = padDirection(e, kind);
    if (next === kind) return;
    padRelease(kind);
    padPointers[e.pointerId] = next;
    padPress(next);
  });
  function padEnd(e){
    var kind = padPointers[e.pointerId];
    if (!kind) return;
    delete padPointers[e.pointerId];
    padRelease(kind);
  }
  padEl.addEventListener("pointerup", padEnd);
  padEl.addEventListener("pointercancel", padEnd);

  function pushLog(text, ok){
    state.logs.push({ text:text, ok:ok });
  }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function judge(rec){
    rec.judged = true;
    var cond = COND_NAME[rec.type], need = NEED_ACT[rec.type], ok;
    if (rec.type === "log") ok = (player.jumping && player.y > 0.75);
    else if (rec.type === "ceil") ok = player.sliding;
    else ok = (rec.blocked.indexOf(player.lane) === -1);

    var did = player.jumping ? "점프" : (player.sliding ? "숙이기" : "차선이동");
    state.passed++;
    checkBestStage(state.passed);
    updateEnvironment();

    var line = "if(장애물==" + cond + ") " + need + "() → ";
    if (ok) { pushLog(line + "성공 ✅", true); }
    else { pushLog(line + "실패 ❌ // 실행:" + did, false); }
    updateHUD();

    if (!ok) { startHit(); return; }
    if (state.passed >= TOTAL) endGame(true);
  }

  function updateHUD(){
    renderWorld();
    elStage.textContent = state.passed;
    elStageFill.style.width = Math.min(100, state.passed / TOTAL * 100) + "%";
    elBest.textContent = bestStage;
  }

  function jumpCurve(r){
    return 1 - Math.pow(Math.abs(2 * r - 1), 2.6);
  }

  function updateHit(dt){
    hit.t += dt;
    var p = Math.min(1, hit.t / hit.dur);
    state.speed *= Math.max(0, 1 - dt * 12);
    var move = state.speed * dt;
    for (var i = 0; i < roadSegs.length; i++) roadSegs[i].position.z += move;
    for (var j = 0; j < obstacles.length; j++) obstacles[j].mesh.position.z += move;

    var e = 1 - Math.pow(1 - p, 3);
    playerObj.position.z = PLAYER_Z + e * 3.0;
    playerObj.position.y = Math.sin(Math.PI * Math.min(1, p * 1.25)) * 0.9;
    playerObj.rotation.z = -e * 1.35;
    var pd = playerObj.userData;
    pd.body.scale.set(1, 1, 1);
    if (poseMixer) poseMixer.update(dt);
    updateAtmosphere(dt, move);

    var sh = pd.shadow;
    sh.position.x = player.x + shadowDir * 0.35; sh.position.z = playerObj.position.z;
    sh.scale.set(1.8 + e * 0.8, 1.0, 1);

    var shake = (1 - p) * (1 - p) * 0.32;
    camera.position.x = player.x * 0.55 + (Math.random() - 0.5) * shake;
    camera.position.y = 5.0 + (Math.random() - 0.5) * shake;
    camera.lookAt(player.x * 0.6, 1.6 - e * 0.9, -12 + e * 11);
    updateBillboards();
    updateDust(dt);

    if (p >= 1) { hit.active = false; endGame(false); }
  }

  function update(dt){
    if (state.phase === "hit") { updateHit(dt); return; }
    if (state.phase !== "run") {
      if (poseMixer) poseMixer.update(0);
      updateAtmosphere(dt, 0);
      return;
    }

    state.targetSpeed = TIERS[tierOf(state.passed)].speed;
    state.speed += (state.targetSpeed - state.speed) * Math.min(1, dt * 3.0);

    var move = state.speed * dt;

    for (var i = 0; i < roadSegs.length; i++) {
      var s = roadSegs[i];
      s.position.z += move;
      if (s.position.z > 40) s.position.z -= SEG_LEN * SEG_COUNT;
    }

    if (state.spawned < TOTAL) {
      state.distSinceSpawn += move;
      var gap = TIERS[tierOf(state.spawned)].gap;
      if (state.spawned === 0 || state.distSinceSpawn >= gap) {
        state.distSinceSpawn = 0;
        spawn();
      }
    }

    for (var j = obstacles.length - 1; j >= 0; j--) {
      var rec = obstacles[j];
      rec.mesh.position.z += move;
      if (!rec.judged && rec.mesh.position.z >= PLAYER_Z) judge(rec);
      if (rec.mesh.position.z > 26) { recycle(rec); obstacles.splice(j, 1); }
    }

    var tx = LANES[player.lane];
    player.x += (tx - player.x) * Math.min(1, dt * 14);

    if (player.jumping) {
      player.tAct += dt;
      var r = player.tAct / player.durAct;
      if (r >= 1) {
        player.jumping = false; player.y = 0; player.squash = 1;
        puff(player.x, PLAYER_Z, 4, 1.6);
      }
      else player.y = jumpCurve(r) * player.jumpH;
    } else if (player.sliding) {
      player.tAct += dt;
      if (player.tAct >= player.durAct) {
        if (isSlidePressed) {
          player.tAct = 0;
          player.durAct = Math.min(0.62, Math.max(0.16, 11.0 / state.speed));
        } else { player.sliding = false; }
      }
    }

    player.animTime += dt * (state.speed * 0.45);

    playerObj.position.x = player.x;
    playerObj.position.y = player.sliding ? 0 : player.y;
    playerObj.rotation.z = (tx - player.x) * 0.09;
    playerObj.rotation.y = -(tx - player.x) * 0.12;

    if (!player.sliding && !player.jumping) setPose("run");
    if (poseActions.run) poseActions.run.timeScale = state.speed / RUN_CLIP_SPEED;
    if (poseMixer) poseMixer.update(dt);

    var pd = playerObj.userData;
    if (player.squash > 0) {
      player.squash = Math.max(0, player.squash - dt / 0.14);
      var q = Math.sin(player.squash * Math.PI) * 0.05;
      pd.body.scale.set(1 + q * 0.5, 1 - q, 1 + q * 0.5);
    } else {
      pd.body.scale.set(1, 1, 1);
    }
    updateDust(dt);
    updateAtmosphere(dt, move);

    var sh = pd.shadow, hr = Math.min(1, player.y / player.jumpH);
    var shrink = 1 - hr * 0.45;
    sh.position.x = player.x + shadowDir * (0.35 + hr * 0.9);
    sh.scale.set((player.sliding ? 2.5 : 1.8) * shrink, (player.sliding ? 1.2 : 1.0) * shrink, 1);
    sh.material.opacity = sh.material.userData.baseOpacity * (1 - hr * 0.55) * sunStrength;

    camera.position.x += (player.x * 0.55 - camera.position.x) * Math.min(1, dt * 6);
    camera.position.y = 5.0 + player.y * 0.28;
    camera.lookAt(player.x * 0.6, 1.6 + player.y * 0.3, -12);
    updateBillboards();
  }

  var curPR = 0, slowFrames = 0;
  function adaptQuality(dt){
    if (dt > 0.022) slowFrames++; else if (slowFrames > 0) slowFrames--;
    if (slowFrames <= 90) return;
    slowFrames = 0;
    if (curPR > MIN_PIXEL_RATIO) {
      curPR = Math.max(MIN_PIXEL_RATIO, curPR - 0.25);
      renderer.setPixelRatio(curPR);
      resize();
    } else if (bloomOn) {
      bloomOn = false;
    }
  }

  function loop(){
    requestAnimationFrame(loop);
    var dt = Math.min(0.05, clock.getDelta());
    adaptQuality(dt);
    update(dt);
    if (composer && bloomOn) composer.render(dt);
    else renderer.render(scene, camera);
  }

  var BASE_FOV = 62;
  var MAX_H_FOV = 84;
  var MIN_FOV = 46;

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    var aspect = w / h;
    renderer.setSize(w, h, false);
    if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); }
    camera.aspect = aspect;

    var fov = BASE_FOV;
    var halfH = Math.tan(MAX_H_FOV * Math.PI / 360);
    var limitFov = 2 * Math.atan(halfH / aspect) * 180 / Math.PI;
    if (limitFov < fov) fov = Math.max(MIN_FOV, limitFov);

    camera.fov = fov;
    camera.updateProjectionMatrix();
  }

  function startGame(){
    if (!assetsReady) return;
    for (var j = obstacles.length - 1; j >= 0; j--) { recycle(obstacles[j]); }
    obstacles.length = 0;

    state.phase = "run";
    state.speed = TIERS[0].speed;
    state.targetSpeed = TIERS[0].speed;
    state.spawned = 0; state.passed = 0; state.distSinceSpawn = 0;
    state.logs = [];

    player.lane = 1; player.x = 0; player.y = 0;
    player.jumping = false; player.sliding = false; player.animTime = 0; player.squash = 0;
    playerObj.position.set(0, 0, PLAYER_Z); playerObj.rotation.z = 0; playerObj.rotation.y = 0;
    setPose("run", true, 1);
    playerObj.userData.shadow.position.z = PLAYER_Z;
    for (var d = 0; d < dust.length; d++) dust[d].mesh.visible = false;
    hit.active = false;
    isSlidePressed = false;

    updateEnvironment();
    elStart.classList.add("hide");
    elResult.classList.add("hide");
    elTop.style.display = "flex";
    elCtrl.style.display = "grid";
    updateHUD();
    clock.getDelta();
  }

  function endGame(cleared){
    state.phase = "over";
    isSlidePressed = false;
    checkBestStage(state.passed);

    $("rTitle").textContent = cleared ? "완주했습니다" : "게임 종료";
    $("rStage").textContent = state.passed + " / " + TOTAL;
    $("rBest").textContent = bestStage + " / " + TOTAL;
    renderWorld();
    if (WR) WR.prompt(state.passed);

    var html = "";
    for (var i = 0; i < state.logs.length; i++) {
      html += '<div class="' + (state.logs[i].ok ? "ok" : "no") + '">' +
              String(i + 1) + ". " + esc(state.logs[i].text) + "</div>";
    }
    if (!html) html = '<div class="ok">// 판정 기록이 없습니다</div>';
    $("fullLog").innerHTML = html;
    elResult.classList.remove("hide");
  }

  $("startBtn").addEventListener("click", startGame);
  $("againBtn").addEventListener("click", startGame);

  var assetsReady = false;
  function boot(){
    if (!window.THREE) {
      document.body.innerHTML =
        '<div class="screen"><div class="card"><h2>라이브러리를 불러오지 못했습니다</h2>' +
        '<p>인터넷 연결을 확인한 뒤 페이지를 새로 고쳐 주세요.</p></div></div>';
      return;
    }
    elTop.style.display = "none";
    elCtrl.style.display = "none";
    var sb = $("startBtn"), label = sb.textContent;
    sb.disabled = true; sb.textContent = "이미지 불러오는 중…";
    preloadAssets(function(){
      initThree();
      updateBillboards();
      assetsReady = true;
      sb.disabled = false; sb.textContent = label;
      loop();
    });
  }
  boot();
})();
</script>
</body>
</html>
