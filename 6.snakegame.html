<!DOCTYPE html>
<html lang="ko">
<head>
<script charset="utf-8" src="firebase-config.js"></script>
<script charset="utf-8" src="access-guard.js" data-game="snakegame"></script>
<script charset="utf-8" src="world-record.js"></script>
<meta charset="UTF-8">
<link rel="stylesheet" href="theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>스네이크</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="정보 수업용 링크 모음">
<meta property="og:title" content="스네이크">
<meta property="og:description" content="정보 수업용 링크 모음">
<meta property="og:url" content="https://cornsilktea.github.io/6.snakegame.html">
<meta property="og:image" content="https://cornsilktea.github.io/icon-512.png">
<meta name="twitter:card" content="summary">
<style>
  :root {
    --bg: #F4F6F1;
    --board-bg: #FFFFFF;
    --ink: #1B2B20;
    --ink-soft: #5B6B5E;
    --control-bg: #FFFFFF;
    --control-border: #24402F;
    --control-active: #EAF0E6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sg-font);
  }

  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .wrap {
    width: 100%;
    max-width: min(480px, 68vh);
    margin: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .title-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    letter-spacing: 0.02em;
  }

  .title-row h1 {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
    color: var(--ink);
  }

  .title-row .sub {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .board-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--board-bg);
    border: 2px solid var(--ink);
    border-radius: 4px;
    overflow: hidden;
  }

  @supports not (aspect-ratio: 1 / 1) {
    .board-frame { height: 0; padding-top: 100%; }
    .board-frame > canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(244, 246, 241, 0.94);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
  }

  .overlay.hidden { display: none; }

  .overlay p.msg {
    font-size: 14px;
    color: var(--ink);
    margin: 0;
    line-height: 1.6;
    max-width: 320px;
  }

  .stat-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat .label {
    color: var(--ink-soft);
    font-size: 11px;
  }

  .stat.world { align-items: flex-end; text-align: right; }
  .stat .who { font-size: 10px; color: var(--ink-soft); white-space: nowrap; }

  .stat .value {
    font-size: 16px;
    font-weight: 700;
  }

  .btn {
    font-family: inherit;
    font-size: 13px;
    background: var(--control-bg);
    color: var(--ink);
    border: 1.5px solid var(--control-border);
    border-radius: 4px;
    padding: 10px 16px;
    cursor: pointer;
    min-width: 44px;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active { background: var(--control-active); }

  .controls {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 44px);
    grid-template-rows: repeat(3, 44px);
    gap: 6px;
  }

  .dpad .btn { padding: 0; }
  .dpad .empty { visibility: hidden; }

  .side-controls {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .hint {
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.6;
  }

  [hidden]{display:none !important;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="title-row">
      <h1>SNAKE</h1>
      <span class="sub" id="speedLabel">SPEED 1</span>
    </div>

    <div class="board-frame">
      <canvas id="board"></canvas>
      <div class="overlay" id="overlay">
        <p class="msg" id="overlayMsg">방향키 또는 아래 버튼으로<br>움직이면 시작합니다</p>
        <button class="btn" id="restartBtn">다시 시작</button>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat">
        <span class="label">SCORE</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="label">BEST</span>
        <span class="value" id="best">0</span>
      </div>
      <div class="stat world">
        <span class="label">WORLD BEST</span>
        <span class="value" id="world">-</span>
        <span class="who" id="worldWho"></span>
      </div>
      <div class="stat world" id="clsStat" hidden>
        <span class="label">CLASS BEST</span>
        <span class="value" id="clsVal">-</span>
        <span class="who" id="clsWho"></span>
      </div>
    </div>

    <div class="controls">
      <div class="dpad">
        <div class="empty"></div>
        <button class="btn" data-dir="up">▲</button>
        <div class="empty"></div>
        <button class="btn" data-dir="left">◀</button>
        <button class="btn" data-dir="down">▼</button>
        <button class="btn" data-dir="right">▶</button>
      </div>
      <div class="side-controls">
        <button class="btn" id="pauseBtn">일시정지</button>
      </div>
    </div>

    <p class="hint">방향키/WASD로 이동, 스페이스바로 일시정지</p>
  </div>

<script>
(function () {
  const COLS = 20, ROWS = 20;
  const COLOR_GRID = '#E4E8DE', COLOR_FOOD = '#B33951', COLOR_SNAKE = '#24402F', COLOR_SNAKE_HEAD = '#1B2B20';
  const BUTTON_DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const worldEl = document.getElementById('world');
  const worldWhoEl = document.getElementById('worldWho');
  const speedLabel = document.getElementById('speedLabel');
  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlayMsg');
  const restartBtn = document.getElementById('restartBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const classStat = document.getElementById('clsStat');
  const classVal = document.getElementById('clsVal');
  const classWho = document.getElementById('clsWho');

  let cellSize, snake, dir, nextDir, food, score, best, tickMs, timer, running, started, paused;

  const BEST_KEY = 'snake_best_v1';

  const WR = window.WorldRecord ? WorldRecord('snakegame') : null;
  function renderWorld() {
    if (WR && WR.rec) { worldEl.textContent = WR.value(); worldWhoEl.textContent = WR.who(); }
    else { worldEl.textContent = (WR && !WR.loaded) ? '…' : '-'; worldWhoEl.textContent = ''; }
    const classRecord = WR && WR.cls;
    if (classRecord) {
      classStat.hidden = false;
      classVal.textContent = classRecord.rec ? classRecord.value() : (classRecord.loaded ? '-' : '…');
      classWho.textContent = classRecord.rec ? classRecord.who() : '';
    }
  }
  if (WR) { WR.onChange(renderWorld); WR.load(); }
  renderWorld();

  function loadBest() {
    try {
      const v = parseInt(localStorage.getItem(BEST_KEY), 10);
      return isNaN(v) ? 0 : v;
    } catch (e) { return 0; }
  }

  function saveBest(v) {
    try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {}
  }

  function resizeCanvas() {
    const frame = canvas.parentElement;
    const size = frame.clientWidth;
    canvas.width = size;
    canvas.height = size;
    cellSize = size / COLS;
    draw();
  }
  window.addEventListener('resize', resizeCanvas);

  function resetState() {
    snake = [
      { x: 9, y: 10 },
      { x: 8, y: 10 },
      { x: 7, y: 10 }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    tickMs = 140;
    started = false;
    paused = false;
    running = true;
    placeFood();
    scoreEl.textContent = score;
    speedLabel.textContent = 'SPEED 1';
    overlayMsg.innerHTML = '방향키 또는 아래 버튼으로<br>움직이면 시작합니다';
    overlay.classList.remove('hidden');
    pauseBtn.textContent = '일시정지';
    draw();
  }

  function placeFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function setDir(x, y) {
    if (!running) return;
    if (!started) {
      started = true;
      overlay.classList.add('hidden');
      startLoop();
    } else if (paused) {
      togglePause();
    }
    if (dir.x === -x && dir.y === -y) return;
    nextDir = { x, y };
  }

  function startLoop() {
    clearInterval(timer);
    timer = setInterval(tick, tickMs);
  }

  function tick() {
    if (paused || !running) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 1;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        saveBest(best);
        bestEl.textContent = best;
      }
      if (score % 5 === 0 && tickMs > 60) {
        tickMs -= 10;
        speedLabel.textContent = 'SPEED ' + (Math.floor(score / 5) + 1);
        startLoop();
      }
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    overlayMsg.innerHTML = '게임 오버<br>점수 ' + score + '점';
    overlay.classList.remove('hidden');
    if (WR) WR.prompt(score);
  }

  function togglePause() {
    if (!started || !running) return;
    paused = !paused;
    pauseBtn.textContent = paused ? '계속하기' : '일시정지';
    overlayMsg.innerHTML = paused ? '일시정지됨' : '';
    overlay.classList.toggle('hidden', !paused);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = COLOR_GRID;
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * cellSize, 0);
      ctx.lineTo(i * cellSize, canvas.height);
      ctx.stroke();
    }
    for (let i = 1; i < ROWS; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * cellSize);
      ctx.lineTo(canvas.width, i * cellSize);
      ctx.stroke();
    }

    ctx.fillStyle = COLOR_FOOD;
    roundRect(food.x * cellSize + 2, food.y * cellSize + 2, cellSize - 4, cellSize - 4, 4);
    ctx.fill();

    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? COLOR_SNAKE_HEAD : COLOR_SNAKE;

      roundRect(seg.x * cellSize + 1, seg.y * cellSize + 1, cellSize - 2, cellSize - 2, 3);
      ctx.fill();
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function restartGame() {
    clearInterval(timer);
    resetState();
  }

  const ARROW_DIRS = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
  };

  const CODE_DIRS = {
    KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0]
  };

  function dirFromKey(e) {
    return ARROW_DIRS[e.key] || CODE_DIRS[e.code] || null;
  }

  function steer(direction) {
    if (!running) {
      restartGame();
      return;
    }
    setDir(direction[0], direction[1]);
  }

  document.addEventListener('keydown', (e) => {
    const direction = dirFromKey(e);
    if (direction) {
      e.preventDefault();
      steer(direction);
      return;
    }
    if (e.key === ' ') {
      togglePause();
      e.preventDefault();
    }
  });

  document.querySelectorAll('.dpad .btn').forEach(btn => {
    btn.addEventListener('click', () => steer(BUTTON_DIRS[btn.dataset.dir]));
  });

  pauseBtn.addEventListener('click', togglePause);

  restartBtn.addEventListener('click', restartGame);

  best = loadBest();
  bestEl.textContent = best;
  resetState();
  resizeCanvas();
})();
</script>
</body>
</html>
