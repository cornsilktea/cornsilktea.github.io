<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정보 수업용 링크 모음</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5f6f8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수업 자료">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: Pretendard, -apple-system, "Segoe UI", "맑은 고딕", sans-serif;
    background: #f5f6f8; color: #111827;
  }
  header { max-width: 1400px; margin: 0 auto 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #6b7280; margin: 0 0 12px; }
  #search {
    width: 100%; max-width: 360px; padding: 8px 10px;
    border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;
  }

  .notice {
    max-width: 1400px; margin: 0 auto 16px;
    padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px;
    background: #fff; font-size: 13px; color: #6b7280;
  }
  .notice[hidden] { display: none; }

  .layout {
    max-width: 1600px; margin: 0 auto;
    display: flex; align-items: stretch; gap: 24px;
    min-height: calc(100vh - 110px);
  }

  .grid {
    flex: 0 0 50%;
    align-content: start;
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .card {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 14px; background: #fff;
    border: 1px solid #d1d5db; border-radius: 8px;
    text-decoration: none; color: inherit;
  }
  .card:hover { border-color: #2563eb; background: #f8faff; }
  .num {
    flex: 0 0 26px; height: 26px; line-height: 26px; text-align: center;
    font-size: 13px; font-weight: 600; color: #2563eb;
    background: #eff6ff; border-radius: 4px;
  }
  .title { font-size: 16px; font-weight: 600; margin: 0; }
  .memo { font-size: 13px; color: #6b7280; margin: 2px 0 0; }

  .card.locked { background: #fafafa; color: #6b7280; cursor: pointer; }
  .card.locked:hover { border-color: #d1d5db; background: #fafafa; }
  .card.locked .num { color: #9ca3af; background: #f3f4f6; }
  .card.locked .title { color: #6b7280; }
  .lock {
    display: inline-block; margin-top: 6px; padding: 3px 8px;
    font-size: 12px; color: #6b7280;
    background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 999px;
  }
  .empty {
    grid-column: 1 / -1;
    padding: 24px; text-align: center; font-size: 14px; color: #9ca3af;
    background: #fafafa; border: 1px dashed #d1d5db; border-radius: 8px;
  }

  .qr-panel {
    flex: 0 0 50%;
    position: sticky; top: 24px; align-self: flex-start;
    background: #fff; border: 1px solid #d1d5db; border-radius: 12px;
    padding: 24px; text-align: center;
  }
  .qr-panel img {
    width: 100%; max-width: 460px; height: auto;
    border: 1px solid #e5e7eb; border-radius: 8px;
  }
  .qr-panel p { margin: 16px 0 0; font-size: 15px; color: #374151; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #fff; border: 1px solid #d1d5db; border-radius: 8px;
    padding: 12px 16px; font-size: 14px; color: #111827;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  .toast[hidden] { display: none; }

  @media (max-width: 900px) {
    body { padding: 16px; }
    .layout { flex-direction: column; gap: 16px; min-height: 0; }
    .grid, .qr-panel { flex: 1 1 auto; }
    .qr-panel { position: static; }
  }
</style>
</head>

  <input id="search" type="text" placeholder="제목·설명으로 검색">
</header>

  function toList(data) {
    var out = [];
    Object.keys(data || {}).forEach(function (slug) {
      var g = data[slug] || {};
      if (!g.title || !g.url) return;
      out.push({
        slug: slug,
        title: g.title,
        url: g.url,
        memo: g.memo || "",
        open: g.open === true,
        order: typeof g.order === "number" ? g.order : 999
      });
    });
    out.sort(function (a, b) {
      return a.order - b.order || a.title.localeCompare(b.title, "ko");
    });
    return out;
  }

  function render() {
    grid.innerHTML = "";
    var shown = games.filter(function (g) {
      if (!keyword) return true;
      return (g.title + " " + g.memo).toLowerCase().indexOf(keyword) !== -1;
    });

    if (shown.length === 0) {
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = games.length === 0
        ? "아직 등록된 수업 자료가 없어요."
        : "검색 결과가 없어요.";
      grid.appendChild(e);
      return;
    }

    shown.forEach(function (g, i) {
      var card = document.createElement(g.open ? "a" : "div");
      card.className = g.open ? "card" : "card locked";
      if (g.open) {
        card.href = g.url;
        if (!standalone) {
          card.target = "_blank";
          card.rel = "noopener noreferrer";
        }
      } else {
        card.addEventListener("click", function () {
          showToast("🔒 " + g.title + " — 선생님이 아직 열지 않았어요.");
        });
      }

      var num = document.createElement("span");
      num.className = "num";
      num.textContent = String(i + 1);

      var box = document.createElement("span");
      var t = document.createElement("p");
      t.className = "title";
      t.textContent = g.title;
      box.appendChild(t);
      if (g.memo) {
        var m = document.createElement("p");
        m.className = "memo";
        m.textContent = g.memo;
        box.appendChild(m);
      }
      if (!g.open) {
        var lockBadge = document.createElement("span");
        lockBadge.className = "lock";
        lockBadge.textContent = "🔒 선생님이 아직 열지 않았어요";
        box.appendChild(lockBadge);
      }

      card.appendChild(num);
      card.appendChild(box);
      grid.appendChild(card);
    });
  }

  function load() {
    if (!cfg.isReady()) {
      setNotice("설정이 아직 끝나지 않았어요. firebase-config.js 를 먼저 채워 주세요.");
      games = [];
      render();
      return;
    }
    fetch(cfg.dbPath("games"), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(function (data) {
        setNotice("");
        games = toList(data);
        var next = JSON.stringify(games);
        if (next !== snapshot) { snapshot = next; render(); }
      })
      .catch(function () {
        setNotice("📡 연결을 확인하는 중이에요. 인터넷이 연결되면 자동으로 최신 상태가 됩니다.");
        games = games.map(function (g) {
          return { slug: g.slug, title: g.title, url: g.url, memo: g.memo, order: g.order, open: false };
        });
        var next = JSON.stringify(games);
        if (next !== snapshot) { snapshot = next; render(); }
      });
  }

  document.getElementById("search").addEventListener("input", function (e) {
    keyword = e.target.value.trim().toLowerCase();
    render();
  });

  load();
  setInterval(load, (cfg.POLL_SECONDS || 5) * 1000);

  /* 홈 화면에 추가했을 때 앱처럼 열리게 하는 등록 (실패해도 사이트는 그대로 동작) */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>

</body>
</html>
