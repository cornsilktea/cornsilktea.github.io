<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>
/* 밝기(다크 모드): 화면을 그리기 전에 정해야 밝은 화면이 잠깐 번쩍이지 않는다. 키는 admin.html 과 같이 쓴다. */
(function(){
  try{
    var t = localStorage.getItem('portal_theme');
    if(!t){ t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 링크 미리보기(제어판 제목) 시작 — 링크제목맞추기.ps1 이 채웁니다. 손으로 고치지 마세요. -->
<title>정보 수업용 링크 모음</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="정보 수업용 링크 모음">
<meta property="og:title" content="정보 수업용 링크 모음">
<meta property="og:description" content="수업 시간에 쓰는 정보 수업 자료 모음입니다.">
<meta property="og:url" content="https://cornsilktea.github.io/">
<meta property="og:image" content="https://cornsilktea.github.io/icon-512.png">
<meta name="twitter:card" content="summary">
<!-- 링크 미리보기 끝 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4F6F1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수업 자료">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512-maskable.png">
<style>
  /* 크기·간격·색은 theme.css 의 --sg-* 단계만 씁니다(다크 모드를 얹을 때 그대로 쓰려고). */
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: var(--sg-s6);
    font-family: var(--sg-font); font-size: var(--sg-fs-md); line-height: var(--sg-lh);
    background: var(--sg-bg); color: var(--sg-ink);
    -webkit-text-size-adjust: 100%;
  }

  /* 머리: 제목 줄 → 설명 → (보기 전환 + 검색) 한 줄 */
  header {
    max-width: 1600px; margin: 0 auto var(--sg-s6);
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--sg-s3);
  }
  .title-row { flex: 1 1 100%; display: flex; align-items: center; gap: var(--sg-s3); margin: 0; }
  h1 { font-size: var(--sg-fs-2xl); font-weight: 800; line-height: var(--sg-lh-tight); letter-spacing: -.01em; margin: 0; }
  .admin-link {
    display: inline-flex; align-items: center; height: 32px; padding: 0 var(--sg-s3);
    border: 1px solid var(--sg-line-mid); border-radius: var(--sg-radius); background: var(--sg-panel);
    color: var(--sg-ink-mid); font-size: var(--sg-fs-sm); font-weight: 700; text-decoration: none;
    box-shadow: var(--sg-shadow-sm);
  }
  .admin-link:hover { border-color: var(--sg-primary); color: var(--sg-ink); }
  .sub { flex: 1 1 100%; font-size: var(--sg-fs-sm); line-height: var(--sg-lh); color: var(--sg-ink-soft); margin: 0; }
  #search {
    flex: 1 1 240px; max-width: 360px; min-height: 44px; padding: 0 var(--sg-s3);
    font-family: inherit; font-size: var(--sg-fs-md); color: var(--sg-ink);
    background: var(--sg-panel); border: 1px solid var(--sg-line-mid); border-radius: var(--sg-radius);
    box-shadow: var(--sg-shadow-sm);
  }
  #search::placeholder { color: var(--sg-ink-faint); }
  #search:focus { outline: none; border-color: var(--sg-primary); box-shadow: 0 0 0 3px var(--sg-focus); }

  /* 버튼: 모든 버튼이 같은 테두리·모서리·상태 표시를 씁니다. */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: var(--sg-s2) var(--sg-s4);
    font-family: inherit; font-size: var(--sg-fs-md); font-weight: 700; line-height: var(--sg-lh-tight);
    text-align: center; text-decoration: none; word-break: keep-all;
    background: var(--sg-panel); color: var(--sg-ink);
    border: 1px solid var(--sg-line-strong); border-radius: var(--sg-radius); cursor: pointer;
    box-shadow: var(--sg-shadow-sm);
    transition: background-color .12s, border-color .12s, box-shadow .12s, transform .06s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { background: var(--sg-panel-alt); }
  .btn:active { transform: translateY(1px); box-shadow: none; }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--sg-focus); }
  .btn[aria-pressed="true"] {
    background: var(--sg-primary); border-color: var(--sg-primary); color: var(--sg-primary-ink);
  }
  .btn:disabled {
    color: var(--sg-ink-faint); background: var(--sg-panel-alt); border-color: var(--sg-line);
    box-shadow: none; transform: none; cursor: default;
  }

  /* 보기 전환: 두 버튼을 붙인 한 덩어리(누른 쪽만 짙게) */
  .viewtabs {
    display: flex; flex: 0 1 360px; margin: 0; padding: var(--sg-s1);
    background: var(--sg-panel-alt); border: 1px solid var(--sg-line); border-radius: var(--sg-radius);
  }
  .viewtabs .btn {
    flex: 1 1 0; min-height: 40px; border-color: transparent; background: transparent;
    color: var(--sg-ink-soft); box-shadow: none;
  }
  .viewtabs .btn:hover { color: var(--sg-ink); background: var(--sg-panel); }
  .viewtabs .btn[aria-pressed="true"] {
    background: var(--sg-panel); color: var(--sg-ink); border-color: var(--sg-line-mid); box-shadow: var(--sg-shadow-sm);
  }

  .notice {
    max-width: 1600px; margin: 0 auto var(--sg-s4);
    padding: var(--sg-s3) var(--sg-s4);
    background: var(--sg-panel); border: 1px solid var(--sg-line-mid); border-left: 3px solid var(--sg-warn);
    border-radius: var(--sg-radius);
    font-size: var(--sg-fs-sm); line-height: var(--sg-lh); color: var(--sg-ink-mid);
  }

  .layout {
    max-width: 1600px; margin: 0 auto;
    display: flex; align-items: stretch; gap: var(--sg-s6);
    min-height: calc(100vh - 120px);
  }
  .main { flex: 0 0 50%; min-width: 0; }

  /* 구조도 */
  .crumbs { display: flex; align-items: center; gap: var(--sg-s3); margin: 0 0 var(--sg-s4); flex-wrap: wrap; min-height: 44px; }
  .crumb-text { font-size: var(--sg-fs-md); font-weight: 700; color: var(--sg-ink-mid); word-break: keep-all; }
  .nodes {
    display: grid; gap: var(--sg-s3); margin: 0 0 var(--sg-s3);
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .nodes:empty { display: none; }
  .nodes .btn {
    min-height: 64px; flex-direction: column; gap: var(--sg-s1);
    border-color: var(--sg-line-mid); font-size: var(--sg-fs-lg);
  }
  .nodes .btn:hover { border-color: var(--sg-primary); box-shadow: var(--sg-shadow-md); }
  .nodes .btn small { font-size: var(--sg-fs-xs); font-weight: 400; color: var(--sg-ink-soft); }

  /* 자료 카드 (구조도·리스트 공용): [번호] 제목·메모·단원 [열림/잠김 배지] */
  .grid {
    align-content: start;
    display: grid; gap: var(--sg-s3);
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }
  .card {
    position: relative;
    display: flex; gap: var(--sg-s3); align-items: flex-start;
    padding: var(--sg-s4); background: var(--sg-panel);
    border: 1px solid var(--sg-line-mid); border-radius: var(--sg-radius);
    box-shadow: var(--sg-shadow-sm);
    text-decoration: none; color: inherit;
    transition: border-color .12s, box-shadow .12s, transform .06s;
    -webkit-tap-highlight-color: transparent;
  }
  .card > span:not(.num) { flex: 1 1 auto; min-width: 0; }
  a.card:hover { border-color: var(--sg-primary); box-shadow: var(--sg-shadow-md); }
  a.card:active { transform: translateY(1px); box-shadow: none; }
  a.card:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--sg-focus); }
  /* 상태 배지: 열린 자료는 '열림', 잠긴 자료는 '잠김' — 색만이 아니라 글자로도 구분 */
  .card::after {
    flex: none; align-self: flex-start;
    padding: 2px var(--sg-s2); border-radius: 999px;
    font-size: var(--sg-fs-xs); font-weight: 700; line-height: 1.5; white-space: nowrap;
  }
  a.card::after { content: "열림"; color: var(--sg-ok); background: var(--sg-ok-soft); }
  .num {
    flex: 0 0 28px; height: 28px; line-height: 28px; text-align: center;
    font-size: var(--sg-fs-sm); font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--sg-primary); background: var(--sg-primary-soft); border-radius: var(--sg-radius);
  }
  .title { font-size: var(--sg-fs-lg); font-weight: 700; line-height: var(--sg-lh-tight); margin: 3px 0 0; word-break: keep-all; }
  .memo { font-size: var(--sg-fs-sm); line-height: var(--sg-lh); color: var(--sg-ink-soft); margin: var(--sg-s1) 0 0; }
  .units {
    font-size: var(--sg-fs-xs); line-height: var(--sg-lh); color: var(--sg-ink-soft);
    margin: var(--sg-s2) 0 0; padding-top: var(--sg-s2); border-top: 1px solid var(--sg-line);
  }

  .card.locked {
    background: var(--sg-bg); border-style: dashed; box-shadow: none;
    color: var(--sg-ink-soft); cursor: pointer;
  }
  .card.locked::after { content: "🔒 잠김"; color: var(--sg-ink-soft); background: var(--sg-panel-alt); }
  .card.locked .num { color: var(--sg-ink-faint); background: var(--sg-panel-alt); }
  .card.locked .title { color: var(--sg-ink-soft); }
  .card.locked .units { border-top-color: var(--sg-line-mid); }
  .lock {
    display: inline-block; margin-top: var(--sg-s2); padding: 2px var(--sg-s2);
    font-size: var(--sg-fs-xs); line-height: 1.5; color: var(--sg-ink-soft);
    background: var(--sg-panel-alt); border-radius: 999px;
  }
  .empty {
    grid-column: 1 / -1;
    padding: var(--sg-s6); text-align: center; font-size: var(--sg-fs-md); color: var(--sg-ink-soft);
    background: var(--sg-panel-alt); border: 1px dashed var(--sg-line-mid); border-radius: var(--sg-radius);
  }

  .qr-panel {
    flex: 0 0 calc(50% - var(--sg-s6));
    position: sticky; top: var(--sg-s6); align-self: flex-start;
    background: var(--sg-panel); border: 1px solid var(--sg-line-mid); border-radius: var(--sg-radius);
    box-shadow: var(--sg-shadow-sm);
    padding: var(--sg-s6); text-align: center;
  }
  .qr-panel canvas {
    display: block; margin: 0 auto;
    width: 100%; max-width: 460px; height: auto;
    border: 1px solid var(--sg-line); border-radius: var(--sg-radius);
  }
  .qr-panel p { margin: var(--sg-s4) 0 0; font-size: var(--sg-fs-lg); font-weight: 700; color: var(--sg-ink-mid); }
  .qr-panel .qr-change { margin-top: var(--sg-s4); padding-top: var(--sg-s4); border-top: 1px solid var(--sg-line); }

  /* 첫 화면: 학년·반 고르기 (전자칠판에서 선생님이 누릅니다 — 버튼 크기 유지) */
  .class-pick { max-width: 1100px; margin: 0 auto; }
  .class-pick h2 {
    display: flex; align-items: center; gap: var(--sg-s3);
    font-size: var(--sg-fs-xl); font-weight: 800; margin: var(--sg-s8) 0 var(--sg-s3); color: var(--sg-ink-mid);
  }
  .class-pick h2:first-child { margin-top: var(--sg-s2); }
  .class-pick h2::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--sg-line-mid); }
  .class-grid {
    display: grid; gap: var(--sg-s4);
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
  .class-grid .btn { min-height: 110px; font-size: 24px; font-weight: 800; border-width: 1.5px; }
  .class-grid .btn:hover { border-color: var(--sg-primary); box-shadow: var(--sg-shadow-md); }
  /* 대회서버 버튼: 반 버튼과 헷갈리지 않게 보색(#D97B4F) 테두리로 구분 */
  .class-grid .contest-btn { grid-column: span 2; border-color: #D97B4F; color: #D97B4F; }
  .class-grid .contest-btn:hover { border-color: #D97B4F; }
  @media (max-width: 720px) {
    .class-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sg-s3); }
    .class-grid .btn { min-height: 72px; font-size: 20px; }
  }

  .toast {
    position: fixed; left: 50%; bottom: var(--sg-s6); transform: translateX(-50%);
    max-width: calc(100% - var(--sg-s8));
    padding: var(--sg-s3) var(--sg-s4); border-radius: var(--sg-radius);
    background: var(--sg-ink); color: var(--sg-primary-ink);
    font-size: var(--sg-fs-md); line-height: var(--sg-lh); text-align: center;
    box-shadow: var(--sg-shadow-lg); z-index: 50;
  }

  [hidden] { display: none !important; }

  @media (max-width: 900px) {
    body { padding: var(--sg-s4); }
    header { margin-bottom: var(--sg-s4); }
    .layout { flex-direction: column; min-height: 0; gap: var(--sg-s4); }
    .main { flex: 1 1 auto; }
    .qr-panel { flex: 1 1 auto; position: static; width: 100%; padding: var(--sg-s4); }
  }
  @media (max-width: 720px) {
    h1 { font-size: 20px; }
    .viewtabs, #search { flex: 1 1 100%; max-width: none; }
    .qr-panel canvas { max-width: 320px; }
  }
  .copyright {
    position: fixed; right: var(--sg-s2); bottom: calc(4px + env(safe-area-inset-bottom, 0px)); z-index: 1000;
    padding: 2px var(--sg-s2); border-radius: var(--sg-radius); background: var(--sg-bg-glass);
    color: var(--sg-ink-soft); font-size: 11px; line-height: 1.4; text-decoration: none; white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1 id="pageTitle">수업용 링크 모음</h1>
    <a class="admin-link" id="adminLink" href="admin.html" hidden>제어판</a>
    <button id="themeToggle" type="button" class="btn" aria-label="화면 밝기 전환"></button>
  </div>
  <p class="sub" id="pageSub">전자칠판에서 학년과 반을 고르면 그 반의 QR 코드와 수업 자료 목록이 나옵니다.</p>
  <div class="viewtabs" id="viewtabs" hidden>
    <button class="btn" id="tabTree" type="button" aria-pressed="false">구조도 보기</button>
    <button class="btn" id="tabList" type="button" aria-pressed="false">리스트 보기</button>
  </div>
  <input id="search" type="text" placeholder="제목·설명으로 검색" hidden>
</header>

<p class="notice" id="notice" hidden></p>

<!-- 첫 화면: 학년·반 고르기. 반을 고르면 index.html?c=1-1 처럼 반별 주소로 이동합니다. -->
<div class="class-pick" id="classView" hidden>
  <h2>1학년</h2>
  <div class="class-grid" id="classGrade1"></div>
  <h2>2학년</h2>
  <div class="class-grid" id="classGrade2"></div>
  <!-- 대회서버: 반과 상관없이 모두 함께 들어오는 화면(contest.html). 제어판의 '대회서버' 버튼으로 잠금을 켜고 끕니다. -->
  <h2>대회</h2>
  <div class="class-grid">
    <a class="btn contest-btn" href="contest.html">🏆 대회서버</a>
  </div>
</div>

<div class="layout" id="layout" hidden>
  <div class="main">

    <div id="treeView" hidden>
      <div class="crumbs">
        <button class="btn" id="treeBack" type="button" hidden>← 뒤로</button>
        <span class="crumb-text" id="crumbText"></span>
      </div>
      <div class="nodes" id="treeNodes"></div>
      <div class="grid" id="treeGrid"></div>
    </div>

    <div id="listView" hidden>
      <div class="grid" id="listGrid"></div>
    </div>

  </div>

  <!-- 반별 QR: 이 반의 주소(index.html?c=1-1)를 그립니다. 학생은 이 QR 로만 들어옵니다. -->
  <div class="qr-panel">
    <canvas id="qrCanvas" width="460" height="460"></canvas>
    <p>디벗 카메라로 QR 코드를 촬영하세요</p>
    <p class="qr-change"><a class="btn" id="changeClass" href="index.html">다른 반 고르기</a></p>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script charset="utf-8" src="firebase-config.js"></script>
<script charset="utf-8" src="data.js"></script>
<script charset="utf-8" src="qrcode.js"></script>
<script>
/* 밝기 전환 버튼: <html data-theme> 를 바꾸고 localStorage('portal_theme')에 남긴다(admin.html 과 같은 키).
   주소창 색(theme-color)도 배경색에 맞춘다. */
(function () {
  var btn = document.getElementById("themeToggle");
  var themeColor = document.querySelector('meta[name="theme-color"]');
  function current() { return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
  function paint() {
    var dark = current() === "dark";
    btn.textContent = dark ? "☀️ 밝게" : "🌙 어둡게";
    if (themeColor) themeColor.setAttribute("content", dark ? "#12180F" : "#F4F6F1");
  }
  btn.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("portal_theme", next); } catch (e) {}
    paint();
  });
  paint();
})();
</script>
<script>
/* 수업 자료 목록은 선생님 화면(admin.html)에서 관리합니다.
   단원 구조와 학급 목록은 data.js 에 있습니다. 이 파일은 고칠 필요가 없습니다.

   주소에 ?c=1-1 (학년-반) 이 없으면 학년·반 고르기 화면을,
   있으면 그 반의 QR 코드와 자료 목록을 보여 줍니다.
   잠금은 반마다 따로(Firebase portal/classes/<반>/<자료>) 두므로,
   자료 링크에도 ?c= 를 붙여 열어야 그 반의 잠금 상태를 따릅니다. */
(function () {
  "use strict";

  var cfg = window.PORTAL_CONFIG;
  var D = window.PORTAL_DATA;

  var notice = document.getElementById("notice");
  var toast = document.getElementById("toast");
  var searchBox = document.getElementById("search");
  var treeView = document.getElementById("treeView");
  var listView = document.getElementById("listView");
  var treeNodes = document.getElementById("treeNodes");
  var treeGrid = document.getElementById("treeGrid");
  var listGrid = document.getElementById("listGrid");
  var treeBack = document.getElementById("treeBack");
  var crumbText = document.getElementById("crumbText");
  var tabTree = document.getElementById("tabTree");
  var tabList = document.getElementById("tabList");

  var klass = D.classFromSearch(location.search);   /* 지금 보고 있는 반(없으면 null) */
  /* 대회서버는 화면이 따로 있습니다(대회용 자료만 보이는 contest.html) */
  if (klass && klass.contest) { location.replace("contest.html"); return; }

  var keyword = "";
  var games = [];
  var toastTimer = null;
  var snapshot = "";
  var view = "tree";                  /* "tree" | "list" */
  var nav = { sem: null, path: [] };  /* 구조도에서 지금 열어 둔 폴더 */

  /* 홈 화면 아이콘으로 연 경우(전체화면)에는 새 탭을 띄우지 않는다 */
  var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
                   || window.navigator.standalone === true;

  function setNotice(text) {
    if (text) { notice.textContent = text; notice.hidden = false; }
    else { notice.hidden = true; }
  }

  function showToast(text) {
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, 2600);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  /* 선생님이 한 번이라도 제어판에 로그인한 기기에서만 '제어판' 버튼을 보여 줍니다.
     학생 기기에는 나타나지 않습니다. */
  try {
    if (localStorage.getItem("portal_teacher") === "1") {
      document.getElementById("adminLink").hidden = false;
    }
  } catch (e) {}

  /* ---------- 첫 화면: 학년·반 고르기 ---------- */
  function classHref(id) {
    return location.pathname + "?c=" + id;
  }

  function renderClassPick() {
    document.getElementById("classView").hidden = false;
    document.getElementById("pageTitle").textContent = "수업용 링크 모음";
    document.getElementById("pageSub").textContent =
      "전자칠판에서 학년과 반을 고르면 그 반의 QR 코드와 수업 자료 목록이 나옵니다.";
    D.CLASSES.forEach(function (c) {
      var a = el("a", "btn", c.label);
      a.href = classHref(c.id);
      document.getElementById("classGrade" + c.grade).appendChild(a);
    });
  }

  if (!klass) {
    renderClassPick();
    return;
  }

  /* ---------- 반이 정해진 화면 ---------- */
  document.getElementById("layout").hidden = false;
  document.getElementById("viewtabs").hidden = false;
  document.getElementById("pageSub").hidden = true;      /* 반 화면에서는 제목만 남깁니다 */

  /* 반별 QR: 학생이 이 QR 을 찍으면 학년·반이 정해진 목록으로 들어옵니다 */
  (function drawQr() {
    var url = location.origin + classHref(klass.id);
    try {
      window.QR.draw(document.getElementById("qrCanvas"), url, { size: 460, margin: 3, dark: "#1B2B20" });
    } catch (e) {
      showToast("QR 을 그리지 못했어요. 화면을 새로고침해 주세요.");
    }
  })();

  /* 자료 링크에 반을 붙입니다(잠금이 반마다 다르므로) */
  function gameHref(url) {
    return url + (url.indexOf("?") === -1 ? "?" : "&") + "c=" + klass.id;
  }

  /* 구조도 폴더 버튼: "1학년 2학기 (인공지능과 미래사회)" 처럼 괄호가 있으면
     괄호 안은 아랫줄에 작게 놓는다 (한 줄에서 어색하게 잘리지 않도록). */
  function folderButton(label) {
    var b = el("button", "btn");
    b.type = "button";
    var m = /^(.*?)\s*\((.+)\)\s*$/.exec(label);
    if (m) {
      b.appendChild(el("span", null, m[1]));
      b.appendChild(el("small", null, m[2]));
    } else {
      b.textContent = label;
    }
    return b;
  }

  /* ---------- 자료 카드 (구조도·리스트 공용) ---------- */
  function card(g, showUnits) {
    var node = document.createElement(g.open ? "a" : "div");
    node.className = g.open ? "card" : "card locked";
    if (g.open) {
      node.href = gameHref(g.url);
      if (!standalone) {
        node.target = "_blank";
        node.rel = "noopener noreferrer";
      }
    } else {
      node.addEventListener("click", function () {
        showToast("🔒 " + g.title + " — 선생님이 " + klass.label + "에 아직 열지 않았어요.");
      });
    }

    node.appendChild(el("span", "num", String(g.num)));

    var box = document.createElement("span");
    box.appendChild(el("p", "title", g.title));
    if (g.memo) box.appendChild(el("p", "memo", g.memo));
    if (showUnits) {
      var label = D.unitsLabel(g.units);
      box.appendChild(el("p", "units", label || "아직 단원이 정해지지 않았어요"));
    }
    if (!g.open) box.appendChild(el("span", "lock", "🔒 선생님이 아직 열지 않았어요"));

    node.appendChild(box);
    return node;
  }

  function fillGrid(grid, list, showUnits, emptyText) {
    grid.innerHTML = "";
    if (list.length === 0) {
      grid.appendChild(el("div", "empty", emptyText));
      return;
    }
    list.forEach(function (g) { grid.appendChild(card(g, showUnits)); });
  }

  /* ---------- 구조도 ---------- */
  function renderTree() {
    treeNodes.innerHTML = "";
    treeGrid.innerHTML = "";

    /* 첫 화면: 학년·학기 고르기 */
    if (!nav.sem) {
      treeBack.hidden = true;
      crumbText.textContent = "학년과 학기를 고르세요";
      D.SEMESTERS.forEach(function (s) {
        var b = folderButton(s.label);
        b.addEventListener("click", function () {
          nav = { sem: s.id, path: [] };
          renderTree();
        });
        treeNodes.appendChild(b);
      });
      return;
    }

    var sem = D.semesterById(nav.sem);
    treeBack.hidden = false;
    crumbText.textContent = [sem.label].concat(nav.path).join(" > ");

    var here = D.browse(nav.sem, nav.path);

    /* 최하위 단원이면 그 안의 자료를 보여 준다 */
    if (here.terminal) {
      var inUnit = games.filter(function (g) {
        return g.units.indexOf(here.unit.id) !== -1;
      });
      fillGrid(treeGrid, inUnit, false, "아직 등록된 자료가 없습니다.");
      return;
    }

    /* 아니면 다음 단계 폴더를 보여 준다 */
    here.children.forEach(function (name) {
      var b = folderButton(name);
      b.addEventListener("click", function () {
        nav.path = nav.path.concat([name]);
        renderTree();
      });
      treeNodes.appendChild(b);
    });
  }

  treeBack.addEventListener("click", function () {
    if (nav.path.length > 0) nav.path = nav.path.slice(0, -1);
    else nav.sem = null;
    renderTree();
  });

  /* ---------- 리스트 ---------- */
  function renderList() {
    var shown = games.filter(function (g) {
      if (!keyword) return true;
      return (g.title + " " + g.memo).toLowerCase().indexOf(keyword) !== -1;
    });
    /* 열려 있는 자료를 먼저, 잠긴 자료를 뒤에 (같은 무리 안에서는 원래 순서) */
    var opened = shown.filter(function (g) { return g.open; });
    var locked = shown.filter(function (g) { return !g.open; });
    shown = opened.concat(locked);
    fillGrid(listGrid, shown, true, games.length === 0
      ? "아직 등록된 수업 자료가 없어요."
      : "검색 결과가 없어요.");
  }

  /* ---------- 보기 전환 ---------- */
  function setView(next, remember) {
    view = (next === "list") ? "list" : "tree";
    tabTree.setAttribute("aria-pressed", String(view === "tree"));
    tabList.setAttribute("aria-pressed", String(view === "list"));
    treeView.hidden = view !== "tree";
    listView.hidden = view !== "list";
    searchBox.hidden = view !== "list";   /* 검색은 리스트에서만 씁니다 */
    if (remember) { try { localStorage.setItem("portal_view", view); } catch (e) {} }
    render();
  }

  function render() {
    if (view === "tree") renderTree();
    else renderList();
  }

  tabTree.addEventListener("click", function () { setView("tree", true); });
  tabList.addEventListener("click", function () { setView("list", true); });

  searchBox.addEventListener("input", function (e) {
    keyword = e.target.value.trim().toLowerCase();
    if (view === "list") renderList();
  });

  /* ---------- 불러오기 ---------- */
  function numbered(list) {
    list.forEach(function (g, i) { g.num = i + 1; });
    return list;
  }

  function readJson(path) {
    return fetch(cfg.dbPath(path), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }

  /* 학생 목록에 나오는 자료는 제어판에 등록된 것뿐입니다.
     저장소에 파일만 올라온 자료는 제어판(admin.html)에만 보이고,
     선생님이 단원을 정해 등록해야 여기에 나타납니다.
     열림·잠김은 games 의 값이 아니라 이 반의 classes/<반>/<자료> 값을 봅니다. */
  function load() {
    if (!cfg.isReady()) {
      setNotice("설정이 아직 끝나지 않았어요. firebase-config.js 를 먼저 채워 주세요.");
      games = [];
      render();
      return;
    }
    Promise.all([readJson("games"), readJson("classes/" + klass.id)])
      .then(function (res) {
        var data = res[0], opens = res[1] || {};
        setNotice("");
        games = numbered(D.toList(data));
        games.forEach(function (g) { g.open = opens[g.rawSlug] === true || opens[g.slug] === true; });
        var next = JSON.stringify(games);
        if (next !== snapshot) { snapshot = next; render(); }
      })
      .catch(function () {
        setNotice("📡 연결을 확인하는 중이에요. 인터넷이 연결되면 자동으로 최신 상태가 됩니다.");
        games.forEach(function (g) { g.open = false; });
        var next = JSON.stringify(games);
        if (next !== snapshot) { snapshot = next; render(); }
      });
  }

  var saved = null;
  try { saved = localStorage.getItem("portal_view"); } catch (e) {}
  setView(saved || "tree", false);

  load();
  setInterval(load, (cfg.POLL_SECONDS || 5) * 1000);
})();

/* 홈 화면에 추가했을 때 앱처럼 열리게 하는 등록 (실패해도 사이트는 그대로 동작) */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
