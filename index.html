<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 링크 미리보기(제어판 제목) 시작 — 링크제목맞추기.ps1 이 채웁니다. 손으로 고치지 마세요. -->
<title>정보 수업용 링크 모음</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="정보 수업용 링크 모음">
<meta property="og:title" content="정보 수업용 링크 모음">
<meta property="og:description" content="수업 시간에 쓰는 정보 수업 자료 모음입니다.">
<meta property="og:url" content="https://cornsilktea.github.io/">
<meta property="og:image" content="https://cornsilktea.github.io/icon-512.png">
<meta name="twitter:card" content="summary">
<!-- 링크 미리보기 끝 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4F6F1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수업 자료">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512-maskable.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family:var(--sg-font);
    background: var(--sg-bg); color: var(--sg-ink);
  }
  header { max-width: 1600px; margin: 0 auto 16px; }
  .title-row { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; }
  h1 { font-size: 22px; margin: 0; }
  .admin-link {
    display: inline-flex; align-items: center; height: 30px; padding: 0 12px;
    border: 1.5px solid var(--sg-line-strong); border-radius:var(--sg-radius); background: #fff;
    color: var(--sg-ink); font-size: 13px; font-weight: 600; text-decoration: none;
  }
  .admin-link:hover { border-color: var(--sg-primary); background: var(--sg-panel-alt); }
  .sub { font-size: 13px; color: var(--sg-ink-soft); margin: 0 0 12px; }
  #search {
    width: 100%; max-width: 360px; padding: 8px 10px;
    border: 1px solid var(--sg-line-mid); border-radius:var(--sg-radius); font-size: 14px;
  }

  /* 모든 버튼은 같은 크기·같은 색으로 씁니다. */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 44px; padding: 10px 14px;
    font-family: inherit; font-size: 14px; font-weight: 500;
    text-align: center; text-decoration: none; word-break: keep-all;
    background: #fff; color: var(--sg-ink);
    border: 1.5px solid var(--sg-line-strong); border-radius:var(--sg-radius); cursor: pointer;
  }
  .btn:hover { border-color: var(--sg-primary); background: var(--sg-panel-alt); }
  .btn[aria-pressed="true"] { border-color: var(--sg-primary); background: var(--sg-primary-soft); }
  .btn:disabled { color: var(--sg-ink-faint); background: var(--sg-panel-alt); border-color: var(--sg-line); cursor: default; }

  .viewtabs { display: flex; gap: 8px; margin: 0 0 12px; max-width: 360px; }
  .viewtabs .btn { flex: 1 1 0; }

  .notice {
    max-width: 1600px; margin: 0 auto 16px;
    padding: 10px 12px; border: 1px solid var(--sg-line-mid); border-radius:var(--sg-radius);
    background: #fff; font-size: 13px; color: var(--sg-ink-soft);
  }

  .layout {
    max-width: 1600px; margin: 0 auto;
    display: flex; align-items: stretch; gap: 24px;
    min-height: calc(100vh - 110px);
  }
  .main { flex: 0 0 50%; min-width: 0; }

  /* 구조도 */
  .crumbs { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; flex-wrap: wrap; }
  .crumb-text { font-size: 14px; color: var(--sg-ink-mid); word-break: keep-all; }
  .nodes {
    display: grid; gap: 12px; margin: 0 0 12px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .nodes .btn { min-height: 60px; flex-direction: column; gap: 2px; }
  .nodes .btn small { font-size: 12px; font-weight: 400; color: var(--sg-ink-soft); }

  /* 자료 카드 (구조도·리스트 공용) */
  .grid {
    align-content: start;
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .card {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 14px; background: #fff;
    border: 1px solid var(--sg-line-mid); border-radius:var(--sg-radius);
    text-decoration: none; color: inherit;
  }
  .card:hover { border-color: var(--sg-primary); background: var(--sg-panel-alt); }
  .num {
    flex: 0 0 26px; height: 26px; line-height: 26px; text-align: center;
    font-size: 13px; font-weight: 600; color: var(--sg-primary);
    background: var(--sg-primary-soft); border-radius: 4px;
  }
  .title { font-size: 16px; font-weight: 600; margin: 0; }
  .memo { font-size: 13px; color: var(--sg-ink-soft); margin: 2px 0 0; }
  .units { font-size: 12px; color: var(--sg-ink-soft); margin: 6px 0 0; line-height: 1.6; }

  .card.locked { background: var(--sg-panel-alt); color: var(--sg-ink-soft); cursor: pointer; }
  .card.locked:hover { border-color: var(--sg-line-mid); background: var(--sg-panel-alt); }
  .card.locked .num { color: var(--sg-ink-faint); background: var(--sg-panel-alt); }
  .card.locked .title { color: var(--sg-ink-soft); }
  .lock {
    display: inline-block; margin-top: 6px; padding: 3px 8px;
    font-size: 12px; color: var(--sg-ink-soft);
    background: var(--sg-panel-alt); border: 1px solid var(--sg-line); border-radius:var(--sg-radius);
  }
  .empty {
    grid-column: 1 / -1;
    padding: 24px; text-align: center; font-size: 14px; color: var(--sg-ink-faint);
    background: var(--sg-panel-alt); border: 1px dashed var(--sg-line-mid); border-radius:var(--sg-radius);
  }

  .qr-panel {
    flex: 0 0 50%;
    position: sticky; top: 24px; align-self: flex-start;
    background: #fff; border: 1px solid var(--sg-line-mid); border-radius:var(--sg-radius);
    padding: 24px; text-align: center;
  }
  .qr-panel canvas {
    width: 100%; max-width: 460px; height: auto;
    border: 1px solid var(--sg-line); border-radius:var(--sg-radius);
  }
  .qr-panel p { margin: 16px 0 0; font-size: 15px; color: var(--sg-ink-mid); }
  .qr-panel .qr-change { margin-top: 18px; }

  /* 첫 화면: 학년·반 고르기 (전자칠판에서 선생님이 누릅니다) */
  .class-pick { max-width: 1100px; margin: 0 auto; }
  .class-pick h2 { font-size: 18px; margin: 24px 0 12px; color: var(--sg-ink-mid); }
  .class-grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
  .class-grid .btn { min-height: 110px; font-size: 24px; font-weight: 600; }
  @media (max-width: 720px) {
    .class-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .class-grid .btn { min-height: 72px; font-size: 20px; }
  }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    padding: 10px 16px; border-radius:var(--sg-radius);
    background: var(--sg-ink); color: #fff; font-size: 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); z-index: 50;
  }

  [hidden] { display: none !important; }

  @media (max-width: 900px) {
    body { padding: 16px; }
    .layout { flex-direction: column; min-height: 0; }
    .main { flex: 1 1 auto; }
    .qr-panel { flex: 1 1 auto; position: static; }
  }
  .copyright {
    position: fixed; right: 8px; bottom: calc(4px + env(safe-area-inset-bottom, 0px)); z-index: 1000;
    padding: 2px 8px; border-radius: var(--sg-radius); background: rgba(244,246,241,0.85);
    color: var(--sg-ink-soft); font-size: 11px; line-height: 1.4; text-decoration: none; white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1 id="pageTitle">수업용 링크 모음</h1>
    <a class="admin-link" id="adminLink" href="admin.html" hidden>제어판</a>
  </div>
  <p class="sub" id="pageSub">전자칠판에서 학년과 반을 고르면 그 반의 QR 코드와 수업 자료 목록이 나옵니다.</p>
  <div class="viewtabs" id="viewtabs" hidden>
    <button class="btn" id="tabTree" type="button" aria-pressed="false">구조도 보기</button>
    <button class="btn" id="tabList" type="button" aria-pressed="false">리스트 보기</button>
  </div>
  <input id="search" type="text" placeholder="제목·설명으로 검색" hidden>
</header>

<p class="notice" id="notice" hidden></p>

<!-- 첫 화면: 학년·반 고르기. 반을 고르면 index.html?c=1-1 처럼 반별 주소로 이동합니다. -->
<div class="class-pick" id="classView" hidden>
  <h2>1학년</h2>
  <div class="class-grid" id="classGrade1"></div>
  <h2>2학년</h2>
  <div class="class-grid" id="classGrade2"></div>
</div>

<div class="layout" id="layout" hidden>
  <div class="main">

    <div id="treeView" hidden>
      <div class="crumbs">
        <button class="btn" id="treeBack" type="button" hidden>← 뒤로</button>
        <span class="crumb-text" id="crumbText"></span>
      </div>
      <div class="nodes" id="treeNodes"></div>
      <div class="grid" id="treeGrid"></div>
    </div>

    <div id="listView" hidden>
      <div class="grid" id="listGrid"></div>
    </div>

  </div>

  <!-- 반별 QR: 이 반의 주소(index.html?c=1-1)를 그립니다. 학생은 이 QR 로만 들어옵니다. -->
  <div class="qr-panel">
    <canvas id="qrCanvas" width="460" height="460"></canvas>
    <p>디벗 카메라로 QR 코드를 촬영하세요</p>
    <p class="qr-change"><a class="btn" id="changeClass" href="index.html">다른 반 고르기</a></p>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script charset="utf-8" src="firebase-config.js"></script>
<script charset="utf-8" src="data.js"></script>
<script charset="utf-8" src="qrcode.js"></script>
<script>
/* 수업 자료 목록은 선생님 화면(admin.html)에서 관리합니다.
   단원 구조와 학급 목록은 data.js 에 있습니다. 이 파일은 고칠 필요가 없습니다.

   주소에 ?c=1-1 (학년-반) 이 없으면 학년·반 고르기 화면을,
   있으면 그 반의 QR 코드와 자료 목록을 보여 줍니다.
   잠금은 반마다 따로(Firebase portal/classes/<반>/<자료>) 두므로,
   자료 링크에도 ?c= 를 붙여 열어야 그 반의 잠금 상태를 따릅니다. */
(function () {
  "use strict";

  var cfg = window.PORTAL_CONFIG;
  var D = window.PORTAL_DATA;

  var notice = document.getElementById("notice");
  var toast = document.getElementById("toast");
  var searchBox = document.getElementById("search");
  var treeView = document.getElementById("treeView");
  var listView = document.getElementById("listView");
  var treeNodes = document.getElementById("treeNodes");
  var treeGrid = document.getElementById("treeGrid");
  var listGrid = document.getElementById("listGrid");
  var treeBack = document.getElementById("treeBack");
  var crumbText = document.getElementById("crumbText");
  var tabTree = document.getElementById("tabTree");
  var tabList = document.getElementById("tabList");

  var klass = D.classFromSearch(location.search);   /* 지금 보고 있는 반(없으면 null) */

  var keyword = "";
  var games = [];
  var toastTimer = null;
  var snapshot = "";
  var view = "tree";                  /* "tree" | "list" */
  var nav = { sem: null, path: [] };  /* 구조도에서 지금 열어 둔 폴더 */

  /* 홈 화면 아이콘으로 연 경우(전체화면)에는 새 탭을 띄우지 않는다 */
  var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
                   || window.navigator.standalone === true;

  function setNotice(text) {
    if (text) { notice.textContent = text; notice.hidden = false; }
    else { notice.hidden = true; }
  }

  function showToast(text) {
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, 2600);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  /* 선생님이 한 번이라도 제어판에 로그인한 기기에서만 '제어판' 버튼을 보여 줍니다.
     학생 기기에는 나타나지 않습니다. */
  try {
    if (localStorage.getItem("portal_teacher") === "1") {
      document.getElementById("adminLink").hidden = false;
    }
  } catch (e) {}

  /* ---------- 첫 화면: 학년·반 고르기 ---------- */
  function classHref(id) {
    return location.pathname + "?c=" + id;
  }

  function renderClassPick() {
    document.getElementById("classView").hidden = false;
    document.getElementById("pageTitle").textContent = "수업용 링크 모음";
    document.getElementById("pageSub").textContent =
      "전자칠판에서 학년과 반을 고르면 그 반의 QR 코드와 수업 자료 목록이 나옵니다.";
    D.CLASSES.forEach(function (c) {
      var a = el("a", "btn", c.label);
      a.href = classHref(c.id);
      document.getElementById("classGrade" + c.grade).appendChild(a);
    });
  }

  if (!klass) {
    renderClassPick();
    return;
  }

  /* ---------- 반이 정해진 화면 ---------- */
  document.getElementById("layout").hidden = false;
  document.getElementById("viewtabs").hidden = false;
  document.getElementById("pageSub").hidden = true;      /* 반 화면에서는 제목만 남깁니다 */

  /* 반별 QR: 학생이 이 QR 을 찍으면 학년·반이 정해진 목록으로 들어옵니다 */
  (function drawQr() {
    var url = location.origin + classHref(klass.id);
    try {
      window.QR.draw(document.getElementById("qrCanvas"), url, { size: 460, margin: 3, dark: "#1B2B20" });
    } catch (e) {
      showToast("QR 을 그리지 못했어요. 화면을 새로고침해 주세요.");
    }
  })();

  /* 자료 링크에 반을 붙입니다(잠금이 반마다 다르므로) */
  function gameHref(url) {
    return url + (url.indexOf("?") === -1 ? "?" : "&") + "c=" + klass.id;
  }

  /* 구조도 폴더 버튼: "1학년 2학기 (인공지능과 미래사회)" 처럼 괄호가 있으면
     괄호 안은 아랫줄에 작게 놓는다 (한 줄에서 어색하게 잘리지 않도록). */
  function folderButton(label) {
    var b = el("button", "btn");
    b.type = "button";
    var m = /^(.*?)\s*\((.+)\)\s*$/.exec(label);
    if (m) {
      b.appendChild(el("span", null, m[1]));
      b.appendChild(el("small", null, m[2]));
    } else {
      b.textContent = label;
    }
    return b;
  }

  /* ---------- 자료 카드 (구조도·리스트 공용) ---------- */
  function card(g, showUnits) {
    var node = document.createElement(g.open ? "a" : "div");
    node.className = g.open ? "card" : "card locked";
    if (g.open) {
      node.href = gameHref(g.url);
      if (!standalone) {
        node.target = "_blank";
        node.rel = "noopener noreferrer";
      }
    } else {
      node.addEventListener("click", function () {
        showToast("🔒 " + g.title + " — 선생님이 " + klass.label + "에 아직 열지 않았어요.");
      });
    }

    node.appendChild(el("span", "num", String(g.num)));

    var box = document.createElement("span");
    box.appendChild(el("p", "title", g.title));
    if (g.memo) box.appendChild(el("p", "memo", g.memo));
    if (showUnits) {
      var label = D.unitsLabel(g.units);
      box.appendChild(el("p", "units", label || "아직 단원이 정해지지 않았어요"));
    }
    if (!g.open) box.appendChild(el("span", "lock", "🔒 선생님이 아직 열지 않았어요"));

    node.appendChild(box);
    return node;
  }

  function fillGrid(grid, list, showUnits, emptyText) {
    grid.innerHTML = "";
    if (list.length === 0) {
      grid.appendChild(el("div", "empty", emptyText));
      return;
    }
    list.forEach(function (g) { grid.appendChild(card(g, showUnits)); });
  }

  /* ---------- 구조도 ---------- */
  function renderTree() {
    treeNodes.innerHTML = "";
    treeGrid.innerHTML = "";

    /* 첫 화면: 학년·학기 고르기 */
    if (!nav.sem) {
      treeBack.hidden = true;
      crumbText.textContent = "학년과 학기를 고르세요";
      D.SEMESTERS.forEach(function (s) {
        var b = folderButton(s.label);
        b.addEventListener("click", function () {
          nav = { sem: s.id, path: [] };
          renderTree();
        });
        treeNodes.appendChild(b);
      });
      return;
    }

    var sem = D.semesterById(nav.sem);
    treeBack.hidden = false;
    crumbText.textContent = [sem.label].concat(nav.path).join(" > ");

    var here = D.browse(nav.sem, nav.path);

    /* 최하위 단원이면 그 안의 자료를 보여 준다 */
    if (here.terminal) {
      var inUnit = games.filter(function (g) {
        return g.units.indexOf(here.unit.id) !== -1;
      });
      fillGrid(treeGrid, inUnit, false, "아직 등록된 자료가 없습니다.");
      return;
    }

    /* 아니면 다음 단계 폴더를 보여 준다 */
    here.children.forEach(function (name) {
      var b = folderButton(name);
      b.addEventListener("click", function () {
        nav.path = nav.path.concat([name]);
        renderTree();
      });
      treeNodes.appendChild(b);
    });
  }

  treeBack.addEventListener("click", function () {
    if (nav.path.length > 0) nav.path = nav.path.slice(0, -1);
    else nav.sem = null;
    renderTree();
  });

  /* ---------- 리스트 ---------- */
  function renderList() {
    var shown = games.filter(function (g) {
      if (!keyword) return true;
      return (g.title + " " + g.memo).toLowerCase().indexOf(keyword) !== -1;
    });
    /* 열려 있는 자료를 먼저, 잠긴 자료를 뒤에 (같은 무리 안에서는 원래 순서) */
    var opened = shown.filter(function (g) { return g.open; });
    var locked = shown.filter(function (g) { return !g.open; });
    shown = opened.concat(locked);
    fillGrid(listGrid, shown, true, games.length === 0
      ? "아직 등록된 수업 자료가 없어요."
      : "검색 결과가 없어요.");
  }

  /* ---------- 보기 전환 ---------- */
  function setView(next, remember) {
    view = (next === "list") ? "list" : "tree";
    tabTree.setAttribute("aria-pressed", String(view === "tree"));
    tabList.setAttribute("aria-pressed", String(view === "list"));
    treeView.hidden = view !== "tree";
    listView.hidden = view !== "list";
    searchBox.hidden = view !== "list";   /* 검색은 리스트에서만 씁니다 */
    if (remember) { try { localStorage.setItem("portal_view", view); } catch (e) {} }
    render();
  }

  function render() {
    if (view === "tree") renderTree();
    else renderList();
  }

  tabTree.addEventListener("click", function () { setView("tree", true); });
  tabList.addEventListener("click", function () { setView("list", true); });

  searchBox.addEventListener("input", function (e) {
    keyword = e.target.value.trim().toLowerCase();
    if (view === "list") renderList();
  });

  /* ---------- 불러오기 ---------- */
  function numbered(list) {
    list.forEach(function (g, i) { g.num = i + 1; });
    return list;
  }

  function readJson(path) {
    return fetch(cfg.dbPath(path), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }

  /* 학생 목록에 나오는 자료는 제어판에 등록된 것뿐입니다.
     저장소에 파일만 올라온 자료는 제어판(admin.html)에만 보이고,
     선생님이 단원을 정해 등록해야 여기에 나타납니다.
     열림·잠김은 games 의 값이 아니라 이 반의 classes/<반>/<자료> 값을 봅니다. */
  function load() {
    if (!cfg.isReady()) {
      setNotice("설정이 아직 끝나지 않았어요. firebase-config.js 를 먼저 채워 주세요.");
      games = [];
      render();
      return;
    }
    Promise.all([readJson("games"), readJson("classes/" + klass.id)])
      .then(function (res) {
        var data = res[0], opens = res[1] || {};
        setNotice("");
        games = numbered(D.toList(data));
        games.forEach(function (g) { g.open = opens[g.rawSlug] === true || opens[g.slug] === true; });
        var next = JSON.stringify(games);
        if (next !== snapshot) { snapshot = next; render(); }
      })
      .catch(function () {
        setNotice("📡 연결을 확인하는 중이에요. 인터넷이 연결되면 자동으로 최신 상태가 됩니다.");
        games.forEach(function (g) { g.open = false; });
        var next = JSON.stringify(games);
        if (next !== snapshot) { snapshot = next; render(); }
      });
  }

  var saved = null;
  try { saved = localStorage.getItem("portal_view"); } catch (e) {}
  setView(saved || "tree", false);

  load();
  setInterval(load, (cfg.POLL_SECONDS || 5) * 1000);
})();

/* 홈 화면에 추가했을 때 앱처럼 열리게 하는 등록 (실패해도 사이트는 그대로 동작) */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
